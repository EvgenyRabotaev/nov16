<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Крутка</title>
<style>

  :root {
    --bg0: #050714;
    --bg1: #0b1230;
    --text: #eef4ff;
    --muted: #9ab0d0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg0);
    color: var(--text);
    font-family: "Noto Serif", "Liberation Serif", Georgia, serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  #fx, #aurora, #vignette {
    position: fixed; inset: 0;
    pointer-events: none;
  }
  #fx { z-index: 4; }
  #aurora {
    z-index: 1;
    opacity: 0;
    transition: opacity 0.8s ease, background 0.8s ease;
    background: radial-gradient(ellipse at 50% 0%, transparent 0%, transparent 70%);
  }
  body.r3 #aurora { opacity: .85; background: radial-gradient(ellipse at 50% 18%, rgba(60,140,255,.45) 0%, rgba(20,50,120,.18) 42%, transparent 70%); }
  body.r4 #aurora { opacity: .9; background: radial-gradient(ellipse at 50% 18%, rgba(170,80,255,.5) 0%, rgba(70,20,130,.22) 42%, transparent 70%); }
  body.r5 #aurora { opacity: .95; background: radial-gradient(ellipse at 50% 18%, rgba(255,200,70,.5) 0%, rgba(140,90,10,.2) 45%, transparent 72%); }
  body.r6 #aurora { opacity: 1; background: radial-gradient(ellipse at 50% 18%, rgba(255,120,20,.58) 0%, rgba(160,40,0,.25) 45%, transparent 72%); }
  #vignette {
    z-index: 5;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.45) 100%);
  }
  #ground {
    position: fixed; left: 50%; top: 58%;
    width: min(46vw, 340px); height: 70px;
    transform: translate(-50%, 0);
    border-radius: 50%;
    pointer-events: none;
    z-index: 3;
    opacity: 0;
    background: radial-gradient(ellipse at center, var(--glow, rgba(120,180,255,.55)) 0%, transparent 70%);
    filter: blur(6px);
    transition: opacity .5s;
  }
  body.falling #ground { opacity: 1; }

  #hud {
    position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 16px;
    z-index: 10;
    background: rgba(8,14,36,.72);
    border: 1px solid rgba(130,180,255,.4);
    border-radius: 22px;
    padding: 7px 16px;
    font-family: "Segoe UI", system-ui, sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: .02em;
    box-shadow: 0 0 18px rgba(70,140,255,.25);
  }
  #hud b { color: #cfe6ff; }

  .screen {
    position: fixed; inset: 0;
    z-index: 8;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end;
    padding: 24px 20px calc(28px + env(safe-area-inset-bottom));
    transition: opacity .45s ease, visibility .45s;
  }
  .screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  #home { justify-content: center; }
  .title {
    font-size: clamp(36px, 8vw, 64px);
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    text-shadow: 0 0 28px rgba(120,180,255,.55);
    margin-bottom: 6px;
  }
  .sub {
    font-family: "Segoe UI", system-ui, sans-serif;
    color: var(--muted);
    font-size: 15px;
    margin-bottom: 42px;
  }
  .btn-main {
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 18px; font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: #10203a;
    background: linear-gradient(180deg, #f4fbff, #9cc8ff 55%, #6ea6f0);
    border: none;
    border-radius: 28px;
    padding: 14px 48px;
    cursor: pointer;
    box-shadow: 0 0 0 1px rgba(255,255,255,.4), 0 8px 28px rgba(80,150,255,.45), 0 0 40px rgba(80,150,255,.25);
    transition: transform .15s, filter .15s;
  }
  .btn-main:hover { transform: translateY(-1px) scale(1.03); filter: brightness(1.06); }
  .btn-main:active { transform: scale(.98); }
  .btn-main[disabled] { opacity: .45; cursor: default; transform: none; }
  .preview-row {
    display: flex; flex-wrap: wrap; gap: 10px;
    justify-content: center;
    margin-top: 36px;
    max-width: 560px;
  }
  .btn-r {
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 13px; font-weight: 600;
    letter-spacing: .04em;
    border-radius: 20px;
    padding: 9px 16px;
    cursor: pointer;
    border: 1px solid transparent;
    color: #fff;
    background: rgba(255,255,255,.06);
    transition: transform .15s, box-shadow .15s, background .15s;
  }
  .btn-r:hover { transform: translateY(-1px); }
  .btn-r.r3 { border-color: #5aa8ff; color: #cfe8ff; box-shadow: 0 0 14px rgba(80,160,255,.3); }
  .btn-r.r4 { border-color: #c070ff; color: #f0d8ff; box-shadow: 0 0 14px rgba(180,90,255,.3); }
  .btn-r.r5 { border-color: #ffc44a; color: #ffe9b0; box-shadow: 0 0 14px rgba(255,196,70,.3); }
  .btn-r.r6 { border-color: #ff8a1e; color: #ffd2a8; box-shadow: 0 0 14px rgba(255,130,30,.35); }
  .btn-r[hidden] { display: none; }
  .btn-r[disabled] { opacity: .4; cursor: default; transform: none; pointer-events: none; box-shadow: none; }
  #poolStatus {
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 14px;
    color: var(--muted);
    margin-top: 14px;
    min-height: 1.3em;
    text-align: center;
    max-width: 520px;
  }
  #poolStatus.empty {
    color: #ffd2a8;
    font-size: 16px;
    font-weight: 600;
  }
  .hint {
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 12px;
    color: #6e86aa;
    margin-top: 16px;
  }

  #reveal { justify-content: center; justify-content: safe center; overflow-y: auto; z-index: 9; gap: 0; }
  #reveal #btnClose { position: relative; z-index: 5; flex-shrink: 0; }
  .card-stage {
    margin-bottom: 18px;
    position: relative;
  }
  .card-glow {
    position: absolute; left: 50%; top: 50%;
    width: 140%; height: 120%;
    transform: translate(-50%,-50%);
    border-radius: 40%;
    filter: blur(28px);
    opacity: 0;
    pointer-events: none;
    z-index: 0;
  }
  .card-enter {
    position: relative;
    z-index: 1;
    /* +50% к прежним 300px, но не больше, чем оставляет 260px на имя+описание+кнопку
       (длинные тексты 5★, крупный шрифт). */
    width: min(450px, calc(100vw - 16px), max(255px, (100vh - 260px) * .75));
    width: min(450px, calc(100vw - 16px), max(255px, (100dvh - 260px) * .75));
    aspect-ratio: 3 / 4;
    flex: 0 0 auto;
    max-height: calc(100dvh - 260px);
    perspective: 1400px;
    opacity: 0;
    transform: scale(.42) translateY(36px);
  }
  .card-enter.show {
    animation: cardIn .85s cubic-bezier(.16,1,.3,1) forwards;
  }
  @keyframes cardIn {
    0%   { transform: scale(.42) translateY(36px); opacity: 0; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }
  .card {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform .95s cubic-bezier(.2,.7,.2,1);
  }
  .card.flip {
    transform: rotateY(180deg);
  }
  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 16px 50px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.15);
  }
  .face.front {
    transform: rotateY(180deg);
    background: #0a0a12;
  }
  .face.front img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .face.back {
    background:
      radial-gradient(circle at 50% 42%, rgba(255,255,255,.18), transparent 42%),
      linear-gradient(160deg, var(--back1, #1a3a70) 0%, var(--back0, #0a152c) 100%);
    display: flex; align-items: center; justify-content: center;
  }
  .face.back::after {
    content: "✦";
    font-size: 74px;
    color: var(--backStar, #9fd0ff);
    text-shadow: 0 0 24px var(--backStar, #9fd0ff);
    opacity: .9;
  }
  .meta {
    text-align: center;
    min-height: 0;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity .45s ease, transform .45s ease;
    position: relative;
    z-index: 4;
    text-shadow: 0 2px 12px rgba(0,0,0,.85), 0 0 18px rgba(0,0,0,.5);
  }
  .meta.on { opacity: 1; transform: none; }
  .cname {
    font-size: 30px;
    font-weight: 600;
  }
  .cnote {
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 19px;
    line-height: 1.5;
    color: #eef3ff;
    margin: 10px auto 0;
    max-width: min(560px, calc(100vw - 32px));
    white-space: pre-line;          /* абзацы из card_texts.md */
    overflow-wrap: anywhere;
    text-wrap: pretty;
  }
  .cnote:empty { display: none; }
  @media (max-width: 480px) { .cnote { font-size: 17px; line-height: 1.45; } .cname { font-size: 26px; } }
  @media (max-height: 800px) {
    .card-stage { margin-bottom: 10px; }
    .cnote { font-size: 16px; line-height: 1.4; margin-top: 6px; }
    .cname { font-size: 24px; }
    #btnClose { margin-top: 12px; }
    #reveal { padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); }
  }
  #btnClose {
    margin-top: 18px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .4s;
  }
  #btnClose.on { opacity: 1; pointer-events: auto; }

  body.shake-4 { animation: shake4 .4s linear; }
  body.shake-5 { animation: shake5 .55s linear; }
  body.shake-6 { animation: shake6 .75s linear; }
  @keyframes shake4 {
    0%,100%{transform:translate(0,0)}
    20%{transform:translate(-3px,2px)}
    40%{transform:translate(3px,-1px)}
    60%{transform:translate(-2px,1px)}
    80%{transform:translate(2px,-2px)}
  }
  @keyframes shake5 {
    0%,100%{transform:translate(0,0)}
    15%{transform:translate(-5px,3px)}
    30%{transform:translate(6px,-3px)}
    45%{transform:translate(-4px,2px)}
    60%{transform:translate(5px,-2px)}
    75%{transform:translate(-3px,3px)}
  }
  @keyframes shake6 {
    0%,100%{transform:translate(0,0)}
    10%{transform:translate(-8px,4px)}
    20%{transform:translate(8px,-4px)}
    30%{transform:translate(-6px,5px)}
    40%{transform:translate(7px,-3px)}
    50%{transform:translate(-5px,3px)}
    65%{transform:translate(6px,-4px)}
    80%{transform:translate(-3px,2px)}
  }


  /* ===== Паймон рассказывает про карточку (диалог как в genshin/index.html) ===== */
  @font-face { font-family: "QuestTeyvat"; src: url("../genshin/fonts/SofiaSans-cyrillic-ext.woff2") format("woff2"); font-weight: 400 700; font-display: swap; unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F; }
  @font-face { font-family: "QuestTeyvat"; src: url("../genshin/fonts/SofiaSans-cyrillic.woff2") format("woff2"); font-weight: 400 700; font-display: swap; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: "QuestTeyvat"; src: url("../genshin/fonts/SofiaSans-latin-ext.woff2") format("woff2"); font-weight: 400 700; font-display: swap; unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: "QuestTeyvat"; src: url("../genshin/fonts/SofiaSans-latin.woff2") format("woff2"); font-weight: 400 700; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  :root { --dlgH: clamp(160px, 24vh, 230px); --paimonW: min(300px, 28vw, 36vh); }
  body.paimon-on #reveal { padding-bottom: calc(var(--dlgH) + 6px); }
  body.paimon-on .card-enter {
    width: min(450px, calc(100vw - 16px), max(210px, (100vh - var(--dlgH) - 150px) * .75));
    width: min(450px, calc(100vw - 16px), max(210px, (100dvh - var(--dlgH) - 150px) * .75));
    max-height: calc(100dvh - var(--dlgH) - 150px);
  }
  body.paimon-on .card-stage { margin-bottom: 10px; }
  body.paimon-on .meta, body.paimon-on .card-stage, body.paimon-on #btnClose { flex-shrink: 0; }
  body.paimon-on .cnote { display: none; }
  body.paimon-on #btnClose { margin-top: 10px; padding: 11px 40px; font-size: 16px; }
  .chint { font-family: "Segoe UI", system-ui, sans-serif; font-size: 13px; color: #9ab0d0; margin-top: 2px; display: none; }
  body.paimon-on .chint.has { display: block; }
  .pdlg-wrap { position: fixed; inset: auto 0 0 0; height: var(--dlgH); z-index: 12; pointer-events: none; opacity: 0; transition: opacity .4s ease; overflow: visible; }
  .pdlg-wrap.on { opacity: 1; pointer-events: auto; }
  .pdlg {
    position: absolute; inset: 0;
    padding: 40px 4.5% 28px;
    padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to top, rgba(0,0,0,.88) 0%, rgba(0,0,0,.82) 28%, rgba(0,0,0,.62) 58%, rgba(0,0,0,.28) 82%, rgba(0,0,0,0) 100%);
    color: #f7f4ec; cursor: pointer;
    font-family: "QuestTeyvat", "Segoe UI", "Noto Sans", sans-serif;
    text-align: center;
  }
  .pdlg-who { font-weight: 700; font-size: 18px; letter-spacing: .16em; text-transform: uppercase; margin: 0 auto 10px; color: #c9b0ff; text-shadow: 0 2px 8px rgba(0,0,0,.9), 0 0 12px rgba(0,0,0,.45); text-align: center; }
  .pdlg-text { font-size: 23px; font-weight: 400; line-height: 1.5; min-height: 3em; max-width: none; width: 100%; margin: 0 auto; text-align: center; text-shadow: 0 2px 8px rgba(0,0,0,.85); white-space: pre-line; overflow-wrap: break-word; }
  .pdlg-cont { position: absolute; left: 50%; right: auto; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: 18px; height: 16px; opacity: 0; transition: opacity .18s ease; transform: translateX(-50%); }
  .pdlg-cont.show { opacity: 1; animation: contBob .75s ease-in-out infinite; }
  .pdlg-cont::before { content: ""; display: block; width: 0; height: 0; border-left: 9px solid transparent; border-right: 9px solid transparent; border-top: 11px solid #f3e2a8; filter: drop-shadow(0 0 6px rgba(243,226,168,.85)); }
  @keyframes contBob { 0%, 100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(5px); } }
  .pfairy {
    position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(100% - 12px);
    width: var(--paimonW); z-index: 2; pointer-events: none;
    filter: drop-shadow(0 8px 16px rgba(20,16,40,.55)) drop-shadow(0 0 12px rgba(180,160,255,.3));
    animation: fairyBob 3.2s ease-in-out infinite;
  }
  .pfairy img { width: 100%; height: auto; display: block; }
  @keyframes fairyBob { 0%, 100% { transform: translateY(0) rotate(-1.5deg); } 50% { transform: translateY(-9px) rotate(1.5deg); } }
  @media (max-width: 900px) {
    body.mystery-mode.paimon-on #home { padding-right: calc(var(--paimonW) + 10px); }
  }
  @media (max-width: 700px) {
    :root { --dlgH: clamp(180px, 28vh, 250px); --paimonW: min(168px, 42vw); }
    .pdlg { padding: 34px 18px 26px; padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px)); }
    .pdlg-text { font-size: 18px; }
    .pdlg-who { font-size: 15px; margin-bottom: 8px; }
    .pfairy { right: 4px; bottom: calc(100% - 24px); }
    /* карта по центру и чуть короче, чтобы Паймон стояла справа на полке под картой */
    body.paimon-on .card-enter {
      width: min(450px, calc(100vw - 16px), max(200px, (100dvh - var(--dlgH) - 220px) * .75));
      max-height: calc(100dvh - var(--dlgH) - 220px);
    }
    body.paimon-on .meta,
    body.paimon-on #btnClose { margin-right: calc(var(--paimonW) + 6px); }
  }
  /* обратная сторона карты после открытия: слова Жени */
  .face.back .backtext { display: none; }
  .card.texted .face.back::after { content: none; }
  .card.texted .face.back {
    background: radial-gradient(circle at 50% 30%, rgba(255,255,255,.14), transparent 60%), linear-gradient(160deg, var(--back1, #1a3a70) 0%, var(--back0, #0a152c) 100%);
    align-items: center; justify-content: center; padding: 9% 9%;
  }
  .card.texted .face.back .backtext {
    display: block; font-family: "Segoe UI", system-ui, sans-serif; color: #fff; text-align: center;
    font-size: 19px; line-height: 1.45; white-space: pre-line; text-shadow: 0 1px 6px rgba(0,0,0,.6);
    max-height: 100%; overflow: hidden;
  }
  .card.texted .face.back .backtext b { display: block; font-family: "Noto Serif", Georgia, serif; font-size: 1.25em; margin-bottom: .6em; }
  .card.texted { cursor: pointer; }

  /* ===== финальная секретная крутка ===== */
  #mystery { display: none; flex-direction: column; align-items: center; gap: 14px; cursor: pointer; margin-top: 8px; }
  #mystery.on { display: flex; }
  .orb { width: 120px; height: 120px; border-radius: 50%; position: relative;
    background: radial-gradient(circle at 50% 45%, #fff 0%, #ffe3a0 18%, #ffb347 38%, rgba(255,120,20,.55) 58%, transparent 72%);
    animation: orbPulse 1.8s ease-in-out infinite; filter: drop-shadow(0 0 30px rgba(255,150,40,.85)); }
  .orb::before, .orb::after { content: ""; position: absolute; inset: -30px; border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0 8%, rgba(255,210,120,.55) 10%, transparent 12% 33%, rgba(255,150,40,.5) 35%, transparent 37% 58%, rgba(255,210,120,.55) 60%, transparent 62% 83%, rgba(255,150,40,.5) 85%, transparent 87%);
    animation: orbSpin 7s linear infinite; mask: radial-gradient(circle, transparent 30%, #000 45%, transparent 72%); -webkit-mask: radial-gradient(circle, transparent 30%, #000 45%, transparent 72%); }
  .orb::after { animation-duration: 11s; animation-direction: reverse; opacity: .7; }
  @keyframes orbPulse { 0%,100% { transform: scale(.92); } 50% { transform: scale(1.08); } }
  @keyframes orbSpin { to { transform: rotate(360deg); } }
  .mystery-t { font-size: clamp(26px, 5vw, 40px); font-weight: 600; color: #ffd9a6; letter-spacing: .04em; text-shadow: 0 0 22px rgba(255,140,30,.75); animation: mysteryT 2.4s ease-in-out infinite; }
  @keyframes mysteryT { 0%,100% { opacity: .82; } 50% { opacity: 1; } }
  body.mystery-mode #home .title, body.mystery-mode #home .sub, body.mystery-mode #btnPull, body.mystery-mode #poolStatus { display: none; }
  body.mystery-mode #home { padding-bottom: calc(var(--dlgH) + 10px); }
  .card-enter.special .face.front { box-shadow: 0 16px 50px rgba(0,0,0,.55), 0 0 0 2px rgba(255,170,60,.8), 0 0 60px rgba(255,130,30,.6); }

  body.flying #home { pointer-events: none; }
  body.approach #ground { opacity: 1; }

  /* На экране гачи подсказок нет — кнопку HUD прячем. */
  .qhud-hint, .qhud-panel { display: none !important; }
</style>

<body>
<canvas id="fx"></canvas>
<div id="aurora"></div>
<div id="ground"></div>
<div id="vignette"></div>
<div id="hud">✦ Примогемы: <b id="pg">1800</b></div>

<div id="home" class="screen">
  <div class="title">Крутка</div>
  <p class="sub">Открытие за примогемы</p>
  <button class="btn-main" id="btnPull">Крутить · 100</button>
  <p id="poolStatus" aria-live="polite"></p>
  <div id="mystery" role="button" tabindex="0" aria-label="Ой, что это?">
    <div class="orb"></div>
    <div class="mystery-t">Ой, что это?</div>
  </div>
</div>

<div id="reveal" class="screen hidden">
  <div class="card-stage">
    <div class="card-glow" id="cardGlow"></div>

    /* v2: набор из 43 карточек (39 + 4 секретные). Старые ключи (v1) игнорируются.
     Сброс для теста: gacha/?resetgacha=1 (только гача) или start/?newgame=1 (весь квест). */
    const STORAGE_KEY = 'nov16_gacha_pulled_v2_43';
    (function () {
      const q = new URLSearchParams(location.search);
      if (q.get('resetgacha') !== '1') return;
      [localStorage, sessionStorage].forEach(st => { try { const ks = []; for (let i = 0; i < st.length; i++) ks.push(st.key(i)); ks.filter(k => /gacha/.test(k)).forEach(k => st.removeItem(k)); } catch (e) {} });
      try { q.delete('resetgacha'); history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '') + location.hash); } catch (e) {}
    })();
  const EMPTY_MSG = 'Все карточки из этого набора уже собраны';
  // Финальная «Женя»: открыта ли (ключ содержит «gacha» → чистится и ?resetgacha=1).
  const SPECIAL_KEY = 'nov16_gacha_zhenya_v1';
  // Отладка: gacha/?allcollected=1 — как будто все 43 собраны, «Женя» ещё нет.
  // Только в памяти: настоящий прогресс и примогемы в localStorage не трогаются.
  const DEBUG_ALL = /[?&]allcollected=1/.test(location.search);
  let specialDone = DEBUG_ALL ? false : (function () { try { return localStorage.getItem(SPECIAL_KEY) === '1'; } catch (e) { return false; } })();
  function saveSpecialDone() { specialDone = true; if (DEBUG_ALL) return; try { localStorage.setItem(SPECIAL_KEY, '1'); } catch (e) {} }

  function cardView(card) {

  function loadPulled() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(arr)) return [];
      const known = new Set(CARDS.map(c => c.id));
      return arr.filter(id => known.has(id));
    } catch (e) {
      return [];
    }
  }

  let pulledIds = DEBUG_ALL ? CARDS.map(c => c.id) : loadPulled();

  function savePulled() {
    if (DEBUG_ALL) return;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(pulledIds)); } catch (e) {}
  }

  function remainingCards() {
    return CARDS.filter(c => pulledIds.indexOf(c.id) === -1);

  function remainingOf(rarity) {
    return remainingCards().filter(c => c.rarity === rarity && !c.secret);
  }

  function markPulled(card) {
    if (!card || pulledIds.indexOf(card.id) !== -1) return;

  }

  function resetPool() {
    pulledIds = [];
    try { localStorage.removeItem(STORAGE_KEY); sessionStorage.removeItem(STORAGE_KEY); } catch (e) {}
    updatePoolUI();
  }

  // Берёт до n уникальных карт из оставшегося пула, без повторов внутри одной крутки.
  // Если осталось меньше, чем n, возвращает только оставшиеся.
  function drawFromPool(n, preferredRarity) {
    const countWanted = Math.max(0, n | 0);
    if (countWanted <= 0) return [];
    const taken = new Set(pulledIds);
    const out = [];

    function poolNow() {
      let list = CARDS.filter(c => !taken.has(c.id));
      if (preferredRarity != null) list = list.filter(c => c.rarity === preferredRarity && !c.secret);
      return list;
    }

    function pickOne(list) {
      if (!list.length) return null;
      if (preferredRarity != null) {
        return list[Math.floor(Math.random() * list.length)];
      }
      // 14.11: полный рандом — каждая оставшаяся карточка (включая секретные) с равной вероятностью.
      return list[Math.floor(Math.random() * list.length)];
    }

    const available = preferredRarity != null ? remainingOf(preferredRarity).length : remainingCards().length;
    const count = Math.min(countWanted, available);
    for (let i = 0; i < count; i++) {
      const card = pickOne(poolNow());
      if (!card) break;
      taken.add(card.id);
      out.push(card);
    }
    return out;
  }

  /* ----- Паймон: диалог внизу (как в genshin/index.html) ----- */

  let tLines = [], tIdx = 0, tTimer = 0, tTyping = false, tFull = '', tDone = null, talkIsIntro = false;

  function tStop() { if (tTimer) { clearTimeout(tTimer); tTimer = 0; } tTyping = false; }

    const tick = () => { i += 1; pText.textContent = tFull.slice(0, i); if (i < tFull.length) tTimer = setTimeout(tick, TYPE_MS); else { tTimer = 0; tFinish(); } };

  function startTalk(lines, onLast, intro) {

  function hexToRgb(hex) {
    const h = hex.replace('#', '');
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  }
  function rgba(hex, a) {
    const [r, g, b] = hexToRgb(hex);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }
  function lerpHex(a, b, t) {
    const A = hexToRgb(a), B = hexToRgb(b);
    const r = Math.round(A[0] + (B[0] - A[0]) * t);
    const g = Math.round(A[1] + (B[1] - A[1]) * t);
    const bl = Math.round(A[2] + (B[2] - A[2]) * t);
    return '#' + [r, g, bl].map(x => x.toString(16).padStart(2, '0')).join('');
  }
  function easeInOut(u) {
    return u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
  }
  function easeOut(u) { return 1 - (1 - u) * (1 - u); }

  function heartPath(ctx, x, y, s) {
    ctx.beginPath();
    for (let t = 0; t <= Math.PI * 2 + 0.1; t += 0.2) {
      const px = 16 * Math.pow(Math.sin(t), 3);
      const py = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      if (t === 0) ctx.moveTo(x + px * s, y + py * s);
      else ctx.lineTo(x + px * s, y + py * s);
    }
    ctx.closePath();
  }

  function drawSparkle(ctx, x, y, r, rot, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.beginPath();
    ctx.moveTo(0, -r);
    ctx.quadraticCurveTo(0, 0, r, 0);
    ctx.quadraticCurveTo(0, 0, 0, r);
    ctx.quadraticCurveTo(0, 0, -r, 0);
    ctx.quadraticCurveTo(0, 0, 0, -r);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.restore();
  }

  let specialFlight = false; // финальная «Женя»: старт золотом (а не серым) → оранжевый
  function colorsAt(elapsed, rarity) {

    let t = 0;
    if (elapsed > GRAY_MS) {
      t = Math.min(1, (elapsed - GRAY_MS) / COLOR_FADE_MS);
      t = t * t * (3 - 2 * t);
    }
    return {
      c1: lerpHex(GRAY.c1, c.c1, t),
      c2: lerpHex(GRAY.c2, c.c2, t),
      c3: lerpHex(GRAY.c3, c.c3, t),
      t
    };
  }

  function drawCalmBg(t) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#070b1c');
    g.addColorStop(0.55, '#0a1028');
    g.addColorStop(1, '#05060f');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    for (const s of bgStars) {
      const tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 0.001 * s.s + s.a * 8));
      ctx.fillStyle = 'rgba(220,230,255,' + (tw * 0.85) + ')';
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawFlightBg(now, dt) {
    const col = falling ? colorsAt(now - falling.t0, falling.r) : { c1: GRAY.c1, c2: GRAY.c2, t: 0 };
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#050714');
    g.addColorStop(0.5, '#080d22');
    g.addColorStop(1, '#04040c');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // subtle color wash after reveal
    if (col.t > 0.02) {
      const wash = ctx.createRadialGradient(W * 0.5, H * 0.38, 0, W * 0.5, H * 0.4, Math.max(W, H) * 0.7);
      wash.addColorStop(0, rgba(col.c1, 0.16 * col.t));
      wash.addColorStop(0.5, rgba(col.c3, 0.08 * col.t));
      wash.addColorStop(1, rgba(col.c3, 0));
      ctx.fillStyle = wash;
      ctx.fillRect(0, 0, W, H);
    }

    const vpX = W * 0.5;
    const vpY = H * (falling ? 0.36 : 0.42);
    const spd = flightSpeed; // units / sec
    const dz = spd * (dt / 1000);

    ctx.lineCap = 'round';
    const moving = spd > 0.05;
    const lookback = moving ? Math.min(0.42, 0.12 + spd * 0.42) : 0;
    for (const s of warp) {
      if (dz > 0) {
        s.z -= dz * (0.7 + s.a * 0.5);
        if (s.z <= 0.045) {
          s.x = (Math.random() - 0.5) * 2.6;
          s.y = (Math.random() - 0.5) * 2.6;
          s.z = 0.92 + Math.random() * 0.2;
        }
      }
      const z = Math.max(0.045, s.z);
      const zBack = Math.min(1.15, z + lookback * (0.7 + s.a * 0.5));
      const sc = 0.62 / z;
      const scb = 0.62 / zBack;
      const sx = vpX + s.x * W * sc * 0.72;
      const sy = vpY + s.y * H * sc * 0.72;
      const sxb = vpX + s.x * W * scb * 0.72;
      const syb = vpY + s.y * H * scb * 0.72;
      const near = Math.min(1, (1 - z) * 1.45);
      const a = s.a * near * (moving ? 0.75 : 0.7);
      const size = s.r * (0.8 + 1.8 * (1 - z));
      const tint = col.t > 0.35 && Math.hypot(sx - vpX, sy - vpY) < 120 ? col.c2 : '#e8eefc';
      if (moving) {
        ctx.strokeStyle = rgba(tint, Math.min(1, a * 1.15));
        ctx.lineWidth = Math.max(0.9, size * 0.95);
        ctx.beginPath();
        ctx.moveTo(sxb, syb);
        ctx.lineTo(sx, sy);
        ctx.stroke();
        ctx.fillStyle = rgba('#ffffff', Math.min(1, a));
        ctx.beginPath();
        ctx.arc(sx, sy, Math.max(0.7, size * 0.45), 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = rgba('#e8eefc', a);
        ctx.beginPath();
        ctx.arc(sx, sy, Math.max(0.7, size * 0.55), 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function drawBg(now, dt) {
    // ease flight speed toward target
    const tau = flightTarget < flightSpeed ? 140 : 240;
    const k = 1 - Math.exp(-(dt || 16) / tau);
    flightSpeed += (flightTarget - flightSpeed) * k;
    if (falling) drawFlightBg(now, dt);
    else {
      flightSpeed = 0;
      flightTarget = 0;
      drawCalmBg(now);
    }
  }

  function startFlight(rarity) {
    const c = FX[rarity];
    seedWarp();
    const xCruise0 = W * 0.58;
    const yCruise0 = H * 0.22;
    const xCruise1 = W * 0.54;
    const yCruise1 = H * 0.34;
    const x1 = W * 0.50;
    const y1 = H * 0.50;
    falling = {
      r: rarity,
      t0: performance.now(),
      xCruise0, yCruise0, xCruise1, yCruise1,
      ax: xCruise1, ay: yCruise1, // approach start, set when stopping ends
      x1, y1,
      path: [],
      x: xCruise0, y: yCruise0,
      px: xCruise0, py: yCruise0,
      companions: [],
      revealed: false,
      approaching: false,
      done: false,
      dirX: 0, dirY: 1
    };
    const cdx = xCruise1 - xCruise0, cdy = yCruise1 - yCruise0;
    const clen = Math.hypot(cdx, cdy) || 1;
    falling.dirX = cdx / clen;
    falling.dirY = cdy / clen;
    for (let i = 0; i < c.sparks; i++) {
      falling.companions.push({
        ang: (Math.PI * 2 * i) / Math.max(c.sparks, 1) + Math.random(),
        rad: 16 + Math.random() * (rarity * 6),
        spd: 0.002 + Math.random() * 0.004,
        size: 1.5 + Math.random() * 2
      });
    }
    flightSpeed = CRUISE * 0.35;
    flightTarget = CRUISE;
    document.body.classList.add('flying', 'falling');
    document.getElementById('ground').style.setProperty('--glow', rgba((specialFlight ? FX[5] : GRAY_BASE).c1, specialFlight ? 0.6 : 0.35));
  }

  function revealColor(rarity) {
    if (!falling || falling.revealed) return;
    falling.revealed = true;
    const c = FX[rarity];
    document.body.classList.add('r' + rarity);
    document.getElementById('ground').style.setProperty('--glow', rgba(c.c1, 0.7));
    const x = falling.x, y = falling.y;
    // color ignition pulse
    flashes.push({ a: rarity >= 5 ? 0.38 : 0.22, color: c.c2, decay: 0.038, x: x, y: y, rad: Math.max(W, H) * 0.45 });
    shockwaves.push({ x, y, r: 10, max: 200 + rarity * 36, a: 0.85, w: 2.5 + rarity * 0.4, color: c.c2, decay: 0.014 });
    shockwaves.push({ x, y, r: 4, max: 120 + rarity * 16, a: 0.7, w: 2, color: c.c1, decay: 0.02 });
    for (let i = 0; i < 18 + rarity * 6; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 0.8 + Math.random() * (2 + rarity * 0.4);
      spawn(x, y, {
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        size: 2 + Math.random() * 4,
        color: Math.random() < 0.4 ? c.c2 : c.c1,
        decay: 0.014 + Math.random() * 0.016,
        type: Math.random() < 0.4 ? 'glow' : 'spark',
        rot: Math.random(), vr: (Math.random() - 0.5) * 0.2
      });
    }
  }

  function burst(x, y, rarity) {
    const c = FX[rarity];
    const n = c.burst;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 1.2 + Math.random() * (3 + rarity * 1.1);
      spawn(x, y, {
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.2, g: 0.035,
        size: 1.2 + Math.random() * 3.2,
        color: Math.random() < 0.35 ? c.c2 : c.c1,
        decay: 0.008 + Math.random() * 0.012,
        type: 'spark', rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.25
      });
    }
    for (let i = 0; i < 18 + rarity * 3; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 0.3 + Math.random() * 1.4;
      spawn(x, y, {
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        size: 8 + Math.random() * 16, color: c.c1, decay: 0.018, type: 'glow'
      });
    }
    for (let i = 0; i < c.hearts; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.8;
      spawn(x, y, {
        vx: Math.cos(a) * (0.8 + Math.random() * 1.6),
        vy: Math.sin(a) * (1.2 + Math.random() * 2.2),
        g: -0.008, size: 0.35 + Math.random() * 0.45,
        color: i % 2 ? '#4ea8ff' : c.c1, decay: 0.006, type: 'heart',
        rot: (Math.random() - 0.5) * 0.5
      });
    }
    if (specialFlight) {
      for (let i = 0; i < 46; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 1 + Math.random() * 4.5;
        spawn(x, y, { vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1, g: -0.004, size: 0.45 + Math.random() * 0.7,
          color: i % 3 ? '#4ea8ff' : '#ffb347', decay: 0.004 + Math.random() * 0.004, type: 'heart', rot: (Math.random() - 0.5) * 0.6 });
      }
      shockwaves.push({ x, y, r: 6, max: Math.max(W, H), a: 0.8, w: 5, color: '#ffd27a', decay: 0.008 });
      shockwaves.push({ x, y, r: 2, max: Math.max(W, H) * 0.8, a: 0.7, w: 3, color: '#7cc0ff', decay: 0.01 });
    }
    shockwaves.push({ x, y, r: 8, max: 220 + rarity * 40, a: 0.9, w: 3 + rarity * 0.5, color: c.c2, decay: 0.012 });
    shockwaves.push({ x, y, r: 4, max: 140 + rarity * 20, a: 0.7, w: 2, color: c.c1, decay: 0.016 });
    flashes.push({ a: rarity >= 5 ? 0.42 : 0.28, color: c.c2, decay: 0.04, x: x, y: y, rad: Math.max(W, H) * 0.55 });
    if (c.shake) {
      document.body.classList.remove('shake-4', 'shake-5', 'shake-6');
      void document.body.offsetWidth;
      document.body.classList.add('shake-' + c.shake);
    }
  }

  function stepFall(now) {
    if (!falling) return false;
    const rarity = falling.r;
    const elapsed = now - falling.t0;
    const ap = approachMs(rarity);
    const tStop = GRAY_MS + COLOR_MS;
    const tApproach = tStop + STOP_MS;
    const tHang = tApproach + ap;
    const tEnd = tHang + HANG_MS;

    if (elapsed >= GRAY_MS) revealColor(rarity);

    if (elapsed < tStop) {
      flightTarget = CRUISE;
      const u = easeOut(Math.min(1, elapsed / tStop));
      falling.x = falling.xCruise0 + (falling.xCruise1 - falling.xCruise0) * u;
      falling.y = falling.yCruise0 + (falling.yCruise1 - falling.yCruise0) * u;
    } else if (elapsed < tApproach) {
      flightTarget = 0;
      // hold near cruise end while the field settles
      falling.x = falling.xCruise1;
      falling.y = falling.yCruise1;
    } else if (elapsed < tHang) {
      flightTarget = 0;
      if (!falling.approaching) {
        falling.approaching = true;
        falling.ax = falling.x;
        falling.ay = falling.y;
        document.body.classList.add('approach');
      }
      const u = easeInOut(Math.min(1, (elapsed - tApproach) / ap));
      falling.x = falling.ax + (falling.x1 - falling.ax) * u;
      falling.y = falling.ay + (falling.y1 - falling.ay) * u;
    } else {
      flightTarget = 0;
      falling.approaching = true;
      falling.x = falling.x1;
      falling.y = falling.y1;
    }

    if (falling.px != null) {
      const mdx = falling.x - falling.px, mdy = falling.y - falling.py;
      const mlen = Math.hypot(mdx, mdy);
      if (mlen > 0.85) {
        const nx = mdx / mlen, ny = mdy / mlen;
        const a = Math.min(0.28, 0.06 + mlen * 0.03);
        let lx = falling.dirX + (nx - falling.dirX) * a;
        let ly = falling.dirY + (ny - falling.dirY) * a;
        const ll = Math.hypot(lx, ly) || 1;
        falling.dirX = lx / ll;
        falling.dirY = ly / ll;
      }
    }
    falling.px = falling.x;
    falling.py = falling.y;
    falling.path.push({ x: falling.x, y: falling.y });
    if (falling.path.length > 48) falling.path.shift();

    const col = colorsAt(elapsed, rarity);
    const density = col.t > 0.4 ? (1 + Math.floor(rarity / 2)) : 1;
    for (let i = 0; i < density; i++) {
      spawn(falling.x + (Math.random() - 0.5) * 8, falling.y + (Math.random() - 0.5) * 8, {
        vx: (Math.random() - 0.5) * 0.6,
        vy: -0.4 - Math.random() * 0.8,
        size: 1.5 + Math.random() * 3,
        color: Math.random() < 0.3 ? col.c2 : col.c1,
        decay: 0.02 + Math.random() * 0.03,
        type: Math.random() < 0.2 ? 'glow' : 'spark'
      });
    }

    if (elapsed >= tEnd) {
      burst(falling.x, falling.y, rarity);
      const fin = { x: falling.x, y: falling.y, r: rarity };
      falling = null;
      document.body.classList.remove('falling', 'flying', 'approach');
      return fin;
    }
    return false;
  }

  function drawFalling() {
    if (!falling) return;
    const c = FX[falling.r];
    const elapsed = performance.now() - falling.t0;
    const col = colorsAt(elapsed, falling.r);
    const path = falling.path;
    const grow = falling.approaching
      ? 1 + 0.45 * easeOut(Math.min(1, (elapsed - (GRAY_MS + COLOR_MS + STOP_MS)) / approachMs(falling.r)))
      : 1 + 0.15 * col.t;
    const R = c.starR * grow;
    const tailLen = (160 + col.t * (80 + falling.r * 40)) * (falling.approaching ? 0.75 : 1);
    // always behind the star, along the smoothed flight direction — never snap to a fallback
    const ux = falling.dirX, uy = falling.dirY;
    const tx = falling.x - ux * tailLen;
    const ty = falling.y - uy * tailLen;
    const hw = (6 + falling.r * 1.3 + col.t * 3) * grow;
    const px = -uy, py = ux;

    const g = ctx.createLinearGradient(falling.x, falling.y, tx, ty);
    g.addColorStop(0, rgba(col.c2, 0.95));
    g.addColorStop(0.18, rgba(col.c1, 0.7));
    g.addColorStop(0.55, rgba(col.c1, 0.22));
    g.addColorStop(1, rgba(col.c1, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(falling.x + px * hw * 0.6, falling.y + py * hw * 0.6);
    ctx.lineTo(falling.x - px * hw * 0.6, falling.y - py * hw * 0.6);
    ctx.lineTo(tx - px * hw * 3.2, ty - py * hw * 3.2);
    ctx.lineTo(tx + px * hw * 3.2, ty + py * hw * 3.2);
    ctx.closePath();
    ctx.fill();

    const g2 = ctx.createLinearGradient(falling.x, falling.y, falling.x - ux * tailLen * 0.55, falling.y - uy * tailLen * 0.55);
    g2.addColorStop(0, rgba('#ffffff', 0.95));
    g2.addColorStop(0.2, rgba(col.c2, 0.85));
    g2.addColorStop(1, rgba(col.c1, 0));
    ctx.fillStyle = g2;
    ctx.beginPath();
    const hw2 = hw * 0.38;
    const tx2 = falling.x - ux * tailLen * 0.55;
    const ty2 = falling.y - uy * tailLen * 0.55;
    ctx.moveTo(falling.x + px * hw2, falling.y + py * hw2);
    ctx.lineTo(falling.x - px * hw2, falling.y - py * hw2);
    ctx.lineTo(tx2, ty2);
    ctx.closePath();
    ctx.fill();

    const x = falling.x, y = falling.y;
    const bloomR = R * (7 + col.t * 4);
    const bloom = ctx.createRadialGradient(x, y, 0, x, y, bloomR);
    bloom.addColorStop(0, rgba('#ffffff', 1));
    bloom.addColorStop(0.12, rgba(col.c2, 0.95));
    bloom.addColorStop(0.35, rgba(col.c1, 0.5 + 0.15 * col.t));
    bloom.addColorStop(1, rgba(col.c1, 0));
    ctx.fillStyle = bloom;
    ctx.beginPath();
    ctx.arc(x, y, bloomR, 0, Math.PI * 2);
    ctx.fill();

    drawSparkle(ctx, x, y, R * 3.4, performance.now() * 0.002, rgba('#ffffff', 0.95));
    drawSparkle(ctx, x, y, R * 2.1, performance.now() * 0.002 + Math.PI / 4, rgba(col.c2, 0.9));

    if (col.t > 0.25) {
      for (const p of falling.companions) {
        p.ang += p.spd * 16;
        const cx = x + Math.cos(p.ang) * p.rad * (0.7 + col.t);
        const cy = y + Math.sin(p.ang) * p.rad * 0.7 * (0.7 + col.t);
        ctx.fillStyle = rgba(col.c2, 0.85 * col.t);
        ctx.beginPath();
        ctx.arc(cx, cy, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function drawParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= p.decay;
      p.x += p.vx;
      p.y += p.vy;
      p.vy += p.g || 0;
      p.rot += p.vr || 0;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      const a = Math.max(0, p.life);
      if (p.type === 'glow') {
        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
        g.addColorStop(0, rgba(p.color, 0.35 * a));
        g.addColorStop(1, rgba(p.color, 0));
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      } else if (p.type === 'heart') {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = rgba(p.color, 0.9 * a);
        heartPath(ctx, 0, 0, p.size);
        ctx.fill();
        ctx.restore();
      } else {
        drawSparkle(ctx, p.x, p.y, p.size, p.rot, rgba(p.color, 0.95 * a));
      }
    }
    for (let i = shockwaves.length - 1; i >= 0; i--) {
      const s = shockwaves[i];
      s.r += 6 + s.r * 0.03;
      s.a -= s.decay;
      if (s.a <= 0 || s.r > s.max) { shockwaves.splice(i, 1); continue; }
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.strokeStyle = rgba(s.color, s.a);
      ctx.lineWidth = s.w;
      ctx.stroke();
    }
    for (let i = flashes.length - 1; i >= 0; i--) {
      const f = flashes[i];
      f.a -= f.decay;
      if (f.a <= 0) { flashes.splice(i, 1); continue; }
      const fx = f.x != null ? f.x : W / 2;
      const fy = f.y != null ? f.y : H / 2;
      const fr = f.rad || Math.max(W, H) * 0.5;
      const fg = ctx.createRadialGradient(fx, fy, 0, fx, fy, fr);
      fg.addColorStop(0, rgba(f.color, f.a));
      fg.addColorStop(0.45, rgba(f.color, f.a * 0.35));
      fg.addColorStop(1, rgba(f.color, 0));
      ctx.fillStyle = fg;
      ctx.fillRect(0, 0, W, H);
    }
  }

  // Предзагрузка картинки карточки, чтобы при открытии не мелькала прошлая.
  const imgCache = {};
  function preloadImg(src) {
    if (!imgCache[src]) {
      imgCache[src] = new Promise(res => {
        const im = new Image();
        im.onload = () => { (im.decode ? im.decode() : Promise.resolve()).catch(() => {}).then(() => res(im)); };
        im.onerror = () => res(null);
        im.src = src;
      });
    }
    return imgCache[src];
  }

  function showCard(card) {
    const c = cardView(card);
    const reveal = document.getElementById('reveal');
    const cardEl = document.getElementById('card');
    const img = document.getElementById('cardImg');
    const meta = document.getElementById('meta');
    const glow = document.getElementById('cardGlow');
    const close = document.getElementById('btnClose');
    img.style.visibility = 'hidden';
    img.removeAttribute('src');
    img.src = c.img;
    const showImg = () => { if (img.getAttribute('src') === c.img) img.style.visibility = ''; };
    if (img.complete && img.naturalWidth) showImg();
    else (img.decode ? img.decode() : Promise.reject()).then(showImg, () => { img.onload = showImg; if (img.complete) showImg(); });
    document.getElementById('cardName').textContent = c.title;
    document.getElementById('cardNote').textContent = c.note || '';
    const bt = document.getElementById('cardBackText');
    bt.innerHTML = '';
    if (c.note) { if (c.title) { const b = document.createElement('b'); b.textContent = c.title; bt.appendChild(b); } bt.appendChild(document.createTextNode(c.note)); }
    document.getElementById('cardHint').classList.toggle('has', !!c.note);
    document.getElementById('cardEnter').classList.toggle('special', !!card.special);
    glow.style.background = c.c1;
    glow.style.opacity = '0.85';
    document.documentElement.style.setProperty('--glow', c.c1);
    document.documentElement.style.setProperty('--back0', c.c3);
    document.documentElement.style.setProperty('--back1', c.c1);
    document.documentElement.style.setProperty('--backStar', c.c2);

    const enter = document.getElementById('cardEnter');
    cardEl.className = 'card';
    enter.className = 'card-enter';
    meta.className = 'meta';
    close.className = 'btn-main';
    reveal.classList.remove('hidden');

    requestAnimationFrame(() => {
      requestAnimationFrame(() => enter.classList.add('show'));
    });
    setTimeout(() => { cardEl.classList.add('flip'); }, 900);
    const myGen = gen;
    setTimeout(() => {
      if (myGen !== gen) return;
      meta.classList.add('on');
      if (c.note) { cardEl.classList.add('texted'); fitBackText(); }
      // Паймон рассказывает; «Дальше» — когда допечатана последняя реплика
      startTalk(paimonLines(card), () => { if (myGen === gen) close.classList.add('on'); });
    }, 1200);
  }

  // подгоняем шрифт текста на обороте под размер карты
  function fitBackText() {
    const bt = document.getElementById('cardBackText');
    const box = document.getElementById('cardBack');
    let fs = Math.max(13, Math.min(21, box.clientWidth / 19));
    bt.style.fontSize = fs + 'px';
    let guard = 0;
    while (bt.scrollHeight > bt.clientHeight + 1 && fs > 11 && guard++ < 20) { fs -= 0.75; bt.style.fontSize = fs + 'px'; }
  }
  // тап по открытой карте — переворот на оборот со словами Жени и обратно
  document.getElementById('card').addEventListener('click', () => {
    const el = document.getElementById('card');
    if (!el.classList.contains('texted')) return;
    el.classList.toggle('flip');
    if (!el.classList.contains('flip')) fitBackText();
  });

  function hideReveal() {
    stopTalk();
    document.getElementById('reveal').classList.add('hidden');
    document.getElementById('card').className = 'card';
    document.getElementById('cardEnter').className = 'card-enter';
    document.getElementById('meta').className = 'meta';
    document.getElementById('btnClose').className = 'btn-main';
    document.getElementById('cardGlow').style.opacity = '0';
    const oldImg = document.getElementById('cardImg');
    oldImg.style.visibility = 'hidden';
    oldImg.removeAttribute('src');
    document.body.classList.remove('r3', 'r4', 'r5', 'r6', 'shake-4', 'shake-5', 'shake-6', 'falling', 'flying', 'approach');
    specialFlight = false;
    falling = null;
    flightTarget = 0;
    particles.length = 0;
    shockwaves.length = 0;
    flashes.length = 0;
  }

  function setGems(n) {
    gems = Math.max(0, n);
    document.getElementById('pg').textContent = gems;
    if (window.QuestHUD) QuestHUD.setPrimos(gems);
  }

  function wait(ms) {
    return new Promise(res => setTimeout(res, ms));
  }

  function waitUntil(pred, timeout) {
    return new Promise(res => {
      const t0 = performance.now();
      (function check() {
        const r = pred();
        if (r || performance.now() - t0 > (timeout || 12000)) res(r);
        else requestAnimationFrame(check);
      })();
    });
  }

  let impactResult = null;

  async function play(cardOrRarity, spend) {
    if (busy && !window.__forcePlay) return;
    let card = null;
    if (cardOrRarity && typeof cardOrRarity === 'object' && cardOrRarity.id) {
      card = cardOrRarity;
    } else if (typeof cardOrRarity === 'number') {
      const drawn = drawFromPool(1, cardOrRarity);
      card = drawn[0] || null;
    } else {
      const drawn = drawFromPool(1);
      card = drawn[0] || null;
    }
    if (!card || pulledIds.indexOf(card.id) !== -1) {
      updatePoolUI();
      return;
    }
    const my = ++gen;
    busy = true;
    impactResult = null;
    markPulled(card);
    updatePoolUI();
    document.getElementById('home').classList.add('hidden');
    hideReveal();
    if (spend) setGems(gems - COST);
    const imgReady = preloadImg(cardView(card).img);
    startFlight(card.rarity);
    const fin = await waitUntil(() => impactResult || my !== gen, totalMs(card.rarity) + 2000);
    if (my !== gen) return;
    await wait(280);
    if (my !== gen) return;
    await Promise.race([imgReady, wait(4000)]);
    if (my !== gen) return;
    showCard(card);
    if (window.__autoClose) {
      await wait(window.__autoClose);
      if (my === gen) finishPull();
    }
  }

  // Последовательная крутка нескольких уникальных карт (для будущей 10×).
  // Если в пуле меньше, чем n, крутит только оставшиеся, без дублей.
  async function playMany(n, spend) {
    const batch = drawFromPool(n);
    for (const card of batch) {
      await play(card, spend);
      await waitUntil(() => !busy, 25000);
    }
    updatePoolUI();
    return batch;
  }

  // Финальная особая крутка «Женя»: золото → оранжевый, без примогемов.
  async function startSpecial() {
    if (busy || specialDone || remainingCards().length) return;
    const my = ++gen;
    busy = true;
    stopTalk();
    impactResult = null;
    document.getElementById('home').classList.add('hidden');
    hideReveal();
    saveSpecialDone();
    specialFlight = true;
    const card = SPECIAL_CARD;
    const imgReady = preloadImg(card.img);
    startFlight(6);
    flashes.push({ a: 0.5, color: '#ffd27a', decay: 0.02, rad: Math.max(W, H) * 0.7 });
    await waitUntil(() => impactResult || my !== gen, totalMs(6) + 2500);
    if (my !== gen) return;
    await wait(320);
    await Promise.race([imgReady, wait(4000)]);
    if (my !== gen) return;
    showCard(card);
  }
  document.getElementById('mystery').addEventListener('click', startSpecial);
  document.getElementById('mystery').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); startSpecial(); } });

  function finishPull() {
    gen++;
    hideReveal();
    document.getElementById('home').classList.remove('hidden');
    busy = false;
    updatePoolUI();
    if (resolveWait) { resolveWait(); resolveWait = null; }
  }

  document.getElementById('btnClose').addEventListener('click', finishPull);
  // Отладка: gacha/index.html?rank=3|4|5 — «Крутить» тянет только этот ранг (Вике не видно).
  const DEBUG_RANK = (location.search.match(/[?&]rank=([3-6])/) || [])[1] ? +location.search.match(/[?&]rank=([3-6])/)[1] : null;
  document.getElementById('btnPull').addEventListener('click', () => {
    if (busy) return;
    if (remainingCards().length === 0) { updatePoolUI(); return; }
    if (gems < COST) return;
    play(DEBUG_RANK, true);
  });

  function loop(now) {
    const dt = Math.min(48, now - lastT);
    lastT = now;
    drawBg(now, dt);
    const fin = stepFall(now);
    if (fin) impactResult = fin;
    drawFalling();
    drawParticles();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  window.GACHA = {
    play,
    playMany,
    showCard,
    finishPull,
    isBusy: () => busy,
    setAutoClose: (ms) => { window.__autoClose = ms; },
    remaining: remainingCards,
    startSpecial,
    specialDone: () => specialDone,
    talk: () => ({ on: talkOn(), idx: tIdx, lines: tLines.slice(), text: pText.textContent }),
    advanceTalk,
    pulled: () => pulledIds.slice(),
    cards: () => CARDS.slice(),
    drawFromPool,
    resetPool,
    updatePoolUI,
    ready: true
  };

  updatePoolUI();

  if (/[?&]reset=1/.test(location.search)) resetPool();

  if (/[?&]demo=1/.test(location.search)) {
    window.__autoClose = 3200;
    (async () => {
      await wait(900);
      resetPool();
      for (const r of [3, 4, 5, 6].filter(r => CARDS.some(c => c.rarity === r))) {
        await play(r, false);
        await waitUntil(() => !busy, 25000);
        await wait(500);
      }
    })();
  }
})();

</script>
