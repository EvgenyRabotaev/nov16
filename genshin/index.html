<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тейват</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23d3bc8e'/%3E%3Ccircle cx='8' cy='8' r='3' fill='%236b8cff'/%3E%3C/svg%3E">
<link rel="preload" as="image" href="map_bg.jpg">
<link rel="preload" as="image" href="fairy.png">
<link rel="preload" as="image" href="chests/chest1.png">
<link rel="preload" as="image" href="chests/chest2.png">
<link rel="preload" as="image" href="chests/chest3.png">
<link rel="preload" as="image" href="chests/chest4.png">
<link rel="preload" as="image" href="chests/chest5.png">
<link rel="preload" as="font" type="font/woff2" href="fonts/SofiaSans-cyrillic.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/SofiaSans-latin.woff2" crossorigin>
<style>
  @font-face {
    font-family: "QuestTeyvat";
    src: url("fonts/SofiaSans-cyrillic-ext.woff2") format("woff2");
    font-weight: 400 700; font-style: normal; font-display: swap;
    unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;
  }
  @font-face {
    font-family: "QuestTeyvat";
    src: url("fonts/SofiaSans-cyrillic.woff2") format("woff2");
    font-weight: 400 700; font-style: normal; font-display: swap;
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }
  @font-face {
    font-family: "QuestTeyvat";
    src: url("fonts/SofiaSans-latin-ext.woff2") format("woff2");
    font-weight: 400 700; font-style: normal; font-display: swap;
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face {
    font-family: "QuestTeyvat";
    src: url("fonts/SofiaSans-latin.woff2") format("woff2");
    font-weight: 400 700; font-style: normal; font-display: swap;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%; height: 100dvh;
    overflow: hidden; overscroll-behavior: none;
    background: #1a1730; color: #3b4255;
    font-family: "QuestTeyvat", "Segoe UI", "Noto Sans", sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  body { position: fixed; inset: 0; touch-action: manipulation; }
  .vignette { position: fixed; inset: 0; pointer-events: none; z-index: 4; box-shadow: inset 0 0 120px rgba(10, 16, 36, .45); }

  /* ----- карта ----- */
  .world {
    position: fixed; left: 0; top: 0;
    width: 1280px; height: 720px;
    transform-origin: 0 0;
    will-change: transform;
    z-index: 1;
  }
  .world-img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: contain; pointer-events: none; }

  .pin {
    position: absolute;
    transform: translate(-50%, -50%) scale(var(--pinScale, 1));
    transform-origin: 50% 50%;
    z-index: 2;
    cursor: pointer;
    pointer-events: auto;
  }
  .pin.locked { cursor: default; filter: grayscale(.25) brightness(.95) opacity(.9); pointer-events: none; }
  .pin.done { filter: saturate(.85) brightness(1); }
  .pin { min-width: 64px; min-height: 64px; }
  .wp-glyph {
    width: 48px; height: 86px; margin: 0 auto;
    position: relative;
  }
  .wp-glyph .beam {
    position: absolute; left: 50%; bottom: 14px; width: 18px; height: 78px;
    transform: translateX(-50%);
    background: linear-gradient(to top, rgba(255, 220, 120, .9), rgba(255, 245, 200, .35) 55%, rgba(255, 245, 200, 0));
    filter: blur(1px); pointer-events: none;
  }
  .wp-glyph::before, .wp-glyph::after { content: ""; position: absolute; left: 50%; transform: translateX(-50%); }
  .wp-glyph::before {
    top: 4px; width: 26px; height: 26px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #fffdf0, #f0d060 45%, #c8962a 80%);
    box-shadow: 0 0 16px 6px rgba(240, 210, 110, .85), 0 0 32px rgba(255, 220, 120, .5);
  }
  .wp-glyph::after {
    top: 24px; width: 10px; height: 28px;
    background: linear-gradient(#f0d060, #a87820);
    border-radius: 0 0 5px 5px;
  }
  .pin.current .wp-glyph { animation: wpPulse 1.6s ease-in-out infinite; }
  .pin.current .wp-glyph .beam { height: 96px; filter: blur(1.2px); }
  .pin.current .wp-glyph::before { box-shadow: 0 0 22px 8px rgba(240, 210, 110, 1), 0 0 48px rgba(255, 220, 120, .7); }
  .pin.done .wp-glyph .beam { opacity: .55; height: 56px; }
  .pin.locked .wp-glyph .beam { opacity: .55; }
  @keyframes wpPulse { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .pin-name { display: none !important; }

  .chest-pin .chest {
    width: 52px; height: 42px; position: relative;
    filter: drop-shadow(0 0 12px rgba(255, 200, 80, .95));
  }
  .chest-pin.current .chest { animation: wpPulse 1.4s ease-in-out infinite; }
  .chest-body, .chest-lid { position: absolute; left: 0; right: 0; border-radius: 3px; }
  .chest-body { bottom: 0; height: 18px; background: linear-gradient(#c9a44a, #8a6a22); border: 1.5px solid #f3e2a8; }
  .chest-body::after { content: ""; position: absolute; left: 50%; top: 4px; width: 8px; height: 8px; transform: translateX(-50%);
    background: #f3e2a8; border-radius: 50%; box-shadow: 0 0 4px #fff3; }
  .chest-lid { top: 0; height: 14px; background: linear-gradient(#e8c868, #b89030); border: 1.5px solid #f3e2a8;
    transform-origin: 50% 100%; transition: transform .5s cubic-bezier(.2, 1.2, .3, 1); }
  .chest-pin.open .chest-lid { transform: rotateX(-110deg); }
  .chest-pin.open .chest { filter: drop-shadow(0 0 14px rgba(255, 230, 140, 1)); }

  .cm-pin .cm-glyph {
    width: 22px; height: 22px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #fff, #8ec7ff 40%, #3a7ad4 80%);
    box-shadow: 0 0 10px 3px rgba(90, 170, 255, .7);
    animation: wpPulse 1.8s ease-in-out infinite;
  }
  .cm-pin.done { pointer-events: none; opacity: .45; filter: grayscale(.3); }
  .cm-pin.done .cm-glyph { animation: none; box-shadow: none; }

  /* ----- вопрос ----- */
  .panel {
    position: fixed; left: 50%; top: calc(18px + env(safe-area-inset-top, 0px));
    transform: translateX(-50%);
    width: min(640px, calc(100vw - 24px));
    padding: 18px 20px 16px;
    background: rgba(243, 238, 228, .95);
    border: 2px solid #d3bc8e; border-radius: 14px;
    box-shadow: inset 0 0 0 6px rgba(243,238,228,.95), inset 0 0 0 7px rgba(211, 188, 142, .75), 0 14px 40px rgba(20, 20, 40, .45);
    z-index: 10;
    transition: opacity .4s ease, transform .4s ease, visibility 0s linear 0s;
  }
  .panel.hidden { opacity: 0; transform: translate(-50%, -16px); pointer-events: none; visibility: hidden; transition: opacity .4s ease, transform .4s ease, visibility 0s linear .4s; }
  .q-kicker { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: #a8853f; font-weight: 600; }
  .q-text { margin: 10px 0 14px; font-size: 20px; line-height: 1.45; color: #3b4255; max-height: 34vh; overflow-y: auto; }
  .ans-inputs { display: flex; flex-direction: column; gap: 8px; margin: 0 0 8px; }
  .ans-input {
    width: 100%; padding: 11px 14px; border: 1.5px solid #d3bc8e; border-radius: 10px;
    background: #fffdf8; color: #3b4255; font: 16px/1.3 "QuestTeyvat", "Segoe UI", "Noto Sans", sans-serif;
    outline: none; user-select: text; -webkit-user-select: text;
  }
  .ans-input::placeholder { color: #9aa0b0; }
  .ans-input:focus { border-color: #c4a15a; box-shadow: 0 0 0 3px rgba(211, 188, 142, .35); }
  .ans-input.ok { border-color: #6aaf6a; }
  .ans-input.bad { animation: shake .38s ease; }
  @keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
  .ans-msg { min-height: 20px; margin: 0 0 10px; font-size: 14px; color: #8a7040; }
  .ans-msg.ok { color: #3d8a4a; }
  .btn {
    appearance: none; cursor: pointer; min-width: 160px; padding: 11px 26px;
    font: 600 16px/1 "QuestTeyvat", "Segoe UI", "Noto Sans", sans-serif; color: #495366;
    background: #ece5d8; border: 2px solid #d3bc8e; border-radius: 999px;
    box-shadow: 0 0 0 2px #fff, 0 4px 14px rgba(40, 30, 10, .25);
  }
  .btn:hover:not(:disabled) { filter: brightness(1.05); }
  .btn:disabled { opacity: .55; cursor: default; }

  /* ----- диалог ----- */
  .talk { position: fixed; inset: 0; z-index: 9500; pointer-events: none; opacity: 0; transition: opacity .45s ease; }
  .talk.on { opacity: 1; pointer-events: auto; }
  .fairy {
    position: absolute;
    right: max(4vw, env(safe-area-inset-right, 0px));
    bottom: calc(32vh + env(safe-area-inset-bottom, 0px));
    width: min(280px, 38vw, 56vh);
    filter: drop-shadow(0 8px 16px rgba(20, 16, 40, .55)) drop-shadow(0 0 12px rgba(180, 160, 255, .25));
    transform-origin: 50% 80%;
    animation: fairyIn .7s cubic-bezier(.2, 1.4, .4, 1) both, fairyBob 3.2s ease-in-out .7s infinite;
    pointer-events: none; z-index: 2;
  }
  .fairy img { width: 100%; height: auto; display: block; }
  @keyframes fairyIn { from { opacity: 0; transform: translate(24px, 18px) scale(.82); } to { opacity: 1; transform: none; } }
  @keyframes fairyBob { 0%, 100% { transform: translateY(0) rotate(-1.5deg); } 50% { transform: translateY(-10px) rotate(1.5deg); } }
  .dlg {
    position: absolute; left: 0; right: 0; bottom: 0; width: 100%; z-index: 3;
    min-height: 32vh;
    padding: 56px 5% 36px;
    padding-bottom: calc(36px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to top, rgba(0,0,0,.88) 0%, rgba(0,0,0,.82) 28%, rgba(0,0,0,.62) 58%, rgba(0,0,0,.28) 82%, rgba(0,0,0,0) 100%);
    color: #f7f4ec; cursor: pointer;
    box-sizing: border-box;
  }
  .dlg-who {
    font-weight: 700; font-size: 18px; letter-spacing: .16em; text-transform: uppercase;
    margin: 0 auto 12px; text-align: center; text-shadow: 0 2px 8px rgba(0,0,0,.9), 0 0 12px rgba(0,0,0,.45);
  }
  .dlg-who.who-vika { color: #f5c542; }
  .dlg-who.who-fairy { color: #c9b0ff; }
  .dlg-who.who-zhenya { color: #e08a4a; }
  .dlg-who.who-stage { color: #c5c9d6; font-weight: 500; letter-spacing: .08em; text-transform: none; font-style: italic; }
  .dlg-text { font-size: 24px; font-weight: 400; line-height: 1.55; min-height: 3.1em; max-width: none; width: 100%; margin: 0 auto; text-align: center; overflow-wrap: break-word; text-shadow: 0 2px 8px rgba(0,0,0,.85); }
  .dlg-cont {
    position: absolute; left: 50%; right: auto;
    bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    width: 18px; height: 16px; opacity: 0; pointer-events: none; transition: opacity .18s ease;
    transform: translateX(-50%);
  }
  .dlg-cont.show { opacity: 1; animation: contBob .75s ease-in-out infinite; }
  .dlg-cont::before {
    content: ""; display: block; width: 0; height: 0;
    border-left: 9px solid transparent; border-right: 9px solid transparent; border-top: 11px solid #f3e2a8;
    filter: drop-shadow(0 0 6px rgba(243, 226, 168, .85));
  }
  @keyframes contBob { 0%, 100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(5px); } }


  /* ----- видео-вопрос ----- */
  .gs-video {
    position: fixed; inset: 0; z-index: 45;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    background: rgba(8, 10, 22, .55);
    opacity: 0; pointer-events: none; visibility: hidden;
    transition: opacity .3s ease, visibility 0s linear .3s;
  }
  .gs-video.on { opacity: 1; pointer-events: auto; visibility: visible; transition: opacity .3s ease, visibility 0s; }
  .gs-video-card {
    width: min(560px, calc(100vw - 28px));
    background: rgba(243, 238, 228, .97);
    border: 2px solid #d3bc8e; border-radius: 14px;
    box-shadow: inset 0 0 0 6px rgba(243,238,228,.95), inset 0 0 0 7px rgba(211, 188, 142, .75), 0 16px 44px rgba(20, 20, 40, .5);
    padding: 16px 16px 18px;
    text-align: center;
    font-family: "QuestTeyvat", "Segoe UI", "Noto Sans", sans-serif;
  }
  .gs-video-kicker {
    font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
    color: #a8853f; font-weight: 600; margin-bottom: 12px;
  }
  .gs-video-stage {
    position: relative;
    background: #0b0c12;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid rgba(211, 188, 142, .55);
  }
  .gs-video-stage video {
    display: block; width: 100%; height: auto;
    max-height: min(52vh, 420px);
    background: #000;
  }
  .gs-video-play {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 72px; height: 72px; border-radius: 50%;
    border: 2px solid #d3bc8e;
    background: rgba(20, 16, 30, .55);
    color: #f7efd8; font-size: 28px; line-height: 1;
    cursor: pointer; padding: 0 0 0 6px;
    box-shadow: 0 0 0 6px rgba(211, 188, 142, .18), 0 8px 20px rgba(0,0,0,.35);
  }
  .gs-video-play[hidden] { display: none; }
  .gs-video-captions {
    position: absolute;
    left: 50%;
    bottom: 11%;
    transform: translateX(-50%);
    z-index: 2;
    max-width: 92%;
    padding: 6px 14px 7px;
    border-radius: 8px;
    background: rgba(0, 0, 0, .76);
    color: #fff;
    font: 600 17px/1.35 "QuestTeyvat", "Segoe UI", "Noto Sans", system-ui, sans-serif;
    text-align: center;
    text-shadow: 0 1px 2px #000, 0 0 8px rgba(0,0,0,.9);
    pointer-events: none;
    letter-spacing: .01em;
    box-shadow: 0 2px 10px rgba(0,0,0,.35);
  }
  .gs-video-captions[hidden] { display: none !important; }
  .gs-video-captions .cap-who { color: #ffe7a8; font-weight: 700; }
  .gs-video-captions .cap-line { color: #fff; }

  .gs-video-card .btn { margin-top: 14px; }
  .gs-rewatch {
    appearance: none; cursor: pointer;
    width: 32px; height: 32px; border-radius: 50%;
    border: 1.5px solid #d3bc8e; background: #fffdf8;
    color: #8a7040; font-size: 13px; line-height: 1; padding: 0 0 0 2px;
    vertical-align: middle; margin-left: 8px;
    box-shadow: 0 1px 4px rgba(40,30,10,.15);
  }
  .gs-rewatch[hidden] { display: none; }
  .q-kicker { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .q-kicker-label { min-width: 0; }

  /* ----- записка / огонёк ----- */
  .note {
    position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center;
    background: rgba(8, 10, 20, .45); opacity: 0; pointer-events: none; transition: opacity .3s ease;
  }
  .note.on { opacity: 1; pointer-events: auto; }
  .note-card {
    width: min(420px, calc(100vw - 32px));
    background: linear-gradient(#f7f0de, #eee2c4);
    border: 2px solid #d3bc8e; border-radius: 12px;
    box-shadow: 0 16px 40px rgba(0,0,0,.45), inset 0 0 0 6px rgba(247,240,222,.9), inset 0 0 0 7px rgba(211,188,142,.6);
    padding: 26px 24px 20px; color: #3b4255; text-align: center;
  }
  .note-kicker { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: #a8853f; font-weight: 600; margin-bottom: 10px; }
  .note-text { font-size: 20px; line-height: 1.45; margin-bottom: 18px; }

  /* ----- готовка ----- */
  .cook {
    position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    background: linear-gradient(to top, rgba(10,8,16,.82) 0%, rgba(10,8,16,.4) 55%, rgba(10,8,16,.15) 100%);
    opacity: 0; pointer-events: none; transition: opacity .35s ease;
    padding: 20px 16px calc(24px + env(safe-area-inset-bottom, 0px));
  }
  .cook.on { opacity: 1; pointer-events: auto; }
  .cook-title { position: absolute; top: calc(18px + env(safe-area-inset-top, 0px)); font-size: 18px; letter-spacing: .14em; text-transform: uppercase; color: #f5e6c0; text-shadow: 0 2px 8px #000; }
  .cook-hint { margin: 8px 0 16px; color: #f5e6c0; font-size: 16px; text-align: center; text-shadow: 0 2px 6px #000; min-height: 1.4em; max-width: 520px; }
  .cauldron-wrap { position: relative; width: 180px; height: 180px; margin-bottom: 18px; }
  .fire { position: absolute; left: 50%; bottom: 8px; width: 90px; height: 50px; transform: translateX(-50%);
    background: radial-gradient(ellipse at 50% 80%, #ffce4a, #ff7a1a 50%, transparent 70%);
    filter: blur(1px); animation: fireFlicker .25s ease-in-out infinite alternate; }
  @keyframes fireFlicker { from { transform: translateX(-50%) scale(1, 1); opacity: .85; } to { transform: translateX(-50%) scale(1.08, 1.15); opacity: 1; } }
  .cauldron {
    position: absolute; left: 50%; bottom: 36px; transform: translateX(-50%);
    width: 130px; height: 100px; border-radius: 0 0 60px 60px;
    background: linear-gradient(160deg, #3a3f4e, #1a1d26);
    border: 3px solid #d3bc8e; box-shadow: inset 0 12px 16px rgba(0,0,0,.45), 0 8px 20px rgba(0,0,0,.4);
  }
  .cauldron::before { content: ""; position: absolute; left: -10px; right: -10px; top: -8px; height: 18px; border-radius: 9px;
    background: linear-gradient(#4a5160, #2a2e38); border: 3px solid #d3bc8e; }
  .pot-items { position: absolute; inset: 18px 10px 8px; display: flex; flex-wrap: wrap; gap: 4px; align-content: center; justify-content: center; }
  .ing-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 560px; }
  .ing {
    width: 92px; padding: 10px 8px; border-radius: 12px; text-align: center; cursor: grab;
    background: rgba(243, 238, 228, .95); border: 2px solid #d3bc8e; color: #3b4255; font-size: 13px; font-weight: 600;
    box-shadow: 0 4px 12px rgba(0,0,0,.3); touch-action: none;
  }
  .ing .swatch { width: 28px; height: 28px; border-radius: 50%; margin: 0 auto 6px; border: 2px solid rgba(255,255,255,.7); }
  .ing.dragging { opacity: .45; }
  .ing-ghost {
    position: fixed; pointer-events: none; z-index: 80; width: 92px; padding: 10px 8px; border-radius: 12px;
    text-align: center; background: rgba(243, 238, 228, .95); border: 2px solid #d3bc8e; color: #3b4255; font-size: 13px; font-weight: 600;
    box-shadow: 0 8px 18px rgba(0,0,0,.35); margin: 0;
  }
  .chip { font-size: 11px; background: rgba(255,255,255,.15); color: #f5e6c0; border: 1px solid #d3bc8e; border-radius: 999px; padding: 3px 8px; }

  /* ----- планер ----- */
  .glide {
    position: fixed; inset: 0; z-index: 25; pointer-events: none; opacity: 0; transition: opacity .4s ease;
  }
  .glide.on { opacity: 1; pointer-events: auto; }
  .glide-wind { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .streak { position: absolute; height: 2px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); border-radius: 2px; opacity: .0; }
  .glide::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 40%, rgba(180,210,255,.12), rgba(8,12,30,.28) 70%); }
  .glider {
    position: absolute; width: 150px; height: auto; filter: drop-shadow(0 8px 12px rgba(0,0,0,.45)) drop-shadow(0 0 12px rgba(200,180,255,.5));
    pointer-events: none; z-index: 2; transform-origin: 50% 50%;
  }
  .glide-skip {
    position: absolute; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%); appearance: none; cursor: pointer;
    padding: 8px 18px; border-radius: 999px; border: 1px solid rgba(211,188,142,.7);
    background: rgba(20,16,30,.45); color: #f5e6c0; font: 600 14px/1 "QuestTeyvat", sans-serif;
  }

  .go-next {
    position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%); z-index: 15;
    appearance: none; cursor: pointer; min-width: 200px; padding: 12px 28px;
    font: 600 16px/1 "QuestTeyvat", sans-serif; color: #495366;
    background: #ece5d8; border: 2px solid #d3bc8e; border-radius: 999px;
    box-shadow: 0 0 0 2px #fff, 0 4px 14px rgba(40, 30, 10, .25);
    opacity: 0; pointer-events: none; transition: none;
  }
  .go-next.show { opacity: 1; pointer-events: auto; transition: opacity .3s ease, transform .3s ease; }

  @media (max-width: 900px) {

  function esc(s) { return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function whoClass(who) {

  function mapScale() { return Math.min(innerWidth / MAP_W, innerHeight / MAP_H); }
  function clampCam(x, y, s) {
    /* contain-fit: вся карта в экране, без прокрутки и панорамирования */
    const dw = MAP_W * s, dh = MAP_H * s;
    const tx = (innerWidth - dw) / 2;
    const ty = (innerHeight - dh) / 2;
    return { tx, ty, s };
  }
  function applyCam(x, y, s) {
    cam = { x, y, s };
    const t = clampCam(x, y, s);
    const pinScale = 1 / s;
    world.style.setProperty("--pinScale", pinScale.toFixed(4));
    world.style.transform = "translate(" + t.tx + "px," + t.ty + "px) scale(" + t.s + ")";
  }
  function focusOn(x, y, ms) {
    if (camAnim) cancelAnimationFrame(camAnim);
    const s = mapScale();
    if (!ms) { applyCam(x, y, s); return; }
    const x0 = cam.x, y0 = cam.y, s0 = cam.s, t0 = performance.now();
    const step = (now) => {
      const p = Math.min(1, (now - t0) / ms);
      const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
      applyCam(x0 + (x - x0) * e, y0 + (y - y0) * e, s0 + (s - s0) * e);
      if (p < 1) camAnim = requestAnimationFrame(step);
      else camAnim = 0;
    };
    camAnim = requestAnimationFrame(step);
  }
  function resizeCam() {
    const p = wp();
    applyCam(p ? p.x : 50, p ? p.y : 50, mapScale());
  }

  function pinAt(el, x, y) { el.style.left = x + "%"; el.style.top = y + "%"; }

  function renderPins() {
    pins.innerHTML = "";
    WAYPOINTS.forEach((w, i) => {
      const el = document.createElement("div");
      el.className = "pin wp-pin" + (i > wi ? " locked" : i === wi && !locReady ? " current" : " done");
      el.dataset.id = w.id;
      pinAt(el, w.x, w.y);
      el.innerHTML = '<div class="wp-glyph"><div class="beam"></div></div>';
      el.setAttribute("aria-label", (spotOne(true) || "Огонёк") + " " + (i + 1));
      el.removeAttribute("title");
      if (i === wi && !locReady) el.addEventListener("click", (e) => { e.stopPropagation(); onWaypointTap(i); });
      pins.appendChild(el);
      if (w.chest && (openedChests[w.id] || (i === wi && mode === "chest"))) {
        const ch = document.createElement("div");
        ch.className = "pin chest-pin" + (openedChests[w.id] ? " open done" : " current");
        ch.dataset.chest = w.id;
        pinAt(ch, w.chest.x, w.chest.y);
        ch.innerHTML = '<div class="chest"><div class="chest-lid"></div><div class="chest-body"></div></div>';
        if (!openedChests[w.id]) ch.addEventListener("click", (e) => { e.stopPropagation(); openChest(w); });
        pins.appendChild(ch);
      }
    });
    COMMISSIONS.forEach((c) => {
      const afterIdx = WAYPOINTS.findIndex((w) => w.id === c.after);
      if (afterIdx < 0 || wi < afterIdx) return;
      if (wi === afterIdx && !locReady) return;
      const el = document.createElement("div");
      el.className = "pin cm-pin" + (doneCommissions[c.id] ? " done" : " current");
      el.dataset.cm = c.id;
      pinAt(el, c.x, c.y);

      el.setAttribute("aria-label", "Огонёк");

      pins.appendChild(el);
    });
  }

  function hideHud(v) { if (window.QuestHUD) QuestHUD.setVisible(!v); }
  function setStep(s) { if (window.QuestHUD) QuestHUD.setStep(s); }

  function clearIdle() { if (idleTimer) { clearTimeout(idleTimer); idleTimer = 0; } }

  /* ----- диалог ----- */
  function stopType() {
    if (typeTimer) { clearTimeout(typeTimer); typeTimer = 0; }
    typing = false; typeFull = ""; dlgCont.classList.remove("show");
  }
  function finishType() {
    if (typeTimer) { clearTimeout(typeTimer); typeTimer = 0; }
    dlgText.textContent = typeFull; typing = false; dlgCont.classList.add("show"); setFlags();
  }
  function startType(full) {
    stopType(); typeFull = full || ""; dlgText.textContent = "";
    if (!typeFull || TYPE_MS <= 0) { dlgText.textContent = typeFull; typing = false; dlgCont.classList.add("show"); setFlags(); return; }
    typing = true; let i = 0;
    const tick = () => {
      i += 1; dlgText.textContent = typeFull.slice(0, i);
      if (i < typeFull.length) typeTimer = setTimeout(tick, TYPE_MS);
      else { typeTimer = 0; typing = false; dlgCont.classList.add("show"); setFlags(); }
    };
    typeTimer = setTimeout(tick, TYPE_MS); setFlags();
  }
  function renderLine() {
    const L = lines[li] || { who: "", text: "" };
    dlgWho.className = "dlg-who " + whoClass(L.who);
    dlgWho.textContent = L.who || "";
    const col = colorOf(L.who);
    dlgWho.style.color = col || "";
    startType(L.text || ""); setFlags();
  }
  function startTalk(newLines, after) {
    lines = newLines || []; li = 0; talkReturn = after || null;
    panel.classList.add("hidden");
    if (!lines.length) { afterTalk(); return; }
    hideHud(true); setStep("talk");
    talk.classList.add("on");
    renderLine();
  }
  function advanceTalk() {
    if (!talk.classList.contains("on")) return;
    if (typing) { finishType(); return; }
    if (li < lines.length - 1) { li += 1; renderLine(); return; }
    afterTalk();
  }
  function afterTalk() {
    stopType(); talk.classList.remove("on"); hideHud(false);
    const ret = talkReturn; talkReturn = null;
    if (typeof ret === "function") ret();
    setFlags();
  }
  function hideTalkInstant() {
    stopType();
    talk.style.transition = "none";
    talk.classList.remove("on");
    void talk.offsetWidth;
    talk.style.transition = "";
  }

  function fairyLines(arr, whoFallback) {
    if (!arr) return [];
    if (typeof arr === "string") return [{ who: whoFallback || FAIRY.name || "Паймон", text: arr }];
    return arr.map((L) => (typeof L === "string" ? { who: whoFallback || FAIRY.name || "Паймон", text: L } : L));
  }

  function showEncourage(kind) {
    clearIdle();
    const list = kind === "wrong3" ? (G.WRONG3 || G.WRONG || []) : (G.IDLE || []);
    const lines2 = fairyLines(list);
    if (!lines2.length) { armIdle(); return; }
    const pick = lines2[Math.floor(Math.random() * lines2.length)];
    startTalk([pick], () => { mode = "question"; panel.classList.remove("hidden"); armIdle(); setFlags(); });
  }

  /* ----- вопросы ----- */
  function showQuestion() {
    const p = wp();
    const q = p ? qById(p.question) : QUESTIONS[qi];
    if (!q) { afterLocationTalk(); return; }
    qi = Math.max(0, QUESTIONS.indexOf(q));
    mode = "question"; busy = false; wrongCount = 0;
    talk.classList.remove("on"); stopType();
    qNum.textContent = (p && p.name ? p.name + " · " : "") + spotOne(true) + " " + (qi + 1) + " из " + QUESTIONS.length;
    qText.innerHTML = esc(q.text).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
    ansMsg.textContent = ""; ansMsg.className = "ans-msg";
    answerInputs.innerHTML = "";
    const parts = q.parts || [{ accept: ["да"] }];
    parts.forEach((part, i) => {
      const inp = document.createElement("input");
      inp.className = "ans-input"; inp.type = "text"; inp.autocomplete = "off"; inp.enterKeyHint = "done";
      inp.placeholder = part.placeholder || (window.QuestHUD && QuestHUD.answerText("placeholder")) || "Твой ответ";

  const seenVideos = Object.create(null);
  let videoAfter = null;
  function videoSrc(path) {
    if (!path) return "";
    if (/^https?:/i.test(path)) return path;
    return path;
  }
  function syncVideoPlayBtn() {
    if (!gsVideoPlay || !gsVideo) return;
    gsVideoPlay.hidden = !gsVideo.paused;
  }
  let videoCaptions = [];
  let capRaf = 0;
  function escapeCap(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function formatCaption(cue) {
    if (!cue) return "";
    const who = (cue.who || "").trim();
    const text = (cue.text || "").trim();
    const song = !!(cue.song || who === "♪");
    if (song) {
      const body = text.replace(/^♪\s*/, "");
      return '<span class="cap-line">♪ «' + escapeCap(body) + '»</span>';
    }
    if (who && text) return '<span class="cap-who">' + escapeCap(who) + ':</span> <span class="cap-line">«' + escapeCap(text) + '»</span>';
    if (text) return '<span class="cap-line">«' + escapeCap(text) + '»</span>';
    return "";
  }
  function cueAt(t) {
    for (let i = 0; i < videoCaptions.length; i++) {
      const c = videoCaptions[i];
      const a = Number(c.start) || 0, b = Number(c.end) || 0;
      if (t >= a && t < b) return c;
    }
    return null;
  }
  function syncVideoCaptions() {
    if (!gsVideoCaptions) return;
    if (!videoCaptions.length || !gsVideo) {
      gsVideoCaptions.hidden = true;
      gsVideoCaptions.innerHTML = "";
      delete gsVideoCaptions.dataset.key;
      return;
    }
    const cue = cueAt(gsVideo.currentTime || 0);
    const html = formatCaption(cue);
    if (!html) {
      gsVideoCaptions.hidden = true;
      if (gsVideoCaptions.dataset.key) { gsVideoCaptions.innerHTML = ""; delete gsVideoCaptions.dataset.key; }
      return;
    }
    if (gsVideoCaptions.dataset.key !== html) {
      gsVideoCaptions.innerHTML = html;
      gsVideoCaptions.dataset.key = html;
    }
    gsVideoCaptions.hidden = false;
  }
  function startCaptionLoop() {
    if (capRaf) cancelAnimationFrame(capRaf);
    const tick = () => {
      syncVideoCaptions();
      if (gsVideo && !gsVideo.paused && !gsVideo.ended) capRaf = requestAnimationFrame(tick);
      else capRaf = 0;
    };
    capRaf = requestAnimationFrame(tick);
  }
  function stopCaptionLoop() {
    if (capRaf) { cancelAnimationFrame(capRaf); capRaf = 0; }
    syncVideoCaptions();
  }
  function setVideoCaptions(list) {
    videoCaptions = Array.isArray(list) ? list : [];
    syncVideoCaptions();
  }
  function playQuestionVideo() {
    if (!gsVideo) return;
    gsVideo.play().then(() => { syncVideoPlayBtn(); startCaptionLoop(); }).catch(() => { syncVideoPlayBtn(); });
  }
  function openVideoPopup(q, after) {
    videoAfter = after || null;
    if (gsVideoKicker) gsVideoKicker.textContent = spotTitle();
    setVideoCaptions((q && q.captions) || []);
    if (gsVideo) {
      gsVideo.setAttribute("playsinline", "");
      gsVideo.setAttribute("webkit-playsinline", "");
      gsVideo.playsInline = true;
      gsVideo.controls = true;
      gsVideo.preload = "metadata";
      const src = videoSrc(q.video);
      if (gsVideo.getAttribute("src") !== src) {
        gsVideo.src = src;
        try { gsVideo.load(); } catch (e) {}
      } else {
        try { gsVideo.currentTime = 0; } catch (e) {}
      }
    }
    syncVideoCaptions();
    if (gsVideoPlay) gsVideoPlay.hidden = false;
    if (gsVideoPop) gsVideoPop.classList.add("on");
    setFlags();
  }
  function closeVideoPopup() {
    if (gsVideo) { try { gsVideo.pause(); } catch (e) {} }
    stopCaptionLoop();
    setVideoCaptions([]);
    if (gsVideoPop) gsVideoPop.classList.remove("on");
    const fn = videoAfter; videoAfter = null;
    if (typeof fn === "function") fn();
  }

  function submit() {
    if (busy || mode !== "question") return;
    const p = wp();
    const q = p ? qById(p.question) : QUESTIONS[qi];
    if (!q) return;
    const values = [...answerInputs.querySelectorAll(".ans-input")].map((el) => el.value);
    const res = window.QuestHUD ? QuestHUD.checkAnswer(q, values) : { ok: /да/i.test((values[0] || "").trim()), parts: [] };
    const inputs = [...answerInputs.querySelectorAll(".ans-input")];
    inputs.forEach((el, i) => {
      el.classList.remove("ok", "bad");
      const st = (res.parts && res.parts[i]) || (res.ok ? "correct" : "wrong");
      el.classList.add(st === "correct" ? "ok" : "bad");
    });
    if (!res.ok) {
      const kind = (res.parts || []).some((pp) => pp === "almost") ? "almost" : "wrong";
      ansMsg.className = "ans-msg";
      ansMsg.textContent = (window.QuestHUD && QuestHUD.answerText(kind)) || "Не то, попробуй ещё";
      wrongCount += 1;
      armIdle();
      if (wrongCount > 0 && wrongCount % 3 === 0) setTimeout(() => { if (mode === "question") showEncourage("wrong3"); }, 400);
      return;
    }
    clearIdle();
    ansMsg.className = "ans-msg ok";
    ansMsg.textContent = (window.QuestHUD && QuestHUD.answerText("correct")) || "Верно";
    busy = true;
    if (window.QuestHUD) QuestHUD.award(q.id || ("gs-q" + (qi + 1)), q.placeholder ? 0 : (q.primos != null ? q.primos : undefined));
    setTimeout(() => startTalk(DIALOGUES[q.id] || [], afterLocationTalk), 550);
  }

  function afterLocationTalk() {
    const p = wp();
    if (p && p.chest && !openedChests[p.id]) { beginChest(p); return; }
    if (p && p.cook && !cooked) { beginCook(); return; }
    maybeTreasureThenStory();
  }
  /* Сундук N после правильного ответа на вопрос N, затем обычный поток (светлячки / пятнашки / «Летим дальше»). */
  const treasureOpened = Object.create(null);
  const CHEST_CFG = Object.assign({
    hint: "Тапни по сундуку",
    images: ["chests/chest1.png", "chests/chest2.png", "chests/chest3.png", "chests/chest4.png", "chests/chest5.png"],
    paimon: [
      "Ого, сундук! Простенький, но Паймон всё равно рада 😋",
      "О, а этот уже с железными обручами! Крепкий такой — Паймон одобряет ✨",
      "Смотри-ка, тут даже золото есть! Тебе очень идёт, Викуля 💛",
      "Вау-у, сундук весь в узорах! Паймон чувствует, что сокровище совсем близко… ✨",
      "Роскошный сундук! Прямо как ваша любовь — самое ценное сокровище Тейвата 💙"
    ]
  }, G.CHESTS || {});
  function maybeTreasureThenStory() {
    if (CHEST_DEBUG || FIREFLY_DEBUG || STARS_DEBUG) {
      maybeFirefliesThenMap();
      return;
    }
    const n = qi + 1;
    if (n >= 1 && n <= 5 && !treasureOpened[n]) {
      treasureOpened[n] = true;
      startTreasure(n, { onDone: maybeFirefliesThenMap });
      return;
    }
    maybeFirefliesThenMap();
  }
  function treasureTapsNeeded(n) { return n + 2; }
  function spawnTreasureSparks(box, burst) {
    if (!box) return;
    const n = burst ? (FAST ? 10 : 18) : (FAST ? 5 : 9);
    const rect = box.getBoundingClientRect();
    for (let i = 0; i < n; i++) {
      const s = document.createElement("span");
      s.className = "tr-spark";
      const ang = (Math.PI * 2 * i) / n + Math.random() * 0.5;
      const dist = (burst ? 70 : 40) + Math.random() * (burst ? 70 : 50);
      s.style.left = (42 + Math.random() * 16) + "%";
      s.style.top = (38 + Math.random() * 24) + "%";
      s.style.setProperty("--sx", (Math.cos(ang) * dist) + "px");
      s.style.setProperty("--sy", (Math.sin(ang) * dist - 16) + "px");
      box.appendChild(s);
      setTimeout(() => { if (s.parentNode) s.remove(); }, 650);
    }
  }
  function endTreasure() {
    const scene = document.getElementById("gsTreasure");
    const box = document.getElementById("trBox");
    const hint = document.getElementById("trHint");
    if (box) {
      box.onclick = null;
      box.classList.remove("shake", "open");
      box.querySelectorAll(".tr-spark").forEach((el) => el.remove());
    }
    if (hint) hint.classList.remove("show");
    if (scene) scene.classList.remove("on", "open");
  }
  function startTreasure(n, opts) {
    n = Math.max(1, Math.min(5, n | 0));
    const onDone = opts && opts.onDone;
    const scene = document.getElementById("gsTreasure");
    const img = document.getElementById("trImg");
    const box = document.getElementById("trBox");
    const hint = document.getElementById("trHint");
    if (!scene || !img || !box) { if (typeof onDone === "function") onDone(); return; }
    hideTalkInstant();
    if (panel) panel.classList.add("hidden");

  function sampleDateSlots(box) {
    const r = box.getBoundingClientRect();
    const w = Math.max(240, Math.round(r.width) || 360);
    const h = Math.max(120, Math.round(r.height) || 180);
    const scale = 3;
    const cw = w * scale, ch = h * scale;
    const canvas = document.createElement("canvas");
    canvas.width = cw; canvas.height = ch;
    const ctx = canvas.getContext("2d");
    if (!ctx) return null;
    ctx.clearRect(0, 0, cw, ch);
    const fontSize = cw * 0.24;
    ctx.font = '700 ' + fontSize + 'px "QuestTeyvat","Segoe UI","Noto Sans",sans-serif';
    ctx.fillStyle = "#fff";
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    const text = "16.11";
    const chars = text.split("");
    const spacing = fontSize * 0.1;
    const widths = chars.map((ch) => ctx.measureText(ch).width);
    const total = widths.reduce((a, b) => a + b, 0) + spacing * (chars.length - 1);
    let x0 = (cw - total) / 2;
    const y0 = ch * 0.52;
    const glyphs = [];
    chars.forEach((ch, i) => {
      glyphs.push({ ch: ch, x: x0, y: y0, w: widths[i] });
      ctx.fillText(ch, x0, y0);
      x0 += widths[i] + spacing;
    });
    const data = ctx.getImageData(0, 0, cw, ch).data;
    function inkIn(x1, y1, x2, y2) {
      const pts = [];
      const xa = Math.max(0, Math.floor(x1)), xb = Math.min(cw - 1, Math.ceil(x2));
      const ya = Math.max(0, Math.floor(y1)), yb = Math.min(ch - 1, Math.ceil(y2));
      for (let y = ya; y <= yb; y += 2) {
        for (let x = xa; x <= xb; x += 2) {
          if (data[(y * cw + x) * 4 + 3] > 120) pts.push([x, y]);
        }
      }
      return pts;
    }
    function glyphInkBox(x1, y1, x2, y2) {
      const pts = inkIn(x1, y1, x2, y2);
      if (!pts.length) return { pts: [], x1: x1, y1: y1, x2: x2, y2: y2 };
      let minX = pts[0][0], maxX = pts[0][0], minY = pts[0][1], maxY = pts[0][1];
      for (let i = 1; i < pts.length; i++) {
        const p = pts[i];
        if (p[0] < minX) minX = p[0]; if (p[0] > maxX) maxX = p[0];
        if (p[1] < minY) minY = p[1]; if (p[1] > maxY) maxY = p[1];
      }
      return { pts: pts, x1: minX, y1: minY, x2: maxX, y2: maxY };
    }
    const REGIONS = {
      "1": [
        [0.08, 0.00, 0.55, 0.16],
        [0.28, 0.00, 0.72, 0.16],
        [0.28, 0.16, 0.72, 0.32],
        [0.28, 0.32, 0.72, 0.48],
        [0.28, 0.48, 0.72, 0.64],
        [0.28, 0.64, 0.72, 0.80],
        [0.12, 0.82, 0.88, 1.00]
      ],
      "6": [
        [0.12, 0.00, 0.52, 0.16],
        [0.48, 0.00, 0.92, 0.20],
        [0.00, 0.14, 0.38, 0.36],
        [0.10, 0.36, 0.50, 0.54],
        [0.48, 0.36, 0.92, 0.54],
        [0.00, 0.52, 0.38, 0.74],
        [0.64, 0.52, 1.00, 0.74],
        [0.08, 0.74, 0.42, 1.00],
        [0.38, 0.82, 0.70, 1.00],
        [0.58, 0.74, 0.95, 1.00]
      ],
      ".": [
        [0.10, 0.72, 0.90, 1.00]
      ]
    };
    function regionCentroid(box, fx1, fy1, fx2, fy2) {
      const x1 = box.x1 + (box.x2 - box.x1) * fx1;
      const x2 = box.x1 + (box.x2 - box.x1) * fx2;
      const y1 = box.y1 + (box.y2 - box.y1) * fy1;
      const y2 = box.y1 + (box.y2 - box.y1) * fy2;
      let sx = 0, sy = 0, n = 0;
      for (let i = 0; i < box.pts.length; i++) {
        const p = box.pts[i];
        if (p[0] >= x1 && p[0] <= x2 && p[1] >= y1 && p[1] <= y2) {
          sx += p[0]; sy += p[1]; n++;
        }
      }
      if (n < 4) return null;
      return [sx / n, sy / n];
    }
    const all = [];
    glyphs.forEach((g) => {
      const padX = Math.max(2, g.w * 0.04), padY = fontSize * 0.62;
      const box = glyphInkBox(g.x - padX, g.y - padY, g.x + g.w + padX, g.y + padY);
      const regions = REGIONS[g.ch] || REGIONS["1"];
      regions.forEach((r) => {
        const p = regionCentroid(box, r[0], r[1], r[2], r[3]);
        if (p) all.push([p[0] / cw * 100, p[1] / ch * 100]);
      });
    });
    if (all.length < 16) return null;
    return all;
  }

  function startFireflies(opts) {
    const onDone = opts && opts.onDone;
    mgActive = "fireflies";
    mgHideWorld();
    setStep("fireflies");
    const scene = document.getElementById("mgFireflies");
    const stage = document.getElementById("ffStage");
    const box = document.getElementById("ffDateBox");
    const counter = document.getElementById("ffCounter");
    const skip = document.getElementById("ffSkip");
    if (!scene || !stage || !box) { if (typeof onDone === "function") onDone(); return; }
    scene.classList.remove("done", "finishing");
    scene.classList.add("on");
    if (skip) skip.classList.remove("hidden");
    const begin = function (points) {
    const slots = (points && points.length ? points : FF_POINTS_FALLBACK).map((p) => ({ x: p[0], y: p[1] }));
    const N = slots.length;
    const bugs = [];
    const filled = new Array(N).fill(false);
    let collected = 0, done = false, dragging = false;

    function boxRect() { return box.getBoundingClientRect(); }
    function stageRect() { return stage.getBoundingClientRect(); }
    function slotScreen(i) {
      const r = boxRect();
      return { x: r.left + slots[i].x / 100 * r.width, y: r.top + slots[i].y / 100 * r.height };
    }
    function nextSlot() {
      const open = [];
      for (let i = 0; i < N; i++) if (!filled[i]) open.push(i);
      if (!open.length) return -1;
      return open[Math.floor(Math.random() * open.length)];
    }
    function updateHud() {
      const tpl = FF_CFG.counter || "Собрано: {n}/{N}";
      if (counter) counter.textContent = tpl.replace("{n}", String(collected)).replace("{N}", String(N));
      scene.style.setProperty("--ff-p", String(collected / N));
    }
    function spawnBugs() {
      stage.querySelectorAll(".ff-bug, .ff-dock").forEach((n) => n.remove());
      const sr = stageRect();
      for (let i = 0; i < N; i++) {
        const el = document.createElement("button");
        el.type = "button";
        el.className = "ff-bug";
        el.innerHTML = FF_SVG;
        el.style.setProperty("--flap", (0.7 + Math.random() * 0.6).toFixed(2) + "s");
        el.style.setProperty("--hue", String(-12 + Math.random() * 28));
        stage.appendChild(el);
        const pad = 28;
        const x = pad + Math.random() * Math.max(40, sr.width - pad * 2);
        const y = sr.height * 0.42 + Math.random() * (sr.height * 0.5);
        bugs.push({
          el, x, y,
          vx: (Math.random() * 2 - 1) * 18,
          vy: (Math.random() * 2 - 1) * 12,
          phase: Math.random() * Math.PI * 2,
          bob: 8 + Math.random() * 8,
          collected: false, flying: false, slot: -1,
          t0: 0, sx: 0, sy: 0, tx: 0, ty: 0
        });
      }
    }
    function collectBug(b) {
      if (!b || b.collected || done) return;
      const slot = nextSlot();
      if (slot < 0) return;
      b.collected = true;
      b.flying = true;
      b.slot = slot;
      filled[slot] = true;
      collected += 1;
      b.t0 = performance.now();
      b.sx = b.x; b.sy = b.y;
      const sr = stageRect();
      const t = slotScreen(slot);
      b.tx = t.x - sr.left; b.ty = t.y - sr.top;
      b.el.classList.add("collecting");
      b.el.style.pointerEvents = "none";
      updateHud();
    }
    function dock(b) {
      b.flying = false;
      b.el.innerHTML = "";
      b.el.classList.remove("ff-bug", "collecting");
      b.el.classList.add("ff-dock");
      const sr = stageRect();
      const br = boxRect();
      const sl = slots[b.slot];
      b.el.style.left = (br.left - sr.left + sl.x / 100 * br.width) + "px";
      b.el.style.top = (br.top - sr.top + sl.y / 100 * br.height) + "px";
      b.el.style.transform = "translate(-50%,-50%)";
      if (collected >= N) complete();
    }
    function complete() {
      if (done) return;
      done = true;
      skip.classList.add("hidden");
      updateHud();
      scene.classList.add("finishing");
      mgFinishTalk(FF_CFG, scene, onDone ? function () { endFireflies(); onDone(); } : null);
    }
    function skipAll() {
      if (done) return;
      const left = bugs.filter((b) => !b.collected);
      left.forEach((b, i) => { setTimeout(() => collectBug(b), FAST ? 0 : i * 32); });
    }
    function hit(cx, cy) {
      const sr = stageRect();
      const x = cx - sr.left, y = cy - sr.top;
      let best = null, bestD = 34 * 34;
      bugs.forEach((b) => {
        if (b.collected) return;
        const d = (b.x - x) * (b.x - x) + (b.y - y) * (b.y - y);
        if (d < bestD) { bestD = d; best = b; }
      });
      if (best) collectBug(best);
    }

    spawnBugs();
    updateHud();
    let last = performance.now();
    const tick = (now) => {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      const sr = stageRect();
      bugs.forEach((b) => {
        if (b.flying) {
          const p = Math.min(1, (now - b.t0) / (FAST ? 280 : 700));
          const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
          const lift = Math.sin(p * Math.PI) * 40;
          b.x = b.sx + (b.tx - b.sx) * e;
          b.y = b.sy + (b.ty - b.sy) * e - lift;
          b.el.style.left = b.x + "px";
          b.el.style.top = b.y + "px";
          if (p >= 1) dock(b);
          return;
        }
        if (b.collected) return;
        b.phase += dt * 1.6;
        b.vx += Math.sin(b.phase * 0.7) * 10 * dt;
        b.vy += Math.cos(b.phase * 0.9) * 8 * dt;
        b.vx *= 0.99; b.vy *= 0.99;
        const sp = Math.hypot(b.vx, b.vy);
        if (sp > 36) { b.vx *= 36 / sp; b.vy *= 36 / sp; }
        b.x += b.vx * dt * 8;
        b.y += b.vy * dt * 8;
        const m = 16;
        if (b.x < m) { b.x = m; b.vx = Math.abs(b.vx); }
        if (b.x > sr.width - m) { b.x = sr.width - m; b.vx = -Math.abs(b.vx); }
        if (b.y < sr.height * 0.28) { b.y = sr.height * 0.28; b.vy = Math.abs(b.vy); }
        if (b.y > sr.height - 120) { b.y = sr.height - 120; b.vy = -Math.abs(b.vy); }
        const bob = Math.sin(b.phase) * b.bob;
        b.el.style.left = b.x + "px";
        b.el.style.top = (b.y + bob) + "px";
        const flip = b.vx < 0 ? -1 : 1;
        b.el.style.transform = "translate(-50%,-50%) scaleX(" + flip + ")";
      });
      if (!done || bugs.some((b) => b.flying)) mgRaf = requestAnimationFrame(tick);
    };
    mgStopRaf();
    mgRaf = requestAnimationFrame(tick);

    const onDown = (e) => { if (done) return; dragging = true; try { stage.setPointerCapture(e.pointerId); } catch (err) {} hit(e.clientX, e.clientY); };
    const onMove = (e) => { if (!dragging || done) return; hit(e.clientX, e.clientY); };
    const onUp = () => { dragging = false; };
    stage.addEventListener("pointerdown", onDown);
    stage.addEventListener("pointermove", onMove);
    stage.addEventListener("pointerup", onUp);
    stage.addEventListener("pointercancel", onUp);
    skip.addEventListener("click", (e) => { e.stopPropagation(); skipAll(); });
    };

    const startWith = function () {
      const pts = sampleDateSlots(box) || FF_POINTS_FALLBACK;
      begin(pts);
    };
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(startWith).catch(startWith);
    else startWith();
  }

  function startStars() {
    mgActive = "stars";
    mgHideWorld();
    setStep("stars");
    const scene = document.getElementById("mgStars");
    const stage = document.getElementById("stStage");
    const svg = document.getElementById("stSvg");
    const skip = document.getElementById("stSkip");
    if (!scene || !stage || !svg) return;
    scene.classList.add("on");
    const N = ST_POINTS.length;
    let next = 0, done = false;
    const lit = new Array(N).fill(false);

    const heartPoly = ST_POINTS.slice(0, 10).map((p) => p[0] + "," + p[1]).join(" ");
    const fill = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
    fill.setAttribute("class", "st-heart-fill");
    fill.setAttribute("points", heartPoly);
    svg.appendChild(fill);

    const edgeEls = ST_EDGES.map((e) => {
      const a = ST_POINTS[e[0]], b = ST_POINTS[e[1]];
      const ln = document.createElementNS("http://www.w3.org/2000/svg", "line");
      ln.setAttribute("x1", a[0]); ln.setAttribute("y1", a[1]);
      ln.setAttribute("x2", b[0]); ln.setAttribute("y2", b[1]);
      ln.setAttribute("class", "st-edge dim");
      svg.appendChild(ln);
      return { a: e[0], b: e[1], el: ln };
    });

    const starEls = ST_POINTS.map((p, i) => {
      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      g.setAttribute("class", "st-star" + (i === 0 ? " next" : ""));
      g.setAttribute("data-i", String(i));
      g.setAttribute("transform", "translate(" + p[0] + " " + p[1] + ")");
      g.innerHTML = '<circle class="st-halo" r="4.3"/><circle class="st-core" r="1.85"/><text class="st-num" x="0" y="-6">' + (i + 1) + "</text>";
      svg.appendChild(g);
      g.addEventListener("pointerdown", (ev) => { ev.stopPropagation(); ev.preventDefault(); tap(i); });
      g.addEventListener("click", (ev) => { ev.stopPropagation(); ev.preventDefault(); });
      return g;
    });

    function refreshEdges() {
      edgeEls.forEach((e) => {
        const on = lit[e.a] && lit[e.b];
        e.el.setAttribute("class", "st-edge" + (on ? " on" : " dim"));
      });
    }
    function refreshStars() {
      starEls.forEach((g, i) => {
        g.setAttribute("class", "st-star" + (lit[i] ? " lit" : "") + (i === next && !done ? " next" : ""));
      });
    }
    function tap(i) {
      if (done) return;
      if (i !== next) {
        starEls[i].classList.add("shake");
        setTimeout(() => starEls[i].classList.remove("shake"), 380);
        return;
      }
      lit[i] = true;
      next += 1;
      refreshEdges();
      refreshStars();
      if (next >= N) complete();
    }
    function complete() {
      if (done) return;
      done = true;
      next = N;
      for (let i = 0; i < N; i++) lit[i] = true;
      refreshEdges();
      refreshStars();
      scene.classList.add("finishing", "done");
      skip.classList.add("hidden");
      mgFinishTalk(ST_CFG, scene);
    }
    function skipAll() {
      if (done) return;
      const step = () => {
        if (next >= N) { complete(); return; }
        lit[next] = true;
        next += 1;
        refreshEdges();
        refreshStars();
        if (next >= N) complete();
        else setTimeout(step, FAST ? 30 : 90);
      };
      step();
    }
    refreshEdges();
    refreshStars();
    skip.addEventListener("click", (e) => { e.stopPropagation(); skipAll(); });
  }

  function startMiniGamePreview() {
    if (FIREFLY_DEBUG) { startFireflies(); return true; }
    if (STARS_DEBUG) { startStars(); return true; }
    if (CHEST_DEBUG >= 1) {
      const n = Math.min(5, CHEST_DEBUG);
      wi = Math.max(0, n - 1);
      resizeCam();
      const p = wp();
      if (p) applyCam(p.x, p.y, mapScale());
      renderPins();
      setStep("chest");
      startTreasure(n, { onDone: function () { mode = "map"; setStep("map"); setFlags(); } });
      return true;
    }
    return false;
  }

  if (window.QuestHUD) { QuestHUD.setStep("map"); QuestHUD.hideNext && QuestHUD.hideNext(); }
  if (startMiniGamePreview()) {
    /* превью мини-игр: основной поток Тейвата не запускаем */
  } else if (!WAYPOINTS.length && !QUESTIONS.length) finish();
  else startWorld();
})();
</script>
