<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Полёт по ветру</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23ffd89a'/%3E%3C/svg%3E">
<link rel="preload" as="image" href="pair.png">
<link rel="preload" as="image" href="island.png">
<style>
  /* Переход «в духе Sky: Children of the Light» (оригинальная графика): после победы в PUBG.
     Два героя в плащах (Вика — жёлтый, Женя — оранжевый) влетают снизу, ~10 с летят по световому потоку,
     прилетают к парящему острову — и только тогда появляется «Дальше». Отладка: sky/index.html, ?fast=1 — в 4 раза быстрее (без музыки).
     Длительность и музыка — QUEST_CONFIG.SKY. Мышь/палец влево-вправо — пара смещается с креном.
     Сердечки: как в поездке на машинке — розовые с белым контуром, без поворота; по одному, ~1.4 с, падение ~5.5 с, 5 рядов, +2. Пропуск = весь максимум песни. */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f3d6d0; user-select: none; -webkit-user-select: none; }
  #bg { position: fixed; left: 0; top: 0; will-change: transform; transform-origin: 50% 30%; }
  #fx, #fxFront { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #fxFront { z-index: 6; }
  .sprite { position: fixed; left: 0; top: 0; pointer-events: none; will-change: transform, opacity; opacity: 0; }
  #island { z-index: 3; filter: drop-shadow(0 0 30px rgba(255, 230, 200, .45)); }
  #pairWrap { z-index: 5; }
  #pair { display: block; width: 100%; height: auto; transform-origin: 50% 40%; filter: drop-shadow(0 0 18px rgba(255, 236, 190, .75)) drop-shadow(0 10px 18px rgba(120, 60, 90, .25)); }
  #pairGlow { position: absolute; left: 10%; right: 10%; top: 5%; bottom: 10%; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 244, 214, .7), rgba(255, 220, 170, 0)); filter: blur(10px); z-index: -1; }
  #island img { display: block; width: 100%; height: auto; }
  .veil { position: fixed; inset: 0; z-index: 8; pointer-events: none; background: radial-gradient(circle at 50% 40%, #fffaf0, #ffe6d6); opacity: 1; transition: opacity 1.6s ease; }
  .veil.off { opacity: 0; }
  .caption { position: fixed; left: 50%; bottom: calc(120px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 7; text-align: center; pointer-events: none;
    font: 500 clamp(18px, 2.4vw, 28px)/1.3 "Segoe UI", "Noto Sans", system-ui, sans-serif; letter-spacing: .04em; color: #fff; text-shadow: 0 0 10px rgba(150, 70, 100, .75), 0 0 22px rgba(255, 170, 110, .8), 0 2px 6px rgba(90, 40, 70, .6);
    opacity: 0; transition: opacity 1.4s ease; width: min(90vw, 640px); }
  .caption.on { opacity: 1; }
  .veil.half { opacity: .55; }
  .tap-start { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 9; display: none; padding: 14px 26px; border-radius: 999px;
    font: 600 20px/1.2 "Segoe UI", system-ui, sans-serif; color: #7a4a5e; background: rgba(255, 250, 244, .85); box-shadow: 0 0 30px rgba(255, 200, 160, .8); cursor: pointer; }
  .tap-start.show { display: block; animation: tapPulse 1.8s ease-in-out infinite; }
  /* «Пропустить» — над кнопкой подсказки HUD (правый низ), тихая, видна только в полёте */
  .skip { position: fixed; z-index: 9; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(66px + env(safe-area-inset-bottom, 0px));
    padding: 7px 14px; border: 1px solid rgba(255, 255, 255, .55); border-radius: 999px; background: rgba(255, 250, 244, .28); color: rgba(255, 255, 255, .92);
    font: 500 14px/1.2 "Segoe UI", "Noto Sans", system-ui, sans-serif; letter-spacing: .03em; text-shadow: 0 1px 3px rgba(90, 40, 70, .55);
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); cursor: pointer; opacity: 0; pointer-events: none; transition: opacity .8s ease, background .2s; touch-action: manipulation; }
  .skip.show { opacity: .75; pointer-events: auto; }
  .skip.show:hover { opacity: 1; background: rgba(255, 250, 244, .42); }
  @media (max-width: 600px) { .skip { right: calc(10px + env(safe-area-inset-right, 0px)); bottom: calc(58px + env(safe-area-inset-bottom, 0px)); font-size: 13px; padding: 6px 12px; } }
  /* звук вкл/выкл — левый верх, маленький */
  .mute { position: fixed; z-index: 9; left: calc(12px + env(safe-area-inset-left, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); width: 38px; height: 38px; display: none;
    align-items: center; justify-content: center; padding: 0; border: 1px solid rgba(255, 255, 255, .55); border-radius: 50%; background: rgba(255, 250, 244, .28);
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); cursor: pointer; opacity: .8; touch-action: manipulation; }
  .mute.show { display: flex; }
  .mute svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 1px 2px rgba(90, 40, 70, .5)); }
  .mute .off { display: none; } .mute.muted .on { display: none; } .mute.muted .off { display: inline; }
  @keyframes tapPulse { 50% { box-shadow: 0 0 50px rgba(255, 190, 140, 1); } }
  #heartLayer { position: fixed; inset: 0; z-index: 6; pointer-events: none; }
  .sky-heart {
    position: absolute; left: 0; top: 0; width: 48px; height: 48px;
    margin: -24px 0 0 -24px;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.45));
    will-change: transform, opacity;
    pointer-events: none;
  }
  .sky-heart svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .sky-heart.pop { animation: heartPop .28s ease forwards; }
  @keyframes heartPop { to { opacity: 0; } }
  @media (min-width: 900px) {
    .sky-heart { width: 56px; height: 56px; margin: -28px 0 0 -28px; }
  }
  #heartHud {
    position: fixed; z-index: 9;
    right: calc(12px + env(safe-area-inset-right, 0px));
    top: calc(12px + env(safe-area-inset-top, 0px));
    display: none; align-items: center; gap: 6px;
    padding: 6px 12px 6px 10px;
    border: 1px solid rgba(255,255,255,.55); border-radius: 999px;
    background: rgba(255, 250, 244, .28);
    color: #fff; font: 600 18px/1 "Segoe UI", "Noto Sans", system-ui, sans-serif;
    text-shadow: 0 1px 3px rgba(90, 40, 70, .55);
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    pointer-events: none;
  }
  #heartHud.show { display: flex; }
  #heartHud .hh-icon { color: #ff6b8f; font-size: 20px; filter: drop-shadow(0 0 6px rgba(255,140,170,.9)); }
  #heartHud.bump { animation: hhBump .35s ease; }
  @keyframes hhBump { 30% { transform: scale(1.12); } }
  #heartSummary {
    position: fixed; left: 50%; bottom: calc(168px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%) translateY(8px);
    z-index: 8; width: min(90vw, 520px); text-align: center;
    padding: 12px 18px; border-radius: 16px;
    background: rgba(255, 250, 244, .78); color: #7a4a5e;
    font: 600 clamp(16px, 2.2vw, 22px)/1.35 "Segoe UI", "Noto Sans", system-ui, sans-serif;
    box-shadow: 0 0 28px rgba(255, 200, 160, .75);
    opacity: 0; pointer-events: none; transition: opacity .7s ease, transform .7s ease;
  }
  #heartSummary.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>

<body>
<img id="bg" alt="">
<canvas id="fx"></canvas>
<div class="sprite" id="island"><img src="island.png" alt=""></div>
<div class="sprite" id="pairWrap"><div id="pairGlow"></div><img id="pair" src="pair.png" alt="Вика и Женя"></div>
<canvas id="fxFront"></canvas>
<div class="caption" id="caption">Летим дальше — вместе</div>
<div class="veil" id="veil"></div>
<button type="button" class="skip" id="skipBtn">Пропустить ›</button>
<button type="button" class="mute" id="muteBtn" aria-label="Звук"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#fff"/><path class="on" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="off" d="M17 9l5 6M22 9l-5 6"/></svg></button>
<div class="tap-start" id="tapStart">Коснись, чтобы полететь ✨</div>
<div id="heartLayer"></div>
<div id="heartHud"><span class="hh-icon">♥</span><span id="heartCount">0</span></div>
<div id="heartSummary"></div>
<script>
(function () {
  "use strict";
  const CFG = (window.QUEST_CONFIG && window.QUEST_CONFIG.SKY) || {};
  const FAST = /[?&]fast=1/.test(location.search);
  const SPEED = FAST ? 4 : 1;
  const RISE = CFG.RISE_MS || 2600, LAND = CFG.LAND_MS || 2600;
  let FADE = CFG.FADE_MS || 3000, skipped = false;
  let FLIGHT = CFG.FLIGHT_MS || 30000;
  const T = {};
  function setTimeline() {
    if (skipped) return;
    T.enter = RISE; T.flyEnd = RISE + FLIGHT; T.landEnd = T.flyEnd + LAND;
    T.islandStart = T.flyEnd - Math.min(4400, FLIGHT * 0.4);     /* остров виден ~4 с до посадки */
    planHearts();
  }
  const bg = document.getElementById("bg"), fx = document.getElementById("fx"), fxF = document.getElementById("fxFront");
  const ctx = fx.getContext("2d"), ctxF = fxF.getContext("2d");
  const pairWrap = document.getElementById("pairWrap"), pair = document.getElementById("pair"), island = document.getElementById("island");
  const caption = document.getElementById("caption"), veil = document.getElementById("veil"), tapStart = document.getElementById("tapStart");
  const PAIR_AR = 552 / 900, ISL_AR = 781 / 705;
  let W, H, dpr, portrait, vp, cover;
  const IMGS = { wide: { src: "bg_wide.jpg", w: 1920, h: 1080, vx: 0.53, vy: 0.33 }, tall: { src: "bg_tall.jpg", w: 576, h: 1024, vx: 0.51, vy: 0.22 } };
  let cur = null;

  function layout() {
    W = innerWidth; H = innerHeight; dpr = Math.min(2, devicePixelRatio || 1);
    portrait = H > W * 1.05;
    const im = portrait ? IMGS.tall : IMGS.wide;
    if (cur !== im) { cur = im; bg.src = im.src; }
    const s = Math.max(W / im.w, H / im.h) * 1.04;              /* запас под лёгкий сдвиг при рулении */
    cover = { s, ox: (W - im.w * s) / 2, oy: (H - im.h * s) / 2 };
    Object.assign(bg.style, { width: im.w * s + "px", height: im.h * s + "px", left: cover.ox + "px", top: cover.oy + "px", transformOrigin: (im.vx * 100) + "% " + (im.vy * 100) + "%" });
    vp = { x: cover.ox + im.vx * im.w * s, y: cover.oy + im.vy * im.h * s, x0: cover.ox + im.vx * im.w * s };
    [fx, fxF].forEach((c) => { c.width = W * dpr; c.height = H * dpr; });
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctxF.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener("resize", layout); layout();

  /* ---------- руление: мышь / палец (горизонталь) и клавиатура (стрелки, WASD) ---------- */
  const steer = {
    target: 0, off: 0, vel: 0, lastInput: -1e9, enabled: false,
    x: 0, y: 0, vx: 0, vy: 0,
    keys: { l: false, r: false, u: false, d: false }
  };
  function inputAt(x) { steer.target = Math.max(-1, Math.min(1, (x / W) * 2 - 1)); steer.lastInput = performance.now(); }
  addEventListener("pointermove", (e) => { if (e.pointerType === "mouse" || e.buttons || e.pressure > 0) inputAt(e.clientX); }, { passive: true });
  addEventListener("pointerdown", (e) => { getHeartAc(); if (!e.target.closest || !e.target.closest(".qhud-next, .qhud-btn, .qhud, .skip")) inputAt(e.clientX); }, { passive: true });
  addEventListener("touchmove", (e) => { if (e.touches[0]) inputAt(e.touches[0].clientX); }, { passive: true });
  function onKey(e, down) {
    const k = e.key;
    let hit = false;
    if (k === "ArrowLeft" || k === "a" || k === "A") { steer.keys.l = down; hit = true; }
    if (k === "ArrowRight" || k === "d" || k === "D") { steer.keys.r = down; hit = true; }
    if (k === "ArrowUp" || k === "w" || k === "W") { steer.keys.u = down; hit = true; }
    if (k === "ArrowDown" || k === "s" || k === "S") { steer.keys.d = down; hit = true; }
    if (hit) {
      if (e.preventDefault) e.preventDefault();
      if (down) steer.lastInput = performance.now();
    }
  }
  addEventListener("keydown", (e) => onKey(e, true));
  addEventListener("keyup", (e) => onKey(e, false));
  addEventListener("blur", () => { steer.keys.l = steer.keys.r = steer.keys.u = steer.keys.d = false; });
  document.documentElement.style.touchAction = "none";

  /* ---------- разнообразие на длинном полёте: порывы, смена оттенков, кольца света, рои искр ---------- */
  const PALETTES = [["255,246,220", "255,214,160"], ["255,232,240", "255,190,210"], ["230,248,255", "190,226,255"], ["255,244,210", "255,224,150"], ["246,236,255", "214,196,255"]];
  const streaks = [], motes = [], wisps = [], trail = [], rings = [], swirls = [];
  let pal = PALETTES[0], gust = 0, nextGust = 6000, nextRing = 4000, nextSwirl = 9000;
  function spawnStreak(far) {
    const a = Math.PI * (0.12 + Math.random() * 0.76) + (Math.random() < 0.25 ? Math.PI : 0);
    streaks.push({ a: a + Math.sin(performance.now() / 1800) * 0.25, d: far ? 10 + Math.random() * 40 : 40 + Math.random() * 400, w: 0.6 + Math.random() * 1.8, hue: Math.random() < 0.7 ? pal[0] : pal[1] });
  }
  function spawnMote(far) { const a = Math.random() * Math.PI * 2; motes.push({ a, d: far ? 5 + Math.random() * 30 : 20 + Math.random() * 500, r: 0.8 + Math.random() * 1.8, tw: Math.random() * 6 }); }
  function spawnWisp(big) { const a = Math.PI * (0.05 + Math.random() * 0.9) + (Math.random() < 0.5 ? Math.PI : 0); wisps.push({ a, d: 30 + Math.random() * 40, r: (big ? 140 : 60) + Math.random() * 90 }); }
  for (let i = 0; i < 70; i++) spawnStreak(false);
  for (let i = 0; i < 90; i++) spawnMote(false);
  for (let i = 0; i < 4; i++) spawnWisp(false);

  function drawFx(t, dt, flow) {
    ctx.clearRect(0, 0, W, H); ctxF.clearRect(0, 0, W, H);
    const R = Math.hypot(W, H);
    /* события полёта */
    if (t > T.enter && t < T.flyEnd - 3000) {
      if (t > nextGust) { gust = 1; nextGust = t + 7000 + Math.random() * 4000; for (let i = 0; i < 4; i++) spawnWisp(i === 0); }
      if (t > nextRing) { rings.push({ r: 8, a: 1 }); nextRing = t + 5000 + Math.random() * 4000; }
      if (t > nextSwirl) { const a0 = Math.random() * Math.PI * 2; for (let i = 0; i < 26; i++) swirls.push({ a: a0 + i * 0.24, d: 12 + i * 2, spin: 0.0016 * (Math.random() < 0.5 ? -1 : 1), r: 1.5 + Math.random() * 1.5 }); nextSwirl = t + 8000 + Math.random() * 5000; }
      pal = PALETTES[Math.floor(t / 9000) % PALETTES.length];
    }
    gust = Math.max(0, gust - dt / 2600);
    const g1 = flow * (1 + 0.8 * Math.sin(Math.PI * gust));
    const grow = 1 + 0.0011 * dt * g1;
    ctx.globalCompositeOperation = "lighter";
    for (let i = streaks.length - 1; i >= 0; i--) {
      const s = streaks[i]; s.d *= grow;
      if (s.d > R) { streaks.splice(i, 1); continue; }
      const k = Math.min(1, s.d / (R * 0.5)), len = s.d * (0.10 + 0.08 * g1);
      const x1 = vp.x + Math.cos(s.a) * s.d, y1 = vp.y + Math.sin(s.a) * s.d;
      const x0 = vp.x + Math.cos(s.a) * (s.d - len), y0 = vp.y + Math.sin(s.a) * (s.d - len);
      const g = ctx.createLinearGradient(x0, y0, x1, y1);
      g.addColorStop(0, "rgba(" + s.hue + ",0)"); g.addColorStop(1, "rgba(" + s.hue + "," + (0.55 * k * Math.min(1, flow + 0.2)) + ")");
      ctx.strokeStyle = g; ctx.lineWidth = s.w * (0.6 + 2.2 * k); ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    }
    while (streaks.length < 70 * Math.max(0.35, flow) * (1 + gust)) spawnStreak(true);
    for (let i = motes.length - 1; i >= 0; i--) {
      const m = motes[i]; m.d *= 1 + 0.0008 * dt * g1 + 0.00005 * dt; m.tw += dt * 0.004;
      if (m.d > R) { motes.splice(i, 1); continue; }
      const k = Math.min(1, m.d / (R * 0.45));
      const x = vp.x + Math.cos(m.a) * m.d, y = vp.y + Math.sin(m.a) * m.d, r = m.r * (0.5 + 2.4 * k);
      const al = (0.35 + 0.35 * Math.sin(m.tw)) * Math.min(1, k * 3);
      const g = ctx.createRadialGradient(x, y, 0, x, y, r * 3); g.addColorStop(0, "rgba(255,250,230," + al + ")"); g.addColorStop(1, "rgba(255,220,170,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 3, 0, Math.PI * 2); ctx.fill();
    }
    while (motes.length < 90) spawnMote(true);
    /* кольца света от горизонта */
    for (let i = rings.length - 1; i >= 0; i--) {
      const q = rings[i]; q.r *= 1 + 0.0012 * dt * flow; const k = q.r / R; if (k > 1.1) { rings.splice(i, 1); continue; }
      ctx.strokeStyle = "rgba(" + pal[0] + "," + 0.35 * Math.sin(Math.PI * Math.min(1, k)) + ")"; ctx.lineWidth = 2 + 10 * k;
      ctx.beginPath(); ctx.ellipse(vp.x, vp.y, q.r, q.r * 0.55, 0, 0, Math.PI * 2); ctx.stroke();
    }
    /* рой искр по спирали */
    for (let i = swirls.length - 1; i >= 0; i--) {
      const q = swirls[i]; q.d *= 1 + 0.001 * dt * flow; q.a += q.spin * dt; if (q.d > R) { swirls.splice(i, 1); continue; }
      const k = Math.min(1, q.d / (R * 0.5)); const x = vp.x + Math.cos(q.a) * q.d, y = vp.y + Math.sin(q.a) * q.d * 0.8;
      ctx.fillStyle = "rgba(" + pal[1] + "," + 0.8 * k + ")"; ctx.beginPath(); ctx.arc(x, y, q.r * (0.6 + 2 * k), 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
    for (let i = wisps.length - 1; i >= 0; i--) {
      const w = wisps[i]; w.d *= 1 + 0.0009 * dt * g1;
      const k = Math.min(1, w.d / R);
      if (w.d > R * 1.3) { wisps.splice(i, 1); continue; }
      const x = vp.x + Math.cos(w.a) * w.d * 1.15, y = vp.y + Math.sin(w.a) * w.d * 0.9, r = w.r * (0.3 + 3.2 * k);
      const g = ctxF.createRadialGradient(x, y, 0, x, y, r); const al = 0.5 * Math.sin(Math.PI * Math.min(1, k * 1.2));
      g.addColorStop(0, "rgba(255,244,240," + al + ")"); g.addColorStop(0.6, "rgba(255,226,226," + al * 0.5 + ")"); g.addColorStop(1, "rgba(255,226,226,0)");
      ctxF.fillStyle = g; ctxF.beginPath(); ctxF.arc(x, y, r, 0, Math.PI * 2); ctxF.fill();
    }
    if (wisps.length < 4 && Math.random() < 0.02 * flow) spawnWisp(false);
    for (let i = trail.length - 1; i >= 0; i--) {
      const p = trail[i]; p.t += dt; if (p.t > p.life) { trail.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; const al = 1 - p.t / p.life;
      ctxF.fillStyle = "rgba(" + p.c + "," + al * 0.9 + ")"; ctxF.beginPath(); ctxF.arc(p.x, p.y, p.r * (0.5 + al), 0, Math.PI * 2); ctxF.fill();
    }
  }

  /* ---------- музыка (необязательно) ---------- */
  let audio = null, audioFailed = false, lastAT = -1;
  if (CFG.MUSIC && !FAST) {
    audio = new Audio(); audio.preload = "auto"; audio.setAttribute("playsinline", ""); audio.src = CFG.MUSIC + (/[?]/.test(CFG.MUSIC) ? "&" : "?") + "v=20261115d";
    audio.addEventListener("error", () => { audioFailed = true; });
    audio.addEventListener("loadedmetadata", () => {
      if (isFinite(audio.duration) && audio.duration > 0) { FLIGHT = Math.max(8000, audio.duration * 1000 - RISE - LAND); setTimeline(); }
    });
  }

  /* ---------- таймлайн ---------- */
  const easeOut = (t) => 1 - Math.pow(1 - t, 3), easeIO = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2, easeIn = (t) => t * t * t;
  const clamp = (v) => Math.max(0, Math.min(1, v));

  /* ---------- сердечки ---------- */
  const HEART_SVG = '<svg viewBox="0 0 32 29" aria-hidden="true"><path fill="#ff3b6b" stroke="#fff" stroke-width="2.2" stroke-linejoin="round" d="M16 27.5S2.5 18.2 2.5 10.2C2.5 5.6 6.1 2.5 10.3 2.5c2.4 0 4.5 1.2 5.7 3.1 1.2-1.9 3.3-3.1 5.7-3.1 4.2 0 7.8 3.1 7.8 7.7 0 8-13.5 17.3-13.5 17.3z"/></svg>';
  const HEART_PRIMOS = CFG.HEART_PRIMOS != null ? CFG.HEART_PRIMOS : 2;
  const HEART_EVERY = CFG.HEART_EVERY_MS || 1400;
  const HEART_JITTER = CFG.HEART_JITTER_MS != null ? CFG.HEART_JITTER_MS : 150;
  const HEART_FALL = CFG.HEART_FALL_MS || 5500;
  const HEART_START = CFG.HEART_START_MS != null ? CFG.HEART_START_MS : 800;
  const HEART_LANES = CFG.HEART_LANES || 5;
  const HEART_AWARD = CFG.AWARD_ID || "sky-hearts";
  const heartLayer = document.getElementById("heartLayer");
  const heartHud = document.getElementById("heartHud");
  const heartCountEl = document.getElementById("heartCount");
  const heartSummary = document.getElementById("heartSummary");
  let heartPlan = [];   /* { t, lane } lane: 0..HEART_LANES-1 */
  let hearts = [];      /* live */
  let nextPlanI = 0, caught = 0, awarded = false, skippedFull = false;
  let heartAudio = null;

  function buildHeartPlan(flightMs) {
    const enter = RISE;
    const flyEnd = enter + flightMs;
    const start = enter + HEART_START;
    /* последнее сердце должно успеть долететь до зоны ловли до конца полёта */
    const end = flyEnd - HEART_FALL * 0.85;
    const plan = [];
    let t = start, i = 0;
    const span = HEART_JITTER * 2 + 1;
    const minGap = Math.max(1100, HEART_EVERY - Math.abs(HEART_JITTER));
    while (t <= end) {
      const j = HEART_JITTER ? ((i * 17 + 11) % span) - HEART_JITTER : 0;
      const lane = (i * 3 + 1) % HEART_LANES;
      plan.push({ t: t, lane: lane });
      t += Math.max(minGap, HEART_EVERY + j);
      i++;
    }
    return plan;
  }
  function planHearts() {
    if (skipped || awarded) return;
    heartPlan = buildHeartPlan(T.flyEnd - T.enter);
  }

  function setHeartCount(n) {
    caught = n;
    if (heartCountEl) heartCountEl.textContent = String(n);
    if (heartHud) {
      heartHud.classList.add("show");
      heartHud.classList.remove("bump");
      void heartHud.offsetWidth;
      heartHud.classList.add("bump");
    }
  }

  function getHeartAc() {
    try {
      if (!heartAudio) {
        const ac = new (window.AudioContext || window.webkitAudioContext)();
        const master = ac.createGain();
        master.gain.value = 0.18;
        master.connect(ac.destination);
        heartAudio = { ac, master };
      }
      if (heartAudio.ac.state === "suspended") heartAudio.ac.resume().catch(() => {});
      return heartAudio;
    } catch (e) { return null; }
  }
  function playHeartSound() {
    const ctx = getHeartAc();
    if (!ctx) return;
    try {
      const ac = ctx.ac, t = ac.currentTime + 0.01;
      [0, 0.07].forEach((off, i) => {
        const o = ac.createOscillator();
        const g = ac.createGain();
        o.type = "sine";
        o.frequency.setValueAtTime(i ? 784 : 587, t + off);
        g.gain.setValueAtTime(0.0001, t + off);
        g.gain.exponentialRampToValueAtTime(0.7, t + off + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + off + 0.22);
        o.connect(g); g.connect(ctx.master);
        o.start(t + off); o.stop(t + off + 0.24);
      });
    } catch (e) {}
  }

  function spawnHeart(spec) {
    const el = document.createElement("div");
    el.className = "sky-heart";
    el.innerHTML = HEART_SVG;
    el.setAttribute("data-lane", String(spec.lane));
    heartLayer.appendChild(el);
    const r = (W >= 900 ? 28 : 24);
    hearts.push({ lane: spec.lane, born: spec.t, el: el, x: 0, y: 0, r: r, popping: false });
  }

  function laneX(lane) {
    const n = Math.max(1, HEART_LANES);
    const pad = Math.max(28, W * (portrait ? 0.10 : 0.07));
    const usable = Math.max(1, W - pad * 2);
    return pad + usable * ((lane + 0.5) / n);
  }

  function popHeart(h, silent) {
    if (h.popping) return;
    h.popping = true;
    h.el.classList.add("pop");
    if (!silent) playHeartSound();
    setTimeout(() => { if (h.el && h.el.parentNode) h.el.remove(); }, 300);
  }

  function catchHeart(h) {
    if (h.popping) return;
    popHeart(h, false);
    setHeartCount(caught + 1);
  }

  function formatSummary(n, x) {
    const tpl = CFG.HEART_SUMMARY || "Собрано сердечек: {n}, +{x} примогемов";
    return tpl.replace(/\{n\}/g, String(n)).replace(/\{x\}/g, String(x));
  }

  function finalHeartCount() {
    return skippedFull ? heartPlan.length : caught;
  }

  function grantHearts() {
    if (awarded) return finalHeartCount();
    awarded = true;
    const n = finalHeartCount();
    const x = n * HEART_PRIMOS;
    if (window.QuestHUD && x) QuestHUD.award(HEART_AWARD, x);
    return n;
  }

  function showHeartSummary() {
    const n = grantHearts();
    const x = n * HEART_PRIMOS;
    if (heartSummary) {
      heartSummary.textContent = formatSummary(n, x);
      heartSummary.classList.add("show");
    }
    setHeartCount(n);
  }

  function updateHearts(t, pairBox) {
    if (!skipped && !awarded) {
      while (nextPlanI < heartPlan.length && t >= heartPlan[nextPlanI].t) {
        spawnHeart(heartPlan[nextPlanI]);
        nextPlanI++;
        if (heartHud) heartHud.classList.add("show");
      }
    }
    for (let i = hearts.length - 1; i >= 0; i--) {
      const h = hearts[i];
      if (h.popping) {
        if (!h.el.parentNode) hearts.splice(i, 1);
        continue;
      }
      const u = (t - h.born) / HEART_FALL;
      if (u > 1.2 || skipped) {
        h.el.remove();
        hearts.splice(i, 1);
        continue;
      }
      const x = laneX(h.lane);
      const y = H * 0.10 + Math.max(0, u) * (H * 0.78);
      h.x = x; h.y = y;
      /* вертикально, без поворота и без «налёта» масштаба — как в repo_flight */
      h.el.style.transform = "translate(" + x + "px," + y + "px)";
      if (!h.popping && pairBox && u > 0.28 && u < 0.92) {
        const dx = Math.abs(x - pairBox.cx), dy = Math.abs(y - pairBox.cy);
        if (dx < pairBox.hw + h.r && dy < pairBox.hh + h.r) catchHeart(h);
      }
    }
  }

  setTimeline();
  let t0 = null, last = null, doneShown = false, clock = 0;
  function frame(now) {
    if (t0 == null) { t0 = now; last = now; }
    const rdt = Math.min(50, now - last); const dt = rdt * SPEED; last = now;
    /* время: по музыке, если играет; иначе по часам */
    if (audio && !skipped && !audio.paused && !audio.ended && audio.currentTime !== lastAT) { lastAT = audio.currentTime; clock = lastAT * 1000; } else clock += dt;
    const t = clock;
    if (audio && !audio.paused) { const left = T.landEnd - t; audio.volume = Math.max(0, Math.min(1, left / FADE)); if (left <= 0) audio.pause(); }
    skipBtn.classList.toggle("show", !skipped && t > T.enter + 400 && t < T.islandStart);
    const flow = t < T.enter ? 0.4 + 0.6 * clamp(t / T.enter) : t < T.flyEnd ? 1 : 1 - 0.85 * clamp((t - T.flyEnd) / (T.landEnd - T.flyEnd));

    /* руление: только в полёте; в начале и при посадке — к центру */
    const inFlight = !skipped && t > T.enter + 300 && t < T.flyEnd;
    steer.enabled = inFlight;
    const pw = portrait ? Math.min(W * 0.74, 440) : Math.min(W * 0.36, H * 0.62 / PAIR_AR, 620);
    const ph = pw * PAIR_AR;
    const cyFly = portrait ? H * 0.70 : H * 0.67;
    const maxX = Math.max(0, W / 2 - pw * 0.5 - 12);
    const maxYUp = Math.max(0, cyFly - ph * 0.5 - 12);
    const maxYDn = Math.max(0, H - cyFly - ph * 0.5 - 12);
    const keyX = (steer.keys.r ? 1 : 0) - (steer.keys.l ? 1 : 0);
    const keyY = (steer.keys.d ? 1 : 0) - (steer.keys.u ? 1 : 0);
    const keying = !!(keyX || keyY);
    const idle = !keying && performance.now() - steer.lastInput > 2500;
    const maxVx = W * 0.00105, maxVy = H * 0.00095;
    const accX = maxVx * 0.008, accY = maxVy * 0.008;
    const damp = Math.pow(0.06, rdt / 160);
    if (inFlight && keyX) {
      steer.vx += keyX * accX * rdt;
      steer.lastInput = performance.now();
    } else {
      steer.vx *= damp;
    }
    if (inFlight && keyY) {
      steer.vy += keyY * accY * rdt;
      steer.lastInput = performance.now();
    } else {
      steer.vy *= damp;
    }
    steer.vx = Math.max(-maxVx, Math.min(maxVx, steer.vx));
    steer.vy = Math.max(-maxVy, Math.min(maxVy, steer.vy));
    if (inFlight && keying) {
      steer.x += steer.vx * rdt;
      steer.y += steer.vy * rdt;
      if (keyX) steer.target = maxX ? (steer.x / maxX) : 0;
    } else if (inFlight && !idle) {
      const tgtX = steer.target * maxX;
      const prevX = steer.x;
      steer.x += (tgtX - steer.x) * Math.min(1, rdt * 0.004);
      steer.vx = (steer.x - prevX) / Math.max(1, rdt);
    } else if (inFlight && idle) {
      const tgtX = (Math.sin(t / 2600) * 0.35 + Math.sin(t / 1100) * 0.08) * maxX;
      const prevX = steer.x;
      steer.x += (tgtX - steer.x) * Math.min(1, rdt * 0.0022);
      steer.vx = (steer.x - prevX) / Math.max(1, rdt);
    } else {
      steer.x += (0 - steer.x) * Math.min(1, rdt * 0.0032);
      steer.y += (0 - steer.y) * Math.min(1, rdt * 0.0032);
      steer.vx = 0; steer.vy = 0;
    }
    steer.x = Math.max(-maxX, Math.min(maxX, steer.x));
    steer.y = Math.max(-maxYUp, Math.min(maxYDn, steer.y));
    const prevOff = steer.off;
    steer.off = maxX ? (steer.x / maxX) : 0;
    steer.vel = (steer.off - prevOff) / Math.max(1, rdt);
    vp.x = vp.x0 - steer.off * W * 0.03;
    bg.style.transform = "translateX(" + (-steer.off * W * 0.02) + "px) scale(" + (1.0 + 0.14 * easeIO(clamp(t / T.landEnd))) + ")";
    drawFx(t, dt, flow);

    let cx = W / 2 + steer.x, cy, sc = 1, rot = 0, op = 1;
    const bank = Math.max(-12, Math.min(12, steer.vel * 9000)) + steer.off * 4;
    const isl = { w: portrait ? Math.min(W * 0.82, 420) : Math.min(W * 0.34, H * 0.62 / ISL_AR, 600) };
    isl.h = isl.w * ISL_AR; isl.cx = W / 2; isl.cy = portrait ? H * 0.38 : H * 0.42;
    if (t < T.enter) { const e = easeOut(clamp(t / T.enter)); cy = H + ph * 0.8 + (cyFly - H - ph * 0.8) * e; sc = 1.25 - 0.25 * e; op = clamp(t / 500); }
    else if (t < T.flyEnd) { const u = t - T.enter; cy = cyFly + steer.y + Math.sin(u / 900) * H * 0.018; rot = Math.sin(u / 1300) * 2.2 + bank; }
    else {
      const e = easeIO(clamp((t - T.flyEnd) / (T.landEnd - T.flyEnd)));
      const tx = isl.cx - isl.w * 0.02, ty = isl.cy - isl.h * 0.2;
      const u = t - T.enter; const y0 = cyFly + steer.y * (1 - e) + Math.sin(u / 900) * H * 0.018 * (1 - e);
      const x0 = W / 2 + steer.x * (1 - e);
      cx = x0 + (tx - x0) * e; cy = y0 + (ty - y0) * e; sc = 1 - 0.8 * e; rot = (Math.sin(u / 1300) * 2.2 + bank) * (1 - e);
    }
    /* зажим с учётом поворота и дрожания, чтобы пара оставалась на экране */
    if (t >= T.enter && t < T.flyEnd) {
      const rad = Math.abs(rot) * Math.PI / 180;
      const hw = pw * sc * 0.5, hh = ph * sc * 0.5;
      const aabbW = hw * Math.cos(rad) + hh * Math.sin(rad);
      const aabbH = hw * Math.sin(rad) + hh * Math.cos(rad);
      const pad = 18;
      cx = Math.max(aabbW + pad, Math.min(W - aabbW - pad, cx));
      cy = Math.max(aabbH + pad, Math.min(H - aabbH - pad, cy));
      steer.x = cx - W / 2;
      const bob = Math.sin((t - T.enter) / 900) * H * 0.018;
      steer.y = cy - cyFly - bob;
    }
    const flutter = 1 + Math.sin(t / 260) * 0.012;
    pairWrap.style.width = pw + "px"; pairWrap.style.opacity = op;
    pairWrap.style.transform = "translate(" + (cx - pw / 2) + "px," + (cy - ph / 2) + "px) scale(" + sc + ") rotate(" + rot + "deg)";
    pair.style.transform = "scale(" + (1 / flutter) + "," + flutter + ") skewX(" + (Math.sin(t / 420) * 1.2 - bank * 0.3) + "deg)";
    updateHearts(t, (t > T.enter && t < T.flyEnd + 400) ? {
      cx: cx, cy: cy,
      hw: pw * sc * 0.38,
      hh: ph * sc * 0.36
    } : null);
    if (t > 400 && t < T.landEnd - 600 && Math.random() < 0.6 + gust * 0.4) {
      const side = Math.random() < 0.5 ? -1 : 1;
      trail.push({ x: cx + side * pw * sc * (0.32 + Math.random() * 0.14), y: cy + ph * sc * (0.05 + Math.random() * 0.3), vx: side * 0.02 * Math.random() - steer.vel * 40, vy: 0.05 + Math.random() * 0.06, r: 1 + Math.random() * 2.2 * sc, t: 0, life: 900 + Math.random() * 700, c: side < 0 ? "255,226,120" : "255,170,90" });
    }
    if (t > T.islandStart) {
      const e = easeIn(clamp((t - T.islandStart) / (T.flyEnd + 1400 - T.islandStart)));
      const s2 = 0.05 + 0.95 * e;
      const x = vp.x + (isl.cx - vp.x) * e, y = vp.y + (isl.cy - vp.y) * e;
      island.style.width = isl.w + "px";
      island.style.opacity = clamp((t - T.islandStart) / 1200);
      island.style.transform = "translate(" + (x - isl.w / 2) + "px," + (y - isl.h / 2 + Math.sin(t / 1500) * 4) + "px) scale(" + s2 + ")";
    }
    if (t > T.landEnd - 1200) caption.classList.add("on");
    if (t >= T.landEnd && !doneShown) {
      doneShown = true; window.__sky.done = true;
      showHeartSummary();
      if (window.QuestHUD) { QuestHUD.setStep("done"); QuestHUD.showNext("Дальше"); }
    }
    window.__sky.t = t; window.__sky.cx = cx; window.__sky.cy = cy; window.__sky.rot = rot; window.__sky.cyFly = cyFly;
    requestAnimationFrame(frame);
  }
  window.__sky = { t: 0, done: false, T, speed: SPEED, steer, music: !!audio, audio, skipped: false,
    get caught() { return caught; }, get planned() { return heartPlan.length; },
    get awarded() { return awarded; }, hearts: hearts, skip: function () { skip(); },
    lanes: HEART_LANES, fallMs: HEART_FALL, everyMs: HEART_EVERY, primos: HEART_PRIMOS,
    get plan() { return heartPlan.slice(); },
    buildPlan: buildHeartPlan,
    laneX: laneX, playHeartSound: playHeartSound };
  /* «Пропустить»: остров быстро подлетает, пара к центру и садится, музыка гаснет — ~3.6 с, потом «Дальше» */
  const skipBtn = document.getElementById("skipBtn");
  function skip() {
    const t = clock;
    if (skipped || t < T.enter || t >= T.islandStart) return;
    skipped = true; skippedFull = true; window.__sky.skipped = true; skipBtn.classList.remove("show");
    T.islandStart = t; T.flyEnd = t + 1000; T.landEnd = T.flyEnd + LAND;
    FADE = T.landEnd - t;
    setHeartCount(heartPlan.length);
    hearts.forEach((h) => { if (!h.popping) { h.el.remove(); } });
    hearts.length = 0;
  }
  skipBtn.addEventListener("pointerdown", (e) => e.stopPropagation());
  skipBtn.addEventListener("click", (e) => { e.stopPropagation(); skip(); });
  /* звук вкл/выкл */
  const muteBtn = document.getElementById("muteBtn");
  const MKEY = "nov16_sky_muted";
  function setMuted(m) { if (!audio) return; audio.muted = m; muteBtn.classList.toggle("muted", m); try { localStorage.setItem(MKEY, m ? "1" : "0"); } catch (e) {} }
  if (audio) { muteBtn.classList.add("show"); setMuted((() => { try { return localStorage.getItem(MKEY) === "1"; } catch (e) { return false; } })()); }
  muteBtn.addEventListener("pointerdown", (e) => e.stopPropagation());
  muteBtn.addEventListener("click", (e) => { e.stopPropagation(); if (audio.paused && started && !doneShown) audio.play().catch(() => {}); setMuted(!audio.muted); });

  let started = false;
  const start = () => { if (started) return; started = true; tapStart.classList.remove("show"); veil.classList.remove("half"); veil.classList.add("off"); requestAnimationFrame(frame); };
  /* Музыка. Жест «Дальше» на прошлой странице на новую загрузку не переносится, поэтому автозапуск со звуком
     браузер обычно блокирует. Пробуем play(); если отказ (или ответа нет 1.5 с) — «Коснись, чтобы полететь ✨»,
     и по касанию запускаем музыку и полёт одновременно. Если трек не грузится — летим без музыки. */
  function askTap() {
    if (started) return;
    tapStart.classList.add("show"); veil.classList.add("half");
    const go = (e) => {
      if (started) return;
      ["click", "touchend", "keydown"].forEach((ev) => removeEventListener(ev, go, true));
      if (audioFailed) { start(); return; }
      const pr = audio.play();          /* вызов прямо в обработчике жеста — разблокирует звук */
      start();
      if (pr && pr.catch) pr.catch(() => { window.__sky.audioBlocked = true; });
    };
    ["click", "touchend", "keydown"].forEach((ev) => addEventListener(ev, go, true));
  }
  function begin() {
    if (!audio || audioFailed) { start(); return; }
    let settled = false;
    const timer = setTimeout(() => { if (!settled) askTap(); }, 1500);
    let pr;
    try { pr = audio.play(); } catch (e) { pr = Promise.reject(e); }
    Promise.resolve(pr).then(() => { settled = true; clearTimeout(timer); start(); },
      () => { settled = true; clearTimeout(timer); if (audioFailed) start(); else askTap(); });
  }
  Promise.all(["pair.png", "island.png", cur.src].map((src) => new Promise((r) => { const i = new Image(); i.onload = i.onerror = r; i.src = src; }))).then(() => setTimeout(begin, 200));
})();
</script>
</body>
</html>
