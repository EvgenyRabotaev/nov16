<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Наш мир — Minecraft</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%236aa7d8'/%3E%3C/svg%3E">
<link rel="preload" as="image" href="chars/vika_flowers.png">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #7fb3e0; font-family: "Segoe UI", "Noto Sans", "DejaVu Sans", Roboto, system-ui, sans-serif; user-select: none; }
  .scene { position: fixed; inset: 0; overflow: hidden; }
  .scene img.layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; pointer-events: none; }
  #houseStages img.layer { opacity: 0; transition: opacity 1.2s ease; }
  #houseStages img.layer.on { opacity: 1; }
  /* Фон-кадр 16:9 со стройкой дома. Обычно «cover»; если вопрос сверху налезает на дом (или телефон) —
     кадр сдвигается/уменьшается, а края заполняет размытая копия фона. */
  #bgBlur { position: absolute; inset: -40px; background: url(bg_stage0.jpg) center / cover no-repeat; filter: blur(16px) saturate(1.05); }
  #bgWrap { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transition: top .7s ease, left .7s ease, width .7s ease, height .7s ease; }
  #bgWrap.feather { -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 9%, #000 91%, transparent 100%); mask-image: linear-gradient(to bottom, transparent 0, #000 9%, #000 91%, transparent 100%); }
  #bgWrap.feather-top { -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 9%); mask-image: linear-gradient(to bottom, transparent 0, #000 9%); }
  #bgWrap img.layer { object-fit: fill; }

  .char { position: absolute; left: 0; bottom: 0; pointer-events: none; will-change: transform; transform-origin: 50% 100%; }
  .char img { display: block; width: 100%; height: auto; filter: drop-shadow(0 6px 6px rgba(0, 0, 0, .25)); }
  .char .shadow { position: absolute; left: 12%; right: 12%; bottom: -6px; height: 14px; border-radius: 50%; background: rgba(0, 40, 0, .28); filter: blur(4px); z-index: -1; }
  .char.pop img { animation: pop .7s ease; }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.14) translateY(-4%); filter: brightness(1.5) drop-shadow(0 0 18px #fff6b0); } 100% { transform: scale(1); } }
  .spark { position: absolute; width: 10px; height: 10px; background: #fffbe0; box-shadow: 0 0 8px #ffe680, 0 0 2px #fff; pointer-events: none; z-index: 5; image-rendering: pixelated; animation: spark 1s ease-out forwards; }
  .spark.pink { background: #ffd1ec; box-shadow: 0 0 8px #ff9bd2; }
  .spark.blue { background: #d6f0ff; box-shadow: 0 0 8px #8fd0ff; }
  /* финал: пиксельное сердечко между Викой и Женей */
  #mcHeart { position: absolute; left: 0; top: 0; z-index: 6; pointer-events: none; opacity: 0; transform-origin: 50% 100%; image-rendering: pixelated; }
  #mcHeart svg { display: block; width: 100%; height: auto; shape-rendering: crispEdges; filter: drop-shadow(0 0 10px rgba(255, 90, 110, .7)) drop-shadow(0 3px 0 rgba(0, 0, 0, .25)); }
  #mcHeart.on { opacity: 1; animation: heartPop .9s cubic-bezier(.2, 1.6, .4, 1) both, heartBob 2.4s ease-in-out .9s infinite; }
  @keyframes heartPop { 0% { transform: translateY(20px) scale(0); opacity: 0; } 60% { opacity: 1; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
  @keyframes heartBob { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-8px) scale(1.06); } }
  @keyframes spark { 0% { transform: translate(0, 0) scale(.4); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(1.1) rotate(45deg); opacity: 0; } }

  .panel {
    position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
    width: min(600px, calc(100vw - 24px));
    max-height: calc(100dvh - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column;
    background: rgba(16, 0, 16, .86); color: #fff;
    border: 3px solid #1b1b1b; box-shadow: inset 0 0 0 2px #5000aa, 0 10px 30px rgba(0, 0, 0, .35);
    padding: 14px 16px 14px; z-index: 10;
    transition: opacity .45s ease, transform .45s ease;
  }
  .panel.hidden { opacity: 0; transform: translate(-50%, -12px); pointer-events: none; }
  .q-num { font: 700 13px/1 "Courier New", "DejaVu Sans Mono", monospace; letter-spacing: .08em; color: #ffff55; text-shadow: 2px 2px 0 #3f3f00; }
  .q-icon { display: inline-block; margin-left: .3em; letter-spacing: 0; text-shadow: none; font-style: normal; font-weight: 400; transform: translateY(-1px); }
  .q-text { margin: 10px 0 12px; font-size: 18px; line-height: 1.45; color: #f6f1e6; max-height: 38vh; min-height: 0; flex: 0 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; text-shadow: 1px 1px 0 #000; }
  .q-text i { font-style: italic; }
  .ans-inputs { display: flex; flex-direction: column; gap: 8px; margin: 0 0 8px; }
  .ans-input { width: 100%; padding: 10px 12px; border: 2px solid #a0a0a0; border-radius: 0; background: #000; color: #fff; font: 16px/1.3 "Segoe UI", "Noto Sans", sans-serif; outline: none; user-select: text; }
  .ans-input::placeholder { color: #8a8a8a; }
  .ans-input:focus { border-color: #fff; }
  .ans-input.ok { border-color: #55ff55; }
  .ans-input.bad { animation: shake .38s ease; }
  @keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
  .ans-msg { min-height: 20px; margin: 0 0 10px; font-size: 14px; color: #ffd9a0; }
  .ans-msg.ok { color: #7dff7d; }
  .btn {
    appearance: none; cursor: pointer; min-width: 150px; padding: 10px 22px;
    font: 700 16px/1 "Courier New", "DejaVu Sans Mono", monospace; color: #fff; text-shadow: 2px 2px 0 #3f3f3f;
    background: #8b8b8b; border: 3px solid #1b1b1b; border-radius: 0;
    box-shadow: inset 3px 3px 0 #c6c6c6, inset -3px -3px 0 #555;
  }
  .btn:hover:not(:disabled) { background: #7c8fd4; box-shadow: inset 3px 3px 0 #a9b9f0, inset -3px -3px 0 #4a5a99; }
  .btn:disabled { opacity: .55; cursor: default; }

  /* закат, кошка, светлячки, достижение */
  #mcSky {
    position: absolute; inset: 0; pointer-events: none; z-index: 2;
    background: linear-gradient(to top, rgba(255, 140, 60, .0), rgba(255, 160, 80, .0) 40%, rgba(80, 70, 140, .0));
    opacity: 0; transition: opacity 1.6s ease, background 1.6s ease; mix-blend-mode: soft-light;
  }
  #mcSky.lv1 { opacity: .18; background: linear-gradient(to top, rgba(255, 200, 120, .18), transparent 55%); }
  #mcSky.lv2 { opacity: .28; background: linear-gradient(to top, rgba(255, 170, 90, .22), rgba(255, 200, 140, .08) 50%, transparent 80%); }
  #mcSky.lv3 { opacity: .4; background: linear-gradient(to top, rgba(255, 140, 70, .28), rgba(255, 180, 110, .12) 55%, transparent 85%); }
  #mcSky.lv4 { opacity: .2; background: linear-gradient(to top, rgba(255, 120, 50, .12), transparent 60%); } /* закат уже на картинке */
  #mcFireflies { position: absolute; inset: 0; z-index: 7; pointer-events: none; }
  #mcCat {
    position: absolute; z-index: 4; width: 42px; height: 28px; pointer-events: none;
    opacity: 0; transition: opacity 1s ease; image-rendering: pixelated;
    filter: drop-shadow(0 3px 2px rgba(0,0,0,.35));
  }
  #mcCat.on { opacity: 1; animation: catBob 2.8s ease-in-out infinite; }
  @keyframes catBob { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-2px); } }
  .mc-ach {
    position: fixed; left: 16px; top: 16px; z-index: 40;
    display: flex; align-items: center; gap: 15px;
    min-width: 360px; max-width: min(540px, calc(100vw - 24px));
    padding: 12px 18px 12px 12px;
    background: #212121; border: 3px solid #000;
    box-shadow: inset 0 0 0 2px #555, 4px 4px 0 rgba(0,0,0,.35);
    color: #fff; font: 700 20px/1.25 "Courier New", "DejaVu Sans Mono", monospace;
    text-shadow: 2px 2px 0 #000; pointer-events: none;
    animation: achIn .35s ease both;
  }
  .mc-ach.off { animation: achOut .4s ease forwards; }
  .mc-ach .ico { width: 48px; height: 48px; image-rendering: pixelated; flex: 0 0 48px; background: #111; border: 2px solid #000; }
  .mc-ach .kicker { color: #fcfc54; font-size: 16px; letter-spacing: .04em; }
  .panel.craft-q #answerBtn, .panel.craft-q .ans-inputs { display: none; }
  @keyframes achIn { from { transform: translateY(-16px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes achOut { to { transform: translateY(-16px); opacity: 0; } }
  @media (max-width: 600px) {
    .mc-ach { left: 8px; top: auto; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); }
  }

  .panel.msg { cursor: pointer; }
  .panel.msg .ans-inputs, .panel.msg #answerBtn { display: none; }
  .panel.msg .ans-msg { color: #d4c48a; min-height: 0; margin: 0; text-align: center; font: 700 13px/1.3 "Courier New", "DejaVu Sans Mono", monospace; letter-spacing: .04em; animation: msgBlink 1.4s ease-in-out infinite; }
  .panel.msg .q-num { display: none; }
  @keyframes msgBlink { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }

  #mcBookItem {
    position: fixed; left: 50%; top: 42%;
    z-index: 16;
    width: min(104px, 26vw);
    transform: translate(-50%, -50%);
    cursor: pointer;
    image-rendering: pixelated;
    filter: drop-shadow(0 0 10px rgba(255, 230, 140, .95)) drop-shadow(0 0 26px rgba(255, 200, 80, .55));
    animation: bookIn .55s ease both, bookBob 2.1s ease-in-out .55s infinite;
    -webkit-tap-highlight-color: transparent;
  }
  #mcBookItem svg { display: block; width: 100%; height: auto; shape-rendering: crispEdges; }
  @keyframes bookIn { from { transform: translate(-50%, -50%) scale(.4); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
  @keyframes bookBob {
    0%, 100% { transform: translate(-50%, -50%) translateY(0); }
    50% { transform: translate(-50%, -50%) translateY(-10px); }
  }
  #mcBookOpen {
    position: fixed; inset: 0; z-index: 30;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px;
    background: rgba(0, 0, 0, .5);
    cursor: pointer;
  }
  #mcBookOpen.hidden { display: none; }
  .mc-book-spread {
    display: flex;
    width: min(680px, calc(100vw - 28px));
    background: #4a2e18;
    border: 4px solid #1a0e08;
    box-shadow: 0 18px 40px rgba(0,0,0,.55), inset 0 0 0 2px #7a4e28;
    padding: 8px 8px 6px;
    pointer-events: none;
  }
  .mc-book-page {
    flex: 1 1 50%;
    background: #f3e4c0;
    min-height: min(52vh, 360px);
    padding: 12px 10px 10px;
    box-shadow: inset 0 0 18px rgba(120, 80, 30, .12);
  }
  .mc-book-page.left { border-right: 2px solid #d2bf8e; }
  .mc-book-page svg { width: 100%; height: calc(100% - 4px); display: block; }
  .mc-book-num {
    margin-top: 8px;
    font: 700 15px/1 "Courier New", "DejaVu Sans Mono", monospace;
    color: #f3e4c0;
    text-shadow: 1px 1px 0 #1a0e08;
    letter-spacing: .08em;
    pointer-events: none;
  }
  @media (max-width: 420px) {
    .mc-book-spread { width: calc(100vw - 16px); padding: 6px; }
    .mc-book-page { min-height: min(46vh, 300px); padding: 8px 6px; }
  }

  @media (max-width: 700px) {
    .panel { padding: 12px 12px 12px; }
    .q-text { font-size: 15px; line-height: 1.4; margin: 8px 0 10px; max-height: min(42vh, calc(100dvh - 220px)); }
  }
</style>

<body>
<div class="scene" id="scene">
  <div id="bgBlur"></div>
  <div id="bgWrap">
    <img class="layer" id="bg" src="bg_stage0.jpg" alt="">
    <div id="houseStages"></div><!-- этапы дома: MINECRAFT.HOUSE_STAGES в quest_config.js (bg_stage1…4.jpg) -->
    <div id="mcSky" aria-hidden="true"></div>
    <div id="mcCat" aria-hidden="true"></div>
    <canvas id="mcFireflies" aria-hidden="true"></canvas>
  </div>
  <div class="char" id="vika"><div class="shadow"></div><img id="vikaImg" src="chars/vika_noflowers.png" alt="Вика"></div>
  <div class="char" id="zhenya"><div class="shadow"></div><img src="chars/zhenya.png" alt="Женя"></div>
</div>

<aside class="panel hidden" id="panel">
  <div class="q-num" id="qNum">Вопрос 1</div>
  <div class="q-text" id="qText"></div>
  <div class="ans-inputs" id="answerInputs"></div>
  <div class="ans-msg" id="ansMsg" aria-live="polite"></div>
  <button class="btn" id="answerBtn" type="button">Ответить</button>
</aside>

<div id="mcBookItem" hidden role="button" tabindex="0" aria-label="Книга"></div>
<div id="mcBookOpen" class="hidden" role="dialog" aria-label="Ежедневник">
  <div class="mc-book-spread">
    <div class="mc-book-page left"><svg id="mcBookLeft" viewBox="0 0 160 200" aria-hidden="true"></svg></div>
    <div class="mc-book-page right"><svg id="mcBookRight" viewBox="0 0 160 200" aria-hidden="true"></svg></div>
  </div>
  <div class="mc-book-num" id="mcBookNum">17/365</div>
</div>

<script>
(function () {
  "use strict";
  const CFG = window.QUEST_CONFIG || {};
  const QUESTIONS = (CFG.QUESTIONS && CFG.QUESTIONS.minecraft) || [];
  const MC = CFG.MINECRAFT || {};
  const EXIT = MC.EXIT || null;     /* выход из Майна: вопрос «Двигаемся дальше?» → крафт лодки → boat/ */
  let exitMode = false;
  const curQ = () => exitMode ? EXIT.question : QUESTIONS[question];
  const N = Math.max(1, QUESTIONS.length);

  /* Раскладка: середину (~34% ширины) держим под будущий дом. */
  const HOUSE_FRAC = 0.34;
  const EDGE = 0.02;          /* отступ от края экрана, доля ширины */
  const GAP = 0.012;          /* зазор до зоны дома */
  const WALK_MS = 1500;
  const HOPS = 3;

  const vika = document.getElementById("vika");
  const vikaImg = document.getElementById("vikaImg");
  const zhenya = document.getElementById("zhenya");
  const panel = document.getElementById("panel");
  const qNum = document.getElementById("qNum");
  const qText = document.getElementById("qText");
  const answerInputs = document.getElementById("answerInputs");
  const ansMsg = document.getElementById("ansMsg");
  const answerBtn = document.getElementById("answerBtn");
  const houseStages = document.getElementById("houseStages");
  const FINE = window.matchMedia && matchMedia("(pointer: fine)").matches;

  const ASPECT = { vika: 391 / 720, zhenya: 398 / 720 };
  let step = 0;               /* сколько вопросов уже отвечено */
  let shown = 0;              /* текущее «визуальное» положение (может быть дробным во время ходьбы) */
  let question = 0;           /* индекс текущего вопроса */
  let busy = false, done = false;
  let L = null;

  function layout() {
    const W = window.innerWidth, H = window.innerHeight;
    const houseHalf = W * HOUSE_FRAC / 2;
    const lane = W / 2 - houseHalf - W * GAP - W * EDGE;    /* ширина полосы для одного персонажа */
    /* рост: не больше 44% высоты и такой, чтобы персонаж занимал ≤ 55% своей полосы (остальное — путь) */
    let h = Math.min(H * 0.44, 380);
    const maxW = lane * (W < H ? 0.8 : 0.62);
    h = Math.min(h, maxW / Math.max(ASPECT.vika, ASPECT.zhenya));
    const vw = h * ASPECT.vika, zw = h * ASPECT.zhenya;
    const bottom = Math.max(64, H * 0.07);
    L = {
      W, H, h, vw, zw, bottom,
      houseL: W / 2 - houseHalf, houseR: W / 2 + houseHalf,
      vStart: W * EDGE, vEnd: W / 2 - houseHalf - W * GAP - vw,
      zStart: W - W * EDGE - zw, zEnd: W / 2 + houseHalf + W * GAP
    };
    vika.style.width = vw + "px";
    zhenya.style.width = zw + "px";
    placeBg(W, H, h, bottom);
    /* Домик кодом (только если у этапа нет картинки): в альбомной — между героями, на телефоне — над их головами. */
    if (window.MCCraft && MCCraft.House.el) {
      const R = MCCraft.House.ratio;
      let hw, hb;
      if (W < H) { hw = Math.min(W * 0.66, 340); hb = bottom + h * 0.8; }
      else { hw = Math.min(W * HOUSE_FRAC * 0.94, h * 1.25 / R); hb = bottom - 4; }
      MCCraft.House.place({ x: W / 2 - hw / 2, w: hw, bottom: hb });
      window.__mcHouse = { x: W / 2 - hw / 2, w: hw, h: hw * R, bottom: hb };
    }
    place(shown, 0);
    placeCat();
  }

  /* Кадр фона 1280×720; дом на картинках этапов занимает примерно x 437…875, y 150…525. */
  const IMG = { w: 1280, h: 720 }, HOUSE_BOX = { x0: 440, x1: 890, y0: 78, y1: 528 };
  const bgWrap = document.getElementById("bgWrap");
  let panelBottom = 0;      /* низ панели вопроса (меряется в render) */
  function placeBg(W, H, h, bottom) {
    let s, left, top, cls = "";
    if (W >= H) {
      s = Math.max(W / IMG.w, H / IMG.h);
      left = (W - IMG.w * s) / 2; top = (H - IMG.h * s) / 2;
      const need = panelBottom + 10 - (top + HOUSE_BOX.y0 * s);           /* панель налезает на крышу? */
      const room = (H - 12) - (top + HOUSE_BOX.y1 * s);                  /* не уводить фундамент за экран */
      const d = Math.max(0, Math.min(need, room));
      if (d > 0) { top += d; if (top > 0) cls = "feather-top"; }
    } else {
      /* телефон: дом целиком между панелью вопроса и головами героев */
      const bandTop = Math.max(panelBottom + 8, H * 0.28), bandBot = H - bottom - h - 4;
      s = Math.min(W / 470, Math.max(0.45, (bandBot - bandTop) / (HOUSE_BOX.y1 - HOUSE_BOX.y0)));
      left = W / 2 - (HOUSE_BOX.x0 + HOUSE_BOX.x1) / 2 * s;
      top = bandBot - HOUSE_BOX.y1 * s;
      cls = "feather";
    }
    Object.assign(bgWrap.style, { left: left + "px", top: top + "px", width: IMG.w * s + "px", height: IMG.h * s + "px" });
    bgWrap.className = cls;
    window.__mcBg = { s, left, top, house: { x: left + HOUSE_BOX.x0 * s, y: top + HOUSE_BOX.y0 * s, w: (HOUSE_BOX.x1 - HOUSE_BOX.x0) * s, h: (HOUSE_BOX.y1 - HOUSE_BOX.y0) * s }, panelBottom };
  }

  function xs(p) {
    const t = p / N;
    return { v: L.vStart + (L.vEnd - L.vStart) * t, z: L.zStart + (L.zEnd - L.zStart) * t };
  }

  let together = 0;          /* 0…1 — финал: герои подходят друг к другу в центре */
  const SC_T = 0.88;         /* в финале чуть «уходят вглубь» к дому: меньше и выше, чтобы не мешала кнопка «Дальше» */
  function togetherX() {
    const ov = Math.min(L.vw, L.zw) * 0.14 * SC_T;       /* чуть заходят друг за друга — плечом к плечу */
    return { v: L.W / 2 + ov - L.vw * SC_T - L.vw * (1 - SC_T) / 2, z: L.W / 2 - ov - L.zw * (1 - SC_T) / 2 };
  }
  function liftPx() { return Math.max(0, (L.W < L.H ? 120 : 84) - L.bottom); }
  function place(p, hop) {
    const x = xs(p);
    if (together > 0) { const g = togetherX(); x.v += (g.v - x.v) * together; x.z += (g.z - x.z) * together; }
    const y = -L.bottom;
    const hv = hop ? hop.y : 0, rot = hop ? hop.r : 0;
    const lift = together ? liftPx() * together : 0, sc = 1 - (1 - SC_T) * together;
    vika.style.transform = "translate(" + x.v + "px," + (y - hv - lift) + "px) rotate(" + rot + "deg)" + (together ? " scale(" + sc + ")" : "");
    zhenya.style.transform = "translate(" + x.z + "px," + (y - hv - lift) + "px) rotate(" + (-rot) + "deg)" + (together ? " scale(" + sc + ")" : "");
    x.sc = sc; x.lift = lift;
    window.__mcPos = { vika: [x.v, x.v + L.vw], zhenya: [x.z, x.z + L.zw], house: [L.houseL, L.houseR], h: L.h, W: L.W, together };
    placeHeart(x);
  }

  /* Пиксельное сердечко в стиле Minecraft — рисуется кодом (SVG). */
  const HEART_MASK = [".##.##.", "#######", "#######", ".#####.", "..###..", "...#..."];
  function heartSvg() {
    const W0 = HEART_MASK[0].length + 2, H0 = HEART_MASK.length + 2;
    const isB = (x, y) => y >= 0 && y < HEART_MASK.length && x >= 0 && x < HEART_MASK[0].length && HEART_MASK[y][x] === "#";
    let r = "";
    for (let y = -1; y <= HEART_MASK.length; y++) for (let x = -1; x <= HEART_MASK[0].length; x++) {
      let c = null;
      if (isB(x, y)) {
        c = "#e3262b";
        if ((y === 1 && (x === 1 || x === 4)) || (y === 2 && x === 1)) c = "#ff9a9a";         /* блик */
        else if (!isB(x + 1, y + 1) || (y >= 3 && x >= 3 + (y - 3))) c = "#b0151b";           /* тень */
      } else if (isB(x - 1, y) || isB(x + 1, y) || isB(x, y - 1) || isB(x, y + 1)) c = "#2a0508";   /* контур */
      if (c) r += '<rect x="' + (x + 1) + '" y="' + (y + 1) + '" width="1.02" height="1.02" fill="' + c + '"/>';

  async function finale(opts) {

        together = ease(t);
        const ph = t * hops * Math.PI, amp = Math.min(18, L.h * 0.06);
        place(shown, { y: Math.abs(Math.sin(ph)) * amp, r: Math.sin(ph * 2) * 2.5 * (1 - t) });
        if (t < 1) requestAnimationFrame(f); else { together = 1; place(shown, 0); res(); }
      }
      requestAnimationFrame(f);
    });

    heartEl.classList.add("on"); window.__mcHeartOn = true;

  function ease(t) { return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

  function walkTo(target) {
    return new Promise((res) => {
      const from = shown, t0 = performance.now();
      function f(now) {
        const t = Math.min(1, (now - t0) / WALK_MS);
        shown = from + (target - from) * ease(t);
        const ph = t * HOPS * Math.PI;
        const amp = Math.min(18, L.h * 0.06);
        place(shown, { y: Math.abs(Math.sin(ph)) * amp, r: Math.sin(ph * 2) * 2.5 * (1 - t) });
        if (t < 1) requestAnimationFrame(f); else { shown = target; place(shown, 0); res(); }
      }
      requestAnimationFrame(f);
    });
  }

  function startFireflies() {
    const c = document.getElementById("mcFireflies");

    const bugs = [];
    function resize() { c.width = innerWidth; c.height = innerHeight; }

        const a = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(now/400 * b.s + b.p));

        ctx.fillRect(Math.round(b.x), Math.round(b.y), Math.ceil(b.r), Math.ceil(b.r));

  function squigglePage(svg, seed) {
    let s = seed;
    const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
    svg.innerHTML = "";
    const stroke = "#4a3420";
    for (let line = 0; line < 11; line++) {
      const y = 14 + line * 15.5 + rnd() * 2.5;
      let x = 8 + rnd() * 7;
      const maxX = 152 - rnd() * 22;
      let d = "M" + x.toFixed(1) + "," + y.toFixed(1);
      while (x < maxX) {
        const x2 = Math.min(maxX, x + 10 + rnd() * 12);
        const y2 = y + (rnd() - 0.5) * 5.5;
        const cx = (x + x2) / 2 + (rnd() - 0.5) * 5;
        const cy = y + (rnd() - 0.55) * 9;
        d += " Q" + cx.toFixed(1) + "," + cy.toFixed(1) + " " + x2.toFixed(1) + "," + y2.toFixed(1);
        x = x2;
      }
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", d);
      path.setAttribute("fill", "none");
      path.setAttribute("stroke", stroke);
      path.setAttribute("stroke-width", String(1.15 + rnd() * 0.5));
      path.setAttribute("stroke-linecap", "round");
      path.setAttribute("stroke-linejoin", "round");
      path.setAttribute("opacity", String(0.72 + rnd() * 0.25));
      svg.appendChild(path);
    }
  }

  /* Отладка: house.html?craft=N (N = 2…5) — сразу крафт после вопроса N (предыдущие этапы дома уже стоят).
     house.html?exit=1 — сразу вопрос «Двигаемся дальше?»; house.html?craft=boat — сразу крафт лодки.
     house.html?stage=0…5 — сразу показать этапы дома без крафта.
     house.html?book=1 — этапы до книги уже стоят (сейчас окна после вопроса 4), сразу книга, затем вопрос с book:true (сейчас 5).
     house.html?q=N — сразу вопрос N (1-based), пролог пропускается, предыдущие этапы дома уже стоят. */
  const STAGE_DEBUG = +((location.search.match(/[?&]stage=(\d)/) || [])[1] || -1);
  const CRAFT_DEBUG = +((location.search.match(/[?&]craft=(\d)/) || [])[1] || 0);
  const Q_DEBUG = +((location.search.match(/[?&]q=(\d+)/) || [])[1] || 0);
  const EXIT_DEBUG = EXIT && (/[?&]exit=1/.test(location.search) ? "q" : /[?&]craft=boat/.test(location.search) ? "craft" : "");
  if (EXIT_DEBUG) {
    question = QUESTIONS.length; step = shown = N; done = true;
    vikaImg.src = "chars/vika_flowers.png"; window.__mcFlowers = true;
    STAGES.forEach((st) => applyStage(st, true));
    together = 1; layout(); heartEl.classList.add("on"); startFireflies();
    if (EXIT_DEBUG === "q") setTimeout(startExit, 500);
    else { exitMode = true; busy = true; setTimeout(exitCorrect, 500); }
  } else if (Q_DEBUG >= 1) {
    const n = Math.min(Q_DEBUG, QUESTIONS.length);
    question = n - 1; step = shown = question;
    if (question >= 1) { vikaImg.src = "chars/vika_flowers.png"; window.__mcFlowers = true; }
    STAGES.filter((st) => st.after <= question).forEach((st) => applyStage(st, true));
    if (QUESTIONS[question] && QUESTIONS[question].craft) shown = N; /* уже у дома, не загораживая его */
    layout();
    if (QUESTIONS[question] && QUESTIONS[question].book) {
      busy = true;
      setTimeout(async () => { await showDiaryBook(); busy = false; render(); }, 80);
    } else {
      setTimeout(render, 80);
    }
  } else if (STAGE_DEBUG >= 0) {
    vikaImg.src = "chars/vika_flowers.png"; window.__mcFlowers = true;
    const n = STAGE_DEBUG;
    question = Math.min(n, QUESTIONS.length); step = shown = Math.min(n, N);
    STAGES.filter((st) => st.after <= n).forEach((st) => applyStage(st, true));
    if (n >= QUESTIONS.length) { together = 1; done = true; heartEl.classList.add("on"); startFireflies(); }
    layout();
  } else if (/[?&]book=1/.test(location.search)) {
    const bi = QUESTIONS.findIndex((qq) => qq && qq.book);
    const qi = bi >= 0 ? bi : Math.max(0, QUESTIONS.length - 1);
    vikaImg.src = "chars/vika_flowers.png"; window.__mcFlowers = true;
    question = qi; step = shown = qi;
    STAGES.filter((st) => st.after <= qi).forEach((st) => applyStage(st, true));
    layout(); busy = true;
    setTimeout(async () => { await showDiaryBook(); busy = false; render(); }, 400);
  } else if (CRAFT_DEBUG >= 2 && stageAfter(CRAFT_DEBUG)) {
    question = CRAFT_DEBUG - 1; step = shown = CRAFT_DEBUG;
    vikaImg.src = "chars/vika_flowers.png"; window.__mcFlowers = true;
    STAGES.filter((st) => st.after < CRAFT_DEBUG).forEach((st) => applyStage(st, true));
    layout(); busy = true;
    setTimeout(async () => {
      await craftEvent(CRAFT_DEBUG);
      question = CRAFT_DEBUG;
      if (question >= QUESTIONS.length) { finish(); return; }
      busy = false; render();
    }, 500);
  } else {
    setTimeout(showPrologue, 500);
  }
})();
</script>
</body>
</html>
