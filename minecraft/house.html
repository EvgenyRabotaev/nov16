function hash(x, y, seed = 0) {
  let n = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(seed | 0, 1274126177);
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}

function tex16(paint, opts = {}) {
  const c = document.createElement("canvas");
  c.width = c.height = 16;
  const ctx = c.getContext("2d");
  const img = ctx.createImageData(16, 16);
  const set = (x, y, r, g, b, a = 255) => {
    if (x < 0 || y < 0 || x > 15 || y > 15) return;
    const i = (y * 16 + x) * 4;
    img.data[i] = Math.max(0, Math.min(255, r | 0));
    img.data[i + 1] = Math.max(0, Math.min(255, g | 0));
    img.data[i + 2] = Math.max(0, Math.min(255, b | 0));
    img.data[i + 3] = Math.max(0, Math.min(255, a | 0));
  };
  paint(set);
  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter;
  t.minFilter = THREE.NearestFilter;
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = opts.repeat ? THREE.RepeatWrapping : THREE.ClampToEdgeWrapping;
  if (opts.repeat) t.repeat.set(opts.repeat[0], opts.repeat[1]);
  t.needsUpdate = true;
  return t;
}

function noisePix(x, y, seed, amp) {
  return (hash(x, y, seed) - 0.5) * amp;
}

const textures = {
  grassTop: tex16((set) => {
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const n = hash(x, y, 11);
      const n2 = hash(x, y, 29);
      let r = 70 + n * 36, g = 130 + n * 50, b = 42 + n * 22;
      if (n2 > 0.86) { r = 110; g = 160; b = 50; }
      if (n2 < 0.08) { r = 48; g = 98; b = 32; }
      set(x, y, r, g, b);
    }
  }, { repeat: [24, 24] }),
  grassSide: tex16((set) => {
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      if (y < 3) {
        const n = hash(x, y, 11);
        set(x, y, 70 + n * 36, 130 + n * 50, 42 + n * 22);
      } else if (y === 3) {
        set(x, y, 90 + hash(x, y, 4) * 20, 100 + hash(x, y, 5) * 16, 40);
      } else {
        const n = hash(x, y, 3);
        set(x, y, 110 + n * 40, 78 + n * 24, 42 + n * 14);
      }
    }
  }),
  dirt: tex16((set) => {
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const n = hash(x, y, 3);
      set(x, y, 110 + n * 40, 78 + n * 24, 42 + n * 14);
    }
  }),
  cobble: tex16((set) => {
    const cells = [];
    for (let i = 0; i < 14; i++) {
      cells.push({
        x: hash(i, 1, 17) * 16,
        y: hash(i, 2, 17) * 16,
        c: 96 + hash(i, 3, 17) * 70,
      });
    }
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      let d1 = 99, d2 = 99, c = 120;
      for (const cell of cells) {
        const d = Math.abs(cell.x - x) + Math.abs(cell.y - y);
        if (d < d1) { d2 = d1; d1 = d; c = cell.c; }
        else if (d < d2) d2 = d;
      }
      const edge = d2 - d1 < 1.15;
      let g = c + noisePix(x, y, 9, 14);
      if (edge) g *= 0.52;
      set(x, y, g, g, g * 0.96);
    }
  }),
  planks: tex16((set) => {
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const board = Math.floor(y / 4);
      const grout = y % 4 === 0;
      const n = hash(x, y, 40 + board);
      let r = 188 + n * 22, g = 142 + n * 16, b = 80 + n * 10;
      if ((x + board * 3) % 16 === 5) { r *= 0.88; g *= 0.88; b *= 0.88; }
      if (grout) { r *= 0.62; g *= 0.6; b *= 0.55; }
      if (hash(x, y, 77) > 0.97) { r *= 0.7; g *= 0.65; }
      set(x, y, r, g, b);
    }
  }),
  logSide: tex16((set) => {
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const stripe = Math.sin((x + hash(x, 0, 2) * 2) * 0.9);
      const n = hash(x, y, 21);
      let r = 96 + stripe * 16 + n * 20;
      let g = 64 + stripe * 10 + n * 14;
      let b = 36 + n * 10;
      if (x === 0 || x === 15 || x === 7) { r *= 0.7; g *= 0.7; b *= 0.7; }
      set(x, y, r, g, b);
    }
  }),
  logTop: tex16((set) => {
    const cx = 7.5, cy = 7.5;
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const d = Math.hypot(x - cx, y - cy);
      const ring = Math.sin(d * 2.2) * 0.5 + 0.5;
      const n = hash(x, y, 31);
      let r = 186 - ring * 40 + n * 16;
      let g = 150 - ring * 30 + n * 12;
      let b = 96 - ring * 20 + n * 8;
      if (d > 7.2) { r = 90; g = 60; b = 34; }
      set(x, y, r, g, b);
    }
  }),
  roof: tex16((set) => {
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const row = Math.floor(y / 4);
      const shift = (row % 2) * 4;
      const groutY = y % 4 === 0;
      const groutX = (x + shift) % 8 === 0;
      const n = hash(x, y, 55 + row);
      let r = 118 + n * 24, g = 58 + n * 14, b = 36 + n * 10;
      if (groutY || groutX) { r *= 0.55; g *= 0.5; b *= 0.5; }
      set(x, y, r, g, b);
    }
  }),
  glass: tex16((set) => {
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const edge = x === 0 || y === 0 || x === 15 || y === 15;
      const pane = (x + y) % 5 === 0;
      if (edge) set(x, y, 190, 220, 230, 220);
      else set(x, y, 150 + pane * 30, 200, 220, 90);
    }
  }),
  glassGlow: tex16((set) => {
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const edge = x === 0 || y === 0 || x === 15 || y === 15;
      const d = Math.hypot(x - 7.5, y - 7.5) / 11;
      if (edge) set(x, y, 255, 210, 120, 255);
      else set(x, y, 255, 210 - d * 40, 100, 230);
    }
  }),
  leaves: tex16((set) => {
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const n = hash(x, y, 61);
      if (n < 0.18) { set(x, y, 0, 0, 0, 0); continue; }
      let r = 42 + n * 30, g = 110 + n * 60, b = 36 + n * 20;
      if (n > 0.85) { r = 80; g = 160; b = 50; }
      set(x, y, r, g, b, 255);
    }
  }),
  leaves2: tex16((set) => {
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const n = hash(x, y, 91);
      if (n < 0.16) { set(x, y, 0, 0, 0, 0); continue; }
      set(x, y, 36 + n * 24, 100 + n * 50, 40 + n * 18, 255);
    }
  }),
  doorLower: tex16((set) => {
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const grout = x === 0 || x === 15 || y === 15 || y === 0 || x === 8;
      const n = hash(x, y, 12);
      let r = 96 + n * 16, g = 58 + n * 10, b = 28 + n * 8;
      if (grout) { r *= 0.55; g *= 0.55; b *= 0.55; }
      set(x, y, r, g, b);
    }

    set(13, 8, 200, 170, 70);
    set(12, 9, 40, 30, 16);
    set(13, 9, 180, 150, 60);

  doorUpper: tex16((set) => {
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const grout = x === 0 || x === 15 || y === 0 || y === 15 || x === 8;
      const n = hash(x, y, 13);
      let r = 96 + n * 16, g = 58 + n * 10, b = 28 + n * 8;
      if (grout) { r *= 0.55; g *= 0.55; b *= 0.55; }
      const win = x >= 4 && x <= 6 && y >= 4 && y <= 8;
      const win2 = x >= 9 && x <= 11 && y >= 4 && y <= 8;
      if (win || win2) set(x, y, 160, 210, 230, 200);
      else set(x, y, r, g, b);
    }
  }),
  lantern: tex16((set) => {
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const frame = x < 2 || x > 13 || y < 2 || y > 13 || x === 8 || y === 8;
      if (frame) set(x, y, 32, 26, 20);
      else set(x, y, 255, 200, 90);
    }
  }),
};

function matLambert(map, opts = {}) {
  const m = new THREE.MeshLambertMaterial({
    map,
    flatShading: true,
    color: opts.color ?? 0xffffff,
    transparent: !!opts.transparent,
    opacity: opts.opacity ?? 1,
    alphaTest: opts.alphaTest ?? 0,
    depthWrite: opts.depthWrite ?? true,
    emissive: opts.emissive ?? 0x000000,
    emissiveIntensity: opts.emissiveIntensity ?? 0,
    side: opts.side ?? THREE.FrontSide,
  });
  if (opts.emissiveMap) m.emissiveMap = opts.emissiveMap;
  return m;
}

function matBasic(color, opts = {}) {
  return new THREE.MeshBasicMaterial({
    color,
    transparent: !!opts.transparent,
    opacity: opts.opacity ?? 1,
    depthWrite: opts.depthWrite ?? true,
    side: opts.side ?? THREE.FrontSide,
    fog: opts.fog ?? true,
  });
}

function ensureAudio() {
  if (audioCtx) {
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  audioCtx = new AC();
  return audioCtx;
}

function tuk(kind) {
  const ctx = audioCtx;
  if (!ctx) return;
  const now = ctx.currentTime;
  if (now - lastTuk < 0.036) return;
  lastTuk = now;
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  const freq = kind === "stone" ? 170 : kind === "glass" ? 540 : kind === "soft" ? 320 : 230;
  o.type = kind === "glass" ? "sine" : "triangle";
  o.frequency.setValueAtTime(freq, now);
  o.frequency.exponentialRampToValueAtTime(Math.max(60, freq * 0.45), now + 0.07);
  g.gain.setValueAtTime(kind === "soft" ? 0.04 : 0.07, now);
  g.gain.exponentialRampToValueAtTime(0.0008, now + 0.09);
  o.connect(g);
  g.connect(ctx.destination);
  o.start(now);
  o.stop(now + 0.1);
}

function soundOf(matName) {
  if (matName === "cobble" || matName === "dirt") return "stone";
  if (matName === "glass" || matName === "glassGlow") return "glass";
  if (matName === "cat" || matName === "flower" || matName === "lantern") return "soft";
  return "wood";
}

function lerpPal(a, b, t, out) {
  out.zenith.lerpColors(a.zenith, b.zenith, t);
  out.horizon.lerpColors(a.horizon, b.horizon, t);
  out.nadir.lerpColors(a.nadir, b.nadir, t);
  out.sunColor.lerpColors(a.sunColor, b.sunColor, t);
  out.sunDir.copy(a.sunDir).lerp(b.sunDir, t).normalize();
  out.sunGlow = a.sunGlow + (b.sunGlow - a.sunGlow) * t;
  out.stars = a.stars + (b.stars - a.stars) * t;
  out.hemiSky.lerpColors(a.hemiSky, b.hemiSky, t);
  out.hemiGround.lerpColors(a.hemiGround, b.hemiGround, t);
  out.hemiInt = a.hemiInt + (b.hemiInt - a.hemiInt) * t;
  out.sunInt = a.sunInt + (b.sunInt - a.sunInt) * t;
  out.sunLight.lerpColors(a.sunLight, b.sunLight, t);
  out.fog.lerpColors(a.fog, b.fog, t);
  out.fogNear = a.fogNear + (b.fogNear - a.fogNear) * t;
  out.fogFar = a.fogFar + (b.fogFar - a.fogFar) * t;
  out.cloud.lerpColors(a.cloud, b.cloud, t);
  out.ambInt = a.ambInt + (b.ambInt - a.ambInt) * t;
  out.amb.lerpColors(a.amb, b.amb, t);
  out.moonInt = a.moonInt + (b.moonInt - a.moonInt) * t;
  return out;
}

const _cA = new THREE.Color();
const _cB = new THREE.Color();
function updateSkyColors(p) {
  const pos = sky.geometry.attributes.position;
  const col = sky.geometry.attributes.color;
  const radius = 200;
  for (let i = 0; i < pos.count; i++) {
    const h = pos.getY(i) / radius;
    if (h >= 0) {
      /* Reach zenith colour quickly so the visible band isn't all horizon haze */
      const t = 1 - Math.min(1, Math.pow(Math.max(0, h) / 0.32, 0.85));
      _cA.copy(p.zenith).lerp(p.horizon, t);
    } else {
      const t = Math.max(0, Math.min(1, -h * 1.35));
      _cA.copy(p.horizon).lerp(p.nadir, t);
    }
    /* soft sun halo in the vertex sky */
    const vx = pos.getX(i) / radius, vy = pos.getY(i) / radius, vz = pos.getZ(i) / radius;
    const sunDot = vx * p.sunDir.x + vy * p.sunDir.y + vz * p.sunDir.z;
    const glow = Math.pow(Math.max(0, sunDot), 16) * 0.85 * p.sunGlow
               + Math.pow(Math.max(0, sunDot), 4) * 0.18 * p.sunGlow;
    _cA.r = Math.min(1, _cA.r + p.sunColor.r * glow);
    _cA.g = Math.min(1, _cA.g + p.sunColor.g * glow);
    _cA.b = Math.min(1, _cA.b + p.sunColor.b * glow);
    col.setXYZ(i, _cA.r, _cA.g, _cA.b);
  }
  col.needsUpdate = true;
}

function viewDir(azDeg, elDeg) {
  const forward = camLookHome.clone().sub(camHome);
  forward.y = 0;
  if (forward.lengthSq() < 1e-6) forward.set(0, 0, -1);
  else forward.normalize();
  const up = new THREE.Vector3(0, 1, 0);
  const right = new THREE.Vector3().crossVectors(forward, up).normalize();
  const az = azDeg * Math.PI / 180;
  const el = elDeg * Math.PI / 180;
  const ce = Math.cos(el), se = Math.sin(el), ca = Math.cos(az), sa = Math.sin(az);
  return new THREE.Vector3().copy(forward).multiplyScalar(ce * ca)
    .addScaledVector(right, ce * sa)
    .addScaledVector(up, se)
    .normalize();
}

function addTree(tx, tz, height, leafMat, seed = 1) {
  const g = new THREE.Group();
  for (let y = 0; y < height; y++) {
    const trunk = new THREE.Mesh(boxGeo, mats.log);
    trunk.position.set(tx, y + 0.5, tz);
    trunk.castShadow = true;
    trunk.receiveShadow = true;
    g.add(trunk);
  }
  const layers = [
    { y: height - 2, r: 2, corners: false },
    { y: height - 1, r: 2, corners: true },
    { y: height, r: 1, corners: true },
    { y: height + 1, r: 1, corners: false },
  ];
  for (const layer of layers) {
    for (let x = -layer.r; x <= layer.r; x++) {
      for (let z = -layer.r; z <= layer.r; z++) {
        const isCorner = Math.abs(x) === layer.r && Math.abs(z) === layer.r;
        if (!layer.corners && isCorner) continue;
        if (isCorner && layer.corners && hash(x + 20, layer.y + z, seed) > 0.7) continue;
        const leaf = new THREE.Mesh(boxGeo, leafMat);
        leaf.position.set(tx + x, layer.y + 0.5, tz + z);
        leaf.castShadow = true;
        leaf.receiveShadow = true;
        g.add(leaf);
      }
    }
  }
  scene.add(g);
  return g;
}

  if (name === "doorUpper") return mats.doorUpper;
  if (name === "lantern") return mats.lantern;
  return mats[name] || mats.planks;
}

function spawnBlockMesh(spec) {
  const mesh = new THREE.Mesh(boxGeo, materialOf(spec.matName));
  mesh.position.set(spec.x, spec.y + 0.5, spec.z);
  mesh.castShadow = spec.matName !== "glass";
  mesh.receiveShadow = true;
  mesh.visible = false;
  mesh.userData.spec = spec;
  scene.add(mesh);
  if (spec.matName === "glass") glassMeshes.push(mesh);
  return mesh;
}

for (let s = 0; s < 4; s++) {
  const list = [];
  /* sort for a pleasing cascade */
  const blocks = stageBlocks[s].slice();
  if (s === 0) {
    blocks.sort((a, b) => a.y - b.y || a.z - b.z || a.x - b.x);
  } else if (s === 1) {
    blocks.sort((a, b) => a.y - b.y || a.z - b.z || a.x - b.x);
  } else if (s === 2) {
    blocks.sort((a, b) => a.z - b.z || a.x - b.x || a.y - b.y);
  } else {
    const rank = (b) => {
      if (b.matName === "doorLower" || b.matName === "doorUpper") return 0;
      if (b.matName === "roof") return 1 + b.y + b.z * 0.01;
      if (b.matName === "planks") return 40 + b.y;
      return 60 + b.y;
    };
    blocks.sort((a, b) => rank(a) - rank(b) || a.z - b.z || a.x - b.x);
  }
  for (const spec of blocks) {
    const mesh = spawnBlockMesh(spec);
    list.push(mesh);
  }
  builtMeshes[s] = list;
}

/* ---- animation ---- */
function easeInCubic(t) { return t * t * t; }
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

function startDrop(meshes, durationMs) {
  dropAnims.length = 0;
  const n = meshes.length;
  const dropDur = 0.48;
  const span = Math.max(0.2, durationMs / 1000 - dropDur - 0.08);
  const stagger = n <= 1 ? 0 : span / (n - 1);
  const start = performance.now() / 1000;
  for (let i = 0; i < n; i++) {
    const mesh = meshes[i];
    const endY = mesh.userData.endY != null ? mesh.userData.endY : (mesh.userData.spec ? mesh.userData.spec.y + 0.5 : mesh.position.y);
    const startY = endY + 9 + (i % 5) * 0.35;
    mesh.visible = true;
    mesh.position.y = startY;
    mesh.scale.set(1, 1, 1);
    mesh.userData.landed = false;
    dropAnims.push({
      mesh,
      startY,
      endY,
      t0: start + i * stagger,
      dur: dropDur,
      kind: soundOf(mesh.userData.matName || (mesh.userData.spec && mesh.userData.spec.matName) || "wood"),
    });
  }
}

function updateDrops(now) {
  let allDone = dropAnims.length === 0;
  let pending = 0;
  for (const a of dropAnims) {
    const t = (now - a.t0) / a.dur;
    if (t < 0) { a.mesh.position.y = a.startY; pending++; continue; }
    if (t >= 1) {
      a.mesh.position.y = a.endY;
      a.mesh.scale.set(1, 1, 1);
      if (!a.mesh.userData.landed) {
        a.mesh.userData.landed = true;
        tuk(a.kind);
      }
      continue;
    }
    pending++;
    const hitAt = 0.68;
    if (t < hitAt) {
      const u = easeInCubic(t / hitAt);
      a.mesh.position.y = a.startY + (a.endY - a.startY) * u;
      a.mesh.scale.set(1, 1, 1);
    } else {
      if (!a.mesh.userData.landed) {
        a.mesh.userData.landed = true;
        tuk(a.kind);
      }
      const b = (t - hitAt) / (1 - hitAt);
      const bounce = Math.sin(b * Math.PI) * 0.22 * (1 - b);
      a.mesh.position.y = a.endY + bounce;
      const squash = Math.sin(Math.min(1, b * 1.4) * Math.PI);
      a.mesh.scale.set(1 + 0.12 * squash, 1 - 0.16 * squash, 1 + 0.12 * squash);
    }
  }
  allDone = pending === 0 && dropAnims.length > 0;
  return dropAnims.length === 0 ? true : (now > dropAnims[dropAnims.length - 1].t0 + dropAnims[dropAnims.length - 1].dur + 0.05);
}

function updateSmoke(now) {
  if (!smokeGroup.visible) return;
  const origin = tmpV.set(3, 10.7, -1);
  for (const m of smokes) {
    let t = (m.userData.t + now * 0.12) % 1;
    const y = origin.y + t * 3.6;
    const wob = Math.sin((t + m.userData.t) * 7) * 0.4;
    const wobz = Math.cos((t + m.userData.t) * 5.5) * 0.3;
    m.position.set(origin.x + wob, y, origin.z + wobz);
    const s = 0.45 + t * 1.15;
    m.scale.set(s, s * 0.85, s);
    m.material.opacity = 0.5 * (1 - t) * Math.max(0.4, windowGlow);
  }
}

function updatePeople(dt, now) {
  const idle = Math.sin(now * 2.1) * 0.015;
  if (pairWalk <= 0) {
    guy.position.y = idle;
    girl.position.y = Math.sin(now * 2.1 + 0.8) * 0.015;
  }
  const arm = Math.sin(now * 1.6) * 0.06;
  const gArmL = guy.getObjectByName("leftArm");
  const gArmR = guy.getObjectByName("rightArm");
  const kArmL = girl.getObjectByName("leftArm");
  const kArmR = girl.getObjectByName("rightArm");
  if (pairWalk <= 0) {
    if (gArmL) gArmL.rotation.x = arm;
    if (gArmR) gArmR.rotation.x = -arm;
    if (kArmL) kArmL.rotation.x = -arm;
    if (kArmR) kArmR.rotation.x = arm;
  }
  if (pairWalk > 0 && pairWalk < 1) {
    const t = easeInOutCubic(pairWalk);
    guy.position.lerpVectors(guyStart, guyEnd, t);
    girl.position.lerpVectors(girlStart, girlEnd, t);
    guy.position.y = 0;
    girl.position.y = 0;
    const swing = Math.sin(pairWalk * 18) * 0.35;
    if (gArmL) gArmL.rotation.x = swing;
    if (gArmR) gArmR.rotation.x = -swing;
    if (kArmL) kArmL.rotation.x = -swing;
    if (kArmR) kArmR.rotation.x = swing;
    const gLegL = guy.getObjectByName("leftLeg");
    const gLegR = guy.getObjectByName("rightLeg");
    const kLegL = girl.getObjectByName("leftLeg");
    const kLegR = girl.getObjectByName("rightLeg");
    if (gLegL) gLegL.rotation.x = -swing * 0.8;
    if (gLegR) gLegR.rotation.x = swing * 0.8;
    if (kLegL) kLegL.rotation.x = swing * 0.8;
    if (kLegR) kLegR.rotation.x = -swing * 0.8;
    faceTowards(guy, girlEnd, 0);
    faceTowards(girl, guyEnd, 0);
  }
  if (pairWalk >= 1) {
    guy.position.copy(guyEnd);
    girl.position.copy(girlEnd);
    faceTowards(guy, girl.position, 0.4);
    faceTowards(girl, guy.position, -0.4);
    if (gArmL) gArmL.rotation.x = 0.1;
    if (gArmR) gArmR.rotation.x = 0.1;
    if (kArmL) kArmL.rotation.x = 0.1;
    if (kArmR) kArmR.rotation.x = 0.1;
  }
}

function updateHeart(now) {
  if (heartT < 0) return;
  const t = Math.min(1, (now * 1000 - heartT) / 700);
  const s = easeOutCubic(t) * (1 + Math.sin(now * 2.4) * 0.06);
  heart.visible = true;
  heart.scale.setScalar(Math.max(0.001, s));
  const mid = tmpV.copy(guy.position).add(girl.position).multiplyScalar(0.5);
  mid.y = 2.35 + Math.sin(now * 2.2) * 0.08;
  mid.x += 0.05;
  mid.z -= 0.05;
  heart.position.copy(mid);
  heart.lookAt(camera.position);
}

function updateCamera() {
  camera.position.lerpVectors(camHome, camEnd, easeInOutCubic(camBlend));
  camLook.lerpVectors(camLookHome, camLookEnd, easeInOutCubic(camBlend));
  camera.lookAt(camLook);
}

let stageEndAt = 0;
let walking = false;

function beginStage(next) {
  animating = true;
  answerBtn.disabled = true;
  ensureAudio();
  const meshes = builtMeshes[next - 1];
  startDrop(meshes, STAGE_MS);
  todFrom = todTo;
  todTo = next;
  todLerp = 0;
  if (next === 5) {
    windowGlowTarget = 1;
    walking = true;
    pairWalk = 0.0001;
  }
  stageEndAt = performance.now() + STAGE_MS;
}

function onStageSettled(next) {
  stage = next;
  if (next === 5) {
    finished = true;
    smokeGroup.visible = true;
    if (heartT < 0) heartT = performance.now();
    panel.classList.add("hidden");
    finale.classList.add("show");
    finale.setAttribute("aria-hidden", "false");
    animating = false;
    window.__HOUSE_DONE = true;
    window.__HOUSE_STAGE = 5;
    if (window.QuestHUD) { QuestHUD.award("mc-q5"); QuestHUD.setStep("done"); QuestHUD.showNext("Дальше"); }
    return;
  }
  if (window.QuestHUD) { QuestHUD.award("mc-q" + next); QuestHUD.setStep("q" + (next + 1)); }
  question = next + 1;
  qNum.textContent = "Вопрос " + question + " из 5";
  animating = false;
  answerBtn.disabled = false;
  window.__HOUSE_STAGE = stage;
}

function animateAnswer() {
  if (animating || finished) return;
  if (stage >= 5) return;
  beginStage(stage + 1);
}

answerBtn.addEventListener("click", () => {
  ensureAudio();
  animateAnswer();
});

function revealInstant(upTo) {
  for (let s = 0; s < upTo; s++) {
    for (const mesh of builtMeshes[s]) {
      const endY = mesh.userData.endY != null ? mesh.userData.endY : (mesh.userData.spec ? mesh.userData.spec.y + 0.5 : mesh.position.y);
      mesh.visible = true;
      mesh.position.y = endY;
      mesh.scale.set(1, 1, 1);
      mesh.userData.landed = true;
    }
  }
  stage = upTo;
  tod = upTo;
  todFrom = upTo;
  todTo = upTo;
  todLerp = 1;
  if (upTo >= 5) {
    windowGlow = 1;
    windowGlowTarget = 1;
    pairWalk = 1;
    smokeGroup.visible = true;
    heartT = performance.now();
    finished = true;
    panel.classList.add("hidden");
    finale.classList.add("show");
    if (window.QuestHUD) { QuestHUD.setStep("done"); QuestHUD.showNext("Дальше"); }
  } else if (upTo > 0) {
    if (window.QuestHUD) QuestHUD.setStep("q" + (upTo + 1));
    question = upTo + 1;
    qNum.textContent = "Вопрос " + question + " из 5";
  }
}

/* ---- resize / loop ---- */
function resize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener("resize", resize);
resize();

let ready = false;
function tick() {
  const dt = Math.min(0.2, clock.getDelta());
  const now = clock.elapsedTime;
  const wall = performance.now();

  if (todLerp < 1) {
    todLerp = Math.min(1, todLerp + dt / (STAGE_MS / 1000));
    tod = todFrom + (todTo - todFrom) * easeInOutCubic(todLerp);
  } else {
    tod = todTo;
  }
  windowGlow += (windowGlowTarget - windowGlow) * Math.min(1, dt * 1.8);

  if (animating) {
    updateDrops(wall / 1000);
    if (wall >= stageEndAt) {
      const next = stage + 1;
      onStageSettled(next);
    }
  }

  if (walking && pairWalk > 0 && pairWalk < 1) {
    pairWalk = Math.min(1, pairWalk + dt / 1.6);
    camBlend = Math.min(1, camBlend + dt / 2.2);
  }

  applyPalette(paletteAt(tod), now);
  updateSmoke(now);
  updatePeople(dt, now);
  updateHeart(now);
  updateCamera();

  sky.position.copy(camera.position);
  stars.position.copy(camera.position);

  for (const c of clouds) {
    c.position.x = c.userData.baseX + Math.sin(now * c.userData.speed * 0.15) * 6;
  }

  renderer.render(scene, camera);
  if (!ready) {
    ready = true;
    window.__HOUSE_READY = true;
  }
  requestAnimationFrame(tick);
}

applyPalette(paletteAt(0), 0);
if (window.QuestHUD) QuestHUD.setStep("q1");
if (START_STAGE > 0) revealInstant(START_STAGE);
window.__HOUSE_STAGE = stage;
window.__HOUSE_READY = false;


window.__dbg = () => {
  const project = (obj) => {
    const v = obj.getWorldPosition(new THREE.Vector3());
    const w = v.clone();
    v.project(camera);
    return {
      sx: +( (v.x * 0.5 + 0.5) * window.innerWidth ).toFixed(1),
      sy: +( (-v.y * 0.5 + 0.5) * window.innerHeight ).toFixed(1),
      ndcZ: +v.z.toFixed(3),
      wx: +w.x.toFixed(2), wy: +w.y.toFixed(2), wz: +w.z.toFixed(2),
      vis: obj.visible, kids: obj.children.length
    };
  };
  return {
    sun: project(sunMesh),
    moon: project(moonMesh),
    clouds: clouds.map(project),
    cam: [+camera.position.x.toFixed(2), +camera.position.y.toFixed(2), +camera.position.z.toFixed(2)],
    sunVisibleFlag: sunMesh.visible,
    tod
  };
};

function boot() {
  requestAnimationFrame(tick);
  if (AUTO && START_STAGE < 5) {
    let clicks = 0;
    const tickAuto = () => {
      if (finished || clicks >= 5) return;
      if (!animating) {
        animateAnswer();
        clicks += 1;
      }
      if (clicks < 5) setTimeout(tickAuto, AUTO_EVERY_MS);
    };
    setTimeout(tickAuto, AUTO_FIRST_MS);
  }
}

if (document.readyState === "complete") boot();
else window.addEventListener("load", boot);
  </script>
