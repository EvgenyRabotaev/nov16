<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сегодня наш день</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #1a1428;
    color: #fff;
    font-family: Manrope, system-ui, sans-serif;
  }

  .bg {
    position: fixed;
    inset: 0;
    background: #1a1428 url("code/bg.jpg") center / cover no-repeat;
  }
  @media (orientation: portrait) {
    .bg { background-image: url("code/bg_portrait.jpg"); }
  }
  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 42%, rgba(28,18,42,.18) 0%, rgba(20,14,34,.42) 62%, rgba(12,8,24,.58) 100%);
  }

  .stage {
    position: relative;
    z-index: 1;
    min-height: 100%;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
  }

  .panel {
    text-align: center;
    max-width: 640px;
    width: min(94vw, 640px);
    padding: 42px 36px 36px;
    background: rgba(18, 14, 36, 0.42);
    backdrop-filter: blur(14px) saturate(1.25);
    -webkit-backdrop-filter: blur(14px) saturate(1.25);
    border-radius: 28px;
    border: 1px solid rgba(255,255,255,0.16);
    box-shadow: 0 24px 64px rgba(0,0,0,.38);
    animation: rise .95s ease both;
    transition: box-shadow .6s ease, border-color .6s ease;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }
  .panel.ok {
    border-color: rgba(147, 210, 255, .55);
    box-shadow:
      0 0 0 1px rgba(147,210,255,.35),
      0 0 48px rgba(100,170,255,.42),
      0 24px 64px rgba(0,0,0,.38);
  }

  h1 {
    font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    font-weight: 600;
    font-style: italic;
    font-size: clamp(24px, 5.2vw, 40px);
    line-height: 1.28;
    margin: 0 0 28px;
    letter-spacing: .01em;
    text-shadow: 0 2px 22px rgba(0,0,0,.5);
    color: rgba(255,248,240,.97);
  }

  .codewrap {
    display: flex;
    justify-content: center;
  }
  .code {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: clamp(6px, 1.8vw, 14px);
  }
  .code.shake {
    animation: shake .48s ease;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    18% { transform: translateX(-10px); }
    36% { transform: translateX(10px); }
    54% { transform: translateX(-6px); }
    72% { transform: translateX(6px); }
  }

  .group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .boxes {
    display: flex;
    gap: clamp(6px, 1.4vw, 10px);
  }
  .lbl {
    font-family: Manrope, system-ui, sans-serif;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: .16em;
    color: rgba(230, 220, 255, .72);
    user-select: none;
  }
  .dot {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: clamp(28px, 6vw, 42px);
    line-height: 1;
    padding-top: clamp(10px, 2.2vw, 16px);
    color: rgba(255,255,255,.72);
    text-shadow: 0 0 12px rgba(160,190,255,.45);
    user-select: none;
  }

  .digit {
    width: clamp(42px, 11.5vw, 64px);
    height: clamp(54px, 14.5vw, 76px);
    border-radius: 14px;
    border: 1.5px solid rgba(255,255,255,.38);
    background: rgba(255,255,255,.10);
    color: #fff;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 600;
    font-size: clamp(26px, 7vw, 38px);
    text-align: center;
    caret-color: #9fd0ff;
    outline: none;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 6px 18px rgba(0,0,0,.18);
    transition: border-color .2s ease, box-shadow .2s ease, background .2s ease, transform .2s ease;
    padding: 0;
    appearance: none;
    -webkit-appearance: none;
  }
  .digit:focus {
    border-color: rgba(160, 214, 255, .95);
    background: rgba(255,255,255,.16);
    box-shadow:
      0 0 0 3px rgba(120, 180, 255, .28),
      0 0 18px rgba(120, 180, 255, .35),
      inset 0 1px 0 rgba(255,255,255,.2);
  }
  .digit.ok {
    border-color: rgba(160, 214, 255, .95);
    background: rgba(130, 190, 255, .22);
    box-shadow:
      0 0 0 2px rgba(147,210,255,.4),
      0 0 22px rgba(100,170,255,.55);
  }
  .digit::-webkit-outer-spin-button,
  .digit::-webkit-inner-spin-button { appearance: none; margin: 0; }

  .hint {
    margin: 22px 0 0;
    font-size: clamp(13px, 3.2vw, 15px);
    font-weight: 600;
    letter-spacing: .06em;
    color: rgba(235, 228, 255, .82);
    text-shadow: 0 1px 10px rgba(0,0,0,.35);
  }
  .hint b {
    font-weight: 700;
    color: #fff;
    letter-spacing: .12em;
  }

  .msg {
    position: relative;
    z-index: 3;
    min-height: 1.5em;
    margin: 16px 0 0;
    font-size: 16px;
    font-weight: 600;
    color: rgba(255, 220, 230, .95);
    opacity: 0;
    transition: opacity .25s ease;
    text-shadow: 0 1px 10px rgba(10,8,24,.55);
  }
  .msg.show { opacity: 1; }
  .msg.ok {
    color: #d6ecff;
    text-shadow: 0 0 16px rgba(120,180,255,.55);
  }

  #hearts {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 8;
    overflow: hidden;
  }
  .heart {
    position: absolute;
    top: 42%;
    animation: floatHeart 1.55s ease-out forwards;
    filter: drop-shadow(0 0 8px rgba(100,170,255,.6));
    line-height: 1;
  }
  @keyframes floatHeart {
    0%   { opacity: 0; transform: translateY(10px) scale(.7); }
    18%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(-42vh) scale(1.15); }
  }

  body.leaving .panel {
    opacity: 0;
    transform: scale(.98);
    transition: opacity .7s ease, transform .7s ease;
  }
  body.leaving .bg::after {
    background: rgba(10, 8, 22, .55);
    transition: background .7s ease;
  }

  @media (max-width: 420px) {
    .panel { padding: 32px 16px 28px; }
    .digit { border-radius: 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .panel, .code.shake, .heart { animation: none; }
    .panel { opacity: 1; }
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div id="hearts" aria-hidden="true"></div>
  <main class="stage">
    <div class="panel" id="panel">
      <h1>Введи дату нашего знакомства</h1>
      <div class="codewrap">
        <div class="code" id="code" role="group" aria-label="Дата знакомства, шесть цифр">
          <div class="group">
            <div class="boxes">
              <input class="digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="День, первая цифра" autofocus>
              <input class="digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="День, вторая цифра">
            </div>
            <span class="lbl">ДД</span>
          </div>
          <span class="dot" aria-hidden="true">·</span>
          <div class="group">
            <div class="boxes">
              <input class="digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Месяц, первая цифра">
              <input class="digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Месяц, вторая цифра">
            </div>
            <span class="lbl">ММ</span>
          </div>
          <span class="dot" aria-hidden="true">·</span>
          <div class="group">
            <div class="boxes">
              <input class="digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Год, первая цифра">
              <input class="digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Год, вторая цифра">
            </div>
            <span class="lbl">ГГ</span>
          </div>
        </div>
      </div>
      <p class="msg" id="msg" aria-live="polite"></p>
    </div>
  </main>
<script>
(function () {
  const CODE = '161125';
  const inputs = Array.from(document.querySelectorAll('.digit'));
  const row = document.getElementById('code');
  const panel = document.getElementById('panel');
  const msg = document.getElementById('msg');
  const hearts = document.getElementById('hearts');
  let locked = false;

  try {
    if (sessionStorage.getItem('nov16_ok') === '1') {
      location.replace('start/');
      return;
    }
  } catch (e) {}

  function value() {
    return inputs.map(function (el) { return el.value; }).join('');
  }

  function onlyDigits(s) {
    return String(s || '').replace(/\D/g, '');
  }

  function setDigits(str, start) {
    start = start || 0;
    const d = onlyDigits(str);
    let i = start;
    let k = 0;
    while (k < d.length && i < inputs.length) {
      inputs[i].value = d[k];
      i++; k++;
    }
    const next = Math.min(i, inputs.length - 1);
    if (i < inputs.length) inputs[i].focus();
    else inputs[next].focus();
    if (value().length === 6) check();
  }

  function showMsg(text, ok) {
    msg.textContent = text;
    msg.classList.toggle('ok', !!ok);
    msg.classList.add('show');
  }

  function clearMsg() {
    msg.classList.remove('show', 'ok');
  }

  function burstHearts() {
    for (let i = 0; i < 14; i++) {
      const s = document.createElement('span');
      s.className = 'heart';
      s.textContent = '💙';
      const side = i % 2 === 0;
      s.style.left = (side ? (4 + Math.random() * 22) : (74 + Math.random() * 22)) + 'vw';
      s.style.animationDelay = (Math.random() * 0.45) + 's';
      s.style.fontSize = (16 + Math.random() * 20) + 'px';
      hearts.appendChild(s);
    }
  }

  function success() {
    locked = true;
    inputs.forEach(function (el) {
      el.classList.add('ok');
      el.setAttribute('readonly', 'readonly');
      el.blur();
    });
    panel.classList.add('ok');
    showMsg('Верно 💙', true);
    burstHearts();
    try { sessionStorage.setItem('nov16_ok', '1'); } catch (e) {}
    setTimeout(function () { document.body.classList.add('leaving'); }, 900);
    setTimeout(function () { location.href = 'start/'; }, 1600);
  }

  function fail() {
    locked = true;
    row.classList.remove('shake');
    void row.offsetWidth;
    row.classList.add('shake');
    showMsg('Не то, попробуй ещё 💙', false);
    setTimeout(function () {
      inputs.forEach(function (el) { el.value = ''; });
      locked = false;
      inputs[0].focus();
    }, 520);
  }

  function check() {
    if (locked) return;
    const v = value();
    if (v.length < 6) return;
    if (v === CODE) success();
    else fail();
  }

  inputs.forEach(function (inp, i) {
    inp.addEventListener('beforeinput', function (e) {
      if (locked) { e.preventDefault(); return; }
      if (e.inputType && e.inputType.indexOf('delete') === 0) return;
      if (e.inputType === 'insertFromPaste') return;
      const data = e.data == null ? '' : e.data;
      // allow mixed strings like 16.11.25; the input handler keeps digits only
      if (data && !/\d/.test(data)) e.preventDefault();
    });

    inp.addEventListener('input', function () {
      if (locked) return;
      clearMsg();
      const raw = onlyDigits(inp.value);
      if (raw.length > 1) {
        inp.value = '';
        setDigits(raw, i);
        return;
      }
      inp.value = raw;
      if (raw && i < inputs.length - 1) inputs[i + 1].focus();
      if (value().length === 6) check();
    });

    inp.addEventListener('keydown', function (e) {
      if (locked) { e.preventDefault(); return; }
      if (e.key === 'Backspace') {
        if (inp.value) {
          inp.value = '';
          e.preventDefault();
          clearMsg();
        } else if (i > 0) {
          inputs[i - 1].value = '';
          inputs[i - 1].focus();
          e.preventDefault();
          clearMsg();
        }
      } else if (e.key === 'ArrowLeft' && i > 0) {
        inputs[i - 1].focus();
        e.preventDefault();
      } else if (e.key === 'ArrowRight' && i < inputs.length - 1) {
        inputs[i + 1].focus();
        e.preventDefault();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (value().length === 6) check();
      }
    });

    inp.addEventListener('paste', function (e) {
      e.preventDefault();
      if (locked) return;
      const t = (e.clipboardData || window.clipboardData).getData('text') || '';
      const d = onlyDigits(t);
      if (!d) return;
      if (d.length >= 6) setDigits(d, 0);
      else setDigits(d, i);
    });

    inp.addEventListener('focus', function () {
      try { inp.select(); } catch (e) {}
    });
  });

  document.addEventListener('paste', function (e) {
    if (locked) return;
    if (e.target && e.target.classList && e.target.classList.contains('digit')) return;
    const t = (e.clipboardData || window.clipboardData).getData('text') || '';
    const d = onlyDigits(t);
    if (d.length) {
      e.preventDefault();
      setDigits(d, 0);
    }
  });
})();
</script>
</body>
</html>
