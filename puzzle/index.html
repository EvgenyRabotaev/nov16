<body>
  <div class="pz-wrap" id="pzRoot">
    <header class="pz-head">
      <h1 class="pz-title" id="pzTitle">Пятнашки</h1>
      <p class="pz-sub" id="pzHint">Собери синее сердце</p>
      <div class="pz-bar">
        <div class="pz-count" id="pzMoves" aria-live="polite">Ходы: 0</div>
        <button class="pz-toggle" id="pzNums" type="button" aria-pressed="false" title="Показать номера плиток">Цифры</button>
      </div>
    </header>
    <div class="pz-stage">
      <div class="pz-frame" id="pzFrame">
        <div class="pz-glow" aria-hidden="true"></div>
        <div class="pz-board" id="pzBoard" role="application" aria-label="Пятнашки, поле 4 на 4">
          <div class="pz-well" id="pzWell" hidden></div>
        </div>
        <div class="pz-full" id="pzFull" aria-hidden="true"></div>
      </div>
    </div>
    <p class="pz-win" id="pzWin" aria-live="polite"></p>
    <button class="pz-skip" id="pzSkip" type="button">Пропустить</button>
  </div>
<script src="puzzle.js?v=20261116p64"></script>
<script>
  if (window.QuestHUD) { QuestHUD.setStep("play"); QuestHUD.hideNext && QuestHUD.hideNext(); }
  QuestPuzzle.start({ root: document.getElementById("pzRoot"), image: "heart.webp" });
</script>
