<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Полёт — PUBG</title>
  <style>
    @font-face {
      font-family: "Barlow Condensed";
      src: url("fonts/BarlowCondensed-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: "Barlow Condensed";
      src: url("fonts/BarlowCondensed-Medium.ttf") format("truetype");
      font-weight: 500;
      font-style: normal;
    }
    @font-face {
      font-family: "Barlow Condensed";
      src: url("fonts/BarlowCondensed-SemiBold.ttf") format("truetype");
      font-weight: 600;
      font-style: normal;
    }

    :root {
      --squad-yellow: #c9b20c;
      --squad-orange: #c45a1c;
      --hud-font: "Barlow Condensed", "IBM Plex Sans Condensed", "Segoe UI", "Noto Sans", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background-color: #ae9876;
      background-image:
        linear-gradient(rgba(84, 62, 32, 0.34) 1px, transparent 1px),
        linear-gradient(90deg, rgba(84, 62, 32, 0.34) 1px, transparent 1px),
        radial-gradient(ellipse at center, rgba(255, 245, 220, 0.10) 0%, rgba(60, 40, 15, 0.18) 100%);
      background-size: var(--grid, 46px) var(--grid, 46px), var(--grid, 46px) var(--grid, 46px), 100% 100%;
      background-position: var(--grid-x, 0px) var(--grid-y, 0px), var(--grid-x, 0px) var(--grid-y, 0px), 0 0;
      font-family: "Segoe UI", "Noto Sans", "DejaVu Sans", Roboto, system-ui, sans-serif;
      color: #f4efe4;
      user-select: none;
    }

    #map {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain; /* карта целиком, поля — клетка */
      object-position: center;
      pointer-events: none;
    }

    #plane {
      position: fixed;
      left: 0;
      top: 0;
      width: 220px;
      height: auto;
      pointer-events: none;
      z-index: 3;
      filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.45));
      will-change: transform;
      transform-origin: 50% 50%;
    }

    /* Парашюты (прыжок из самолёта) */
    .chute { position: fixed; left: 0; top: 0; z-index: 4; pointer-events: none; opacity: 0;
      transform-origin: 50% 100%; will-change: transform, opacity; filter: drop-shadow(0 4px 4px rgba(0,0,0,.4)); }
    .chute svg { display: block; width: 100%; height: auto; overflow: visible; }
    .land-dot { position: fixed; left: 0; top: 0; z-index: 4; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%;
      border: 2px solid rgba(16,12,8,.95); opacity: 0; transform: scale(.4); transition: opacity .4s ease, transform .4s ease; pointer-events: none; }
    .land-dot.on { opacity: 1; transform: scale(1); }
    .land-dot.vika { background: var(--squad-yellow); box-shadow: 0 0 12px rgba(201,178,12,.85); }
    .land-dot.zhenya { background: var(--squad-orange); box-shadow: 0 0 12px rgba(196,90,28,.85); }

    /* ----- Squad HUD ----- */
    .squad-hud {
      position: fixed;
      left: 22px;
      bottom: 26px;
      z-index: 20;
      display: grid;
      grid-template-columns: 34px 26px minmax(260px, 300px) 50px;
      grid-template-rows: auto auto;
      column-gap: 8px;
      row-gap: 10px;
      align-items: center;
      font-family: var(--hud-font);
    }

    .squad-fade {
      grid-column: 2 / 4;
      grid-row: 1 / 3;
      align-self: stretch;
      justify-self: stretch;
      background: linear-gradient(90deg,
        rgba(6, 7, 10, 0.82) 0%,
        rgba(6, 7, 10, 0.78) 58%,
        rgba(6, 7, 10, 0.00) 100%);
      pointer-events: none;
      z-index: 0;
      margin: -8px -12px -8px -10px;
    }

    .squad-plane,
    .squad-num,
    .squad-meta,
    .follow-btn {
      z-index: 1;
    }

    .squad-plane {
      width: 28px;
      height: 36px;
      color: #f5f5f3;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.9));
      justify-self: center;
    }
    .squad-plane svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .squad-num {
      width: 24px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 16px;
      line-height: 1;
      color: #fff;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.75);
      justify-self: center;
    }
    .squad-num-1 { background: var(--squad-yellow); }
    .squad-num-2 { background: var(--squad-orange); }

    .squad-meta { min-width: 0; padding: 2px 12px 3px 2px; }

    .squad-name {
      font-size: 20px;
      font-weight: 500;
      letter-spacing: 0.03em;
      color: #f3f3f1;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9), 0 0 4px rgba(0, 0, 0, 0.45);
      white-space: nowrap;
      line-height: 1.15;
    }

    .squad-bar {
      margin-top: 5px;
      height: 6px;
      width: 100%;
      background: #f2f0eb;
      border-radius: 1px;
      box-shadow: 0 1px 1px rgba(0, 0, 0, 0.55);
    }

    .vika-plane { grid-column: 1; grid-row: 1; }
    .vika-num   { grid-column: 2; grid-row: 1; }
    .vika-meta  { grid-column: 3; grid-row: 1; }
    .zhenya-plane { grid-column: 1; grid-row: 2; }
    .zhenya-num   { grid-column: 2; grid-row: 2; }
    .zhenya-meta  { grid-column: 3; grid-row: 2; }

    .follow-btn {
      grid-column: 4;
      grid-row: 2;
      width: 48px;
      height: 48px;
      align-self: center;
      justify-self: end;
      appearance: none;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      color: #f0f0ee;
      background: rgba(10, 11, 14, 0.78);
      border: 1.5px solid rgba(230, 230, 228, 0.38);
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }
    .follow-btn svg {
      width: 44px;
      height: 28px;
      display: block;
    }
    .follow-btn:hover:not(.lit) {
      border-color: rgba(255, 255, 255, 0.6);
      background: rgba(16, 16, 18, 0.88);
    }
    .follow-btn:focus-visible {
      outline: 2px solid var(--squad-orange);
      outline-offset: 2px;
    }
    .follow-btn.lit {
      color: var(--squad-orange);
      border-color: var(--squad-orange);
      background: rgba(36, 16, 8, 0.86);
      box-shadow: 0 0 12px rgba(196, 90, 28, 0.55), 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    /* Prompt only; flight resumes solely via the HUD parachute button. */
    .prompt {
      position: fixed;
      left: 50%;
      bottom: 30%;
      transform: translateX(-50%) translateY(10px);
      z-index: 18;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .prompt.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .prompt p {
      margin: 0;
      font-family: Georgia, "Times New Roman", "Noto Serif", serif;
      font-size: clamp(22px, 2.4vw, 34px);
      color: #fff8e8;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.85), 0 0 18px rgba(0, 0, 0, 0.4);
    }

    @media (max-width: 700px) {
      .squad-hud {
        left: 10px;
        bottom: 12px;
        grid-template-columns: 28px 22px minmax(200px, 1fr) 46px;
        column-gap: 6px;
        row-gap: 8px;
        max-width: calc(100vw - 16px);
      }
      .squad-name { font-size: 16px; }
      .follow-btn { width: 46px; height: 46px; }
      #plane { width: 150px; }
      .prompt { bottom: 38%; width: 90%; }
    }
  </style>
<link rel="stylesheet" href="../common/hud.css?v=20261116p66">

<body>
  <img id="map" data-hud-map src="../maps/island_fullscreen.jpg" alt="Карта острова">
  <img id="plane" src="../maps/plane.png" alt="">

  <div class="chute" id="chuteVika"><svg viewBox="0 0 60 78" aria-hidden="true">
        <path d="M4 26 C4 8 56 8 56 26 C50 22 44 22 40 26 C36 22 24 22 20 26 C16 22 10 22 4 26Z" fill="#e3c73a" stroke="#7a6a0c" stroke-width="1.6"/>
        <path d="M20 26 C22 14 26 10 30 9 M40 26 C38 14 34 10 30 9" fill="none" stroke="#7a6a0c" stroke-width="1.1" opacity=".55"/>
        <path d="M5 26 L27 58 M20 26 L28.5 58 M40 26 L31.5 58 M55 26 L33 58" stroke="rgba(252,248,236,.92)" stroke-width="1.3"/>
        <circle cx="30" cy="61" r="4" fill="#2a2620"/>
        <path d="M26 65 h8 l1 8 h-10z" fill="#3b3a2c"/>
        <path d="M27 73 l-2 5 M33 73 l2 5" stroke="#2a2620" stroke-width="2" stroke-linecap="round"/>
      </svg></div>
  <div class="chute" id="chuteZhenya"><svg viewBox="0 0 60 78" aria-hidden="true">
        <path d="M4 26 C4 8 56 8 56 26 C50 22 44 22 40 26 C36 22 24 22 20 26 C16 22 10 22 4 26Z" fill="#e07a3a" stroke="#6b3210" stroke-width="1.6"/>
        <path d="M20 26 C22 14 26 10 30 9 M40 26 C38 14 34 10 30 9" fill="none" stroke="#6b3210" stroke-width="1.1" opacity=".55"/>
        <path d="M5 26 L27 58 M20 26 L28.5 58 M40 26 L31.5 58 M55 26 L33 58" stroke="rgba(252,248,236,.92)" stroke-width="1.3"/>
        <circle cx="30" cy="61" r="4" fill="#2a2620"/>
        <path d="M26 65 h8 l1 8 h-10z" fill="#3b3a2c"/>
        <path d="M27 73 l-2 5 M33 73 l2 5" stroke="#2a2620" stroke-width="2" stroke-linecap="round"/>
      </svg></div>
  <div class="land-dot vika" id="dotVika"></div>
  <div class="land-dot zhenya" id="dotZhenya"></div>

  <aside class="squad-hud" id="squadHud" aria-label="Отряд">
    <div class="squad-fade" aria-hidden="true"></div>

    <span class="squad-plane vika-plane" aria-hidden="true">
      <svg viewBox="0 0 32 40" fill="currentColor">
        <path d="M16 1.2c.7 1.5 1.55 4.4 1.75 8.2V12.2l11.9 3.8v4.1l-11.9-2.5V30.4l6.8 2.1v3.4l-6.8-1.4V38.6h-3.5v-4.1l-6.8 1.4v-3.4l6.8-2.1V17.6L2.35 20.1v-4.1l11.9-3.8V9.4C14.45 5.6 15.3 2.7 16 1.2z"/>
      </svg>
    </span>
    <span class="squad-num squad-num-1 vika-num" aria-hidden="true">1</span>
    <div class="squad-meta vika-meta">
      <div class="squad-name">[F4M] Marusabelle</div>
      <div class="squad-bar" aria-hidden="true"></div>
    </div>

    <span class="squad-plane zhenya-plane" aria-hidden="true">
      <svg viewBox="0 0 32 40" fill="currentColor">
        <path d="M16 1.2c.7 1.5 1.55 4.4 1.75 8.2V12.2l11.9 3.8v4.1l-11.9-2.5V30.4l6.8 2.1v3.4l-6.8-1.4V38.6h-3.5v-4.1l-6.8 1.4v-3.4l6.8-2.1V17.6L2.35 20.1v-4.1l11.9-3.8V9.4C14.45 5.6 15.3 2.7 16 1.2z"/>
      </svg>
    </span>
    <span class="squad-num squad-num-2 zhenya-num" aria-hidden="true">2</span>
    <div class="squad-meta zhenya-meta">
      <div class="squad-name">[F4M] Rea_ction</div>
      <div class="squad-bar" aria-hidden="true"></div>
    </div>

    <button class="follow-btn" id="followHudBtn" type="button" aria-label="Следовать" aria-pressed="false" title="Следовать">
      <!-- Arrow (left) + parachute (right), as in the reference -->
      <svg viewBox="0 0 70 40" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M24 20H6" stroke-width="2.8"/>
        <path d="M13.5 12L6 20l7.5 8" stroke-width="2.8"/>
        <path d="M35.5 9c7.2-5 20.8-5 28 0 2.8 2 4.6 5.8 5.3 9.6H30.2c.7-3.8 2.5-7.6 5.3-9.6z" fill="currentColor" stroke="none"/>
        <path d="M30.4 19.2C37.6 20.6 54.4 20.6 61.6 19.2" stroke-width="1.7"/>
        <path d="M31 18.6L49.5 34M49.5 10V34M68 18.6L49.5 34" stroke-width="2.1"/>
      </svg>
    </button>
  </aside>

  <div class="prompt" id="prompt" aria-hidden="true">
    <p>Ты даже не привяжешься?</p>
  </div>

  <script>
    const IMG = { w: 2560, h: 1440 };

    /* Прямая диагональ SW → NE через всю карту (14.11): курс постоянный, без поворотов.
       Начало и конец — за краем карты. Середина пути (JUMP_T) — ближайшая к деревне точка,
       там отряд прыгает и на парашютах летит в одну точку — деревню у западного берега. */
    const PATH = [
      { x: -130, y: 1498 },
      { x: 1845, y: -130 }
    ];
    const LAND = { x: 905, y: 742 };      /* = START в pubg/zone.html */
    const JUMP_T = 0.5;                   /* точка прыжка: (857, 684), ~75 px до деревни */
    const CHUTE_MS = 4200;
    const MAP_GRID = 61;

    const FLIGHT_MS = 18000;
    const PAUSE_AT_MS = 5000;
    const PLANE_W = 220;

    const params = new URLSearchParams(location.search);
    const START_PAUSED = params.get("paused") === "1";

    const mapImg = document.getElementById("map");
    const plane = document.getElementById("plane");
    const prompt = document.getElementById("prompt");
    const followHudBtn = document.getElementById("followHudBtn");

    let viewW = 0, viewH = 0;
    let transform = { scale: 1, ox: 0, oy: 0 };

    let flightTime = 0;
    let lastNow = 0;
    let paused = false;
    let followed = false;
    let finished = false;
    let started = false;
    let lastAngle = 0;
    let jumpAt = 0;          /* performance.now() момента прыжка */
    let landed = false;
    const chutes = [
      { el: document.getElementById("chuteVika"), dot: document.getElementById("dotVika"), sx: -14, sy: -6, ex: -9, ey: -6, ph: 0 },
      { el: document.getElementById("chuteZhenya"), dot: document.getElementById("dotZhenya"), sx: 14, sy: 6, ex: 10, ey: 7, ph: 1.7 }
    ];
    function jumpPoint() {
      return { x: PATH[0].x + (PATH[1].x - PATH[0].x) * JUMP_T, y: PATH[0].y + (PATH[1].y - PATH[0].y) * JUMP_T };
    }
    function placeChutes(now) {
      if (!jumpAt) return;
      const J = jumpPoint();
      const raw = Math.min(1, (now - jumpAt) / CHUTE_MS);
      const e = raw < 0.5 ? 2 * raw * raw : 1 - Math.pow(-2 * raw + 2, 2) / 2;
      const k = transform.scale / 0.75;
      const w = Math.max(24, 40 * k);
      chutes.forEach((c) => {
        const x = J.x + c.sx + (LAND.x + c.ex - J.x - c.sx) * e;
        const y = J.y + c.sy + (LAND.y + c.ey - J.y - c.sy) * e;
        const [px, py] = toScreen(x, y);
        const scale = 1.25 - 0.45 * e;                 /* ближе к земле — меньше */
        const sway = Math.sin((now - jumpAt) / 520 + c.ph) * 7 * (1 - e);
        c.el.style.width = w + "px";
        c.el.style.opacity = raw < 0.92 ? Math.min(1, raw * 6) : Math.max(0, (1 - raw) / 0.08);
        c.el.style.transform = "translate(" + (px - w / 2) + "px, " + (py - w * 1.3) + "px) scale(" + scale + ") rotate(" + sway + "deg)";
        const [dx, dy] = toScreen(LAND.x + c.ex, LAND.y + c.ey);
        c.dot.style.left = dx + "px"; c.dot.style.top = dy + "px";
      });
      if (raw >= 1 && !landed) {
        landed = true;
        chutes.forEach((c) => c.dot.classList.add("on"));
      }
    }

    function coverTransform(vw, vh) {
      const scale = Math.min(vw / IMG.w, vh / IMG.h); /* contain: карта целиком */
      const dw = IMG.w * scale;
      const dh = IMG.h * scale;
      return { scale, ox: (vw - dw) / 2, oy: (vh - dh) / 2 };
    }

    function toScreen(x, y) {
      return [x * transform.scale + transform.ox, y * transform.scale + transform.oy];
    }

    function pathLength(pts) {
      let len = 0;
      for (let i = 1; i < pts.length; i++) {
        len += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
      }
      return len;
    }

    function pointAlong(pts, t) {
      const total = pathLength(pts);
      if (t <= 0) return { x: pts[0].x, y: pts[0].y, angle: heading(pts[0], pts[1]) };
      if (t >= 1) {
        const n = pts.length;
        return { x: pts[n - 1].x, y: pts[n - 1].y, angle: heading(pts[n - 2], pts[n - 1]) };
      }
      let d = t * total;
      for (let i = 1; i < pts.length; i++) {
        const seg = Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
        if (d <= seg) {
          const u = seg === 0 ? 0 : d / seg;
          return {
            x: pts[i - 1].x + (pts[i].x - pts[i - 1].x) * u,
            y: pts[i - 1].y + (pts[i].y - pts[i - 1].y) * u,
            angle: heading(pts[i - 1], pts[i]),
          };
        }
        d -= seg;
      }
      const n = pts.length;
      return { x: pts[n - 1].x, y: pts[n - 1].y, angle: heading(pts[n - 2], pts[n - 1]) };
    }

    /* Plane sprite is nose-up. Screen y grows down, so rotate from up toward velocity. */
    function heading(a, b) {
      return Math.atan2(b.x - a.x, -(b.y - a.y));
    }

    function placePlane() {
      const t = Math.min(1, Math.max(0, flightTime / FLIGHT_MS));
      const p = pointAlong(PATH, t);
      const [sx, sy] = toScreen(p.x, p.y);
      const deg = p.angle * (180 / Math.PI);
      const w = plane.getBoundingClientRect().width || PLANE_W * (transform.scale / 0.75);
      plane.style.width = (PLANE_W * (transform.scale / 0.75)) + "px";
      plane.style.transform = "translate(" + (sx - plane.offsetWidth / 2) + "px, " +
        (sy - plane.offsetHeight / 2) + "px) rotate(" + deg + "deg)";
      plane.style.opacity = t >= 1 ? "0" : "1";
      lastAngle = deg;
    }

    function resize() {
      viewW = window.innerWidth;
      viewH = window.innerHeight;
      transform = coverTransform(viewW, viewH);
      const g = MAP_GRID * transform.scale, st = document.documentElement.style;
      st.setProperty("--grid", g.toFixed(2) + "px");
      st.setProperty("--grid-x", (((transform.ox % g) + g) % g).toFixed(2) + "px");
      st.setProperty("--grid-y", (((transform.oy % g) + g) % g).toFixed(2) + "px");
      placePlane();
      placeChutes(performance.now());
    }

    function showPrompt() {
      prompt.classList.add("show");
      prompt.setAttribute("aria-hidden", "false");
    }

    function hidePrompt() {
      prompt.classList.remove("show");
      prompt.setAttribute("aria-hidden", "true");
    }

    function follow() {
      if (followed) return;
      followed = true;
      followHudBtn.classList.add("lit");
      followHudBtn.setAttribute("aria-pressed", "true");
      hidePrompt();
      paused = false;
    }

    function tick(now) {
      if (!lastNow) lastNow = now;
      const dt = now - lastNow;
      lastNow = now;
      if (started && !paused && !finished) {
        flightTime += dt;
        if (!followed && flightTime >= PAUSE_AT_MS) {
          flightTime = PAUSE_AT_MS;
          paused = true;
          showPrompt();
        }
        if (!jumpAt && flightTime >= FLIGHT_MS * JUMP_T) jumpAt = now;
        if (flightTime >= FLIGHT_MS) flightTime = FLIGHT_MS;
        if (flightTime >= FLIGHT_MS && landed && !finished) {
          finished = true;
          if (window.QuestHUD) setTimeout(QuestHUD.next, 900);
        }
      }
      placePlane();
      placeChutes(now);
      requestAnimationFrame(tick);
    }

    let booted = false;

    function boot() {
      if (booted) return;
      booted = true;
      resize();
      window.addEventListener("resize", resize);
      followHudBtn.addEventListener("click", follow);

      if (START_PAUSED) {
        flightTime = PAUSE_AT_MS;
        paused = true;
        started = true;
        placePlane();
        showPrompt();
      } else {
        started = true;
      }
      requestAnimationFrame(tick);
    }

    window.__flight = {
      get state() {
        return {
          flightTime,
          paused,
          followed,
          finished,
          prompt: prompt.classList.contains("show"),
          angle: lastAngle,
          jumped: !!jumpAt,
          landed,
          planeVisible: plane.style.opacity !== "0",
          transform: { ...transform },
          lit: followHudBtn.classList.contains("lit"),
        };
      },
      follow,
    };

    if (document.readyState === "complete") boot();
    else window.addEventListener("load", boot);
  </script>
</body>
