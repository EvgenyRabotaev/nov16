<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Subnautica — переход</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #02060c;
      overflow: hidden;
      color: #d7eef6;
      font-family: "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
      user-select: none;
    }
    #stage {
      position: fixed;
      inset: 0;
      background: #02060c;
    }
    .loc {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 100%;
      height: 132%;
      object-fit: cover;
      object-position: center center;
      transform: translate(-50%, -50%);
      will-change: transform, opacity, filter;
      pointer-events: none;
    }
    #layerNext { opacity: 0; }
    #wash {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(8, 30, 50, 0) 40%, rgba(1, 6, 14, 0.35) 100%),
        linear-gradient(to bottom, rgba(0, 8, 16, 0.12), rgba(0, 4, 12, 0.28));
      opacity: 1;
      z-index: 2;
    }
    #washMid {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 70%, rgba(2, 16, 32, 0.0), rgba(0, 6, 16, 0.85));
      opacity: 0;
      z-index: 3;
      will-change: opacity;
    }
    #bubbles {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 4;
      pointer-events: none;
    }
    #depth {
      position: absolute;
      top: 3.4%;
      left: 3.2%;
      z-index: 6;
      letter-spacing: 0.18em;
      text-shadow: 0 1px 8px rgba(0, 10, 20, 0.7);
      pointer-events: none;
    }
    #depth .label {
      display: block;
      font-size: 10px;
      font-weight: 600;
      opacity: 0.62;
      margin-bottom: 3px;
    }
    #depth .value {
      font-size: 22px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.08em;
      color: rgba(210, 236, 245, 0.88);
    }
    #deeper {
      position: absolute;
      left: 50%;
      /* Над рядом HUD в нижнем углу, без подъёма счётчика и подсказки */
      bottom: calc(16px + env(safe-area-inset-bottom, 0px) + 52px);
      transform: translateX(-50%);
      z-index: 6;
      appearance: none;
      border: 1px solid rgba(160, 220, 240, 0.42);
      background: rgba(8, 28, 44, 0.52);
      color: #e7f7ff;
      font: 600 16px/1 "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
      letter-spacing: 0.12em;
      text-transform: none;
      padding: 13px 30px 13px 32px;
      border-radius: 999px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.04) inset,
        0 8px 24px rgba(0, 10, 20, 0.35);
      transition: opacity 0.4s ease, transform 0.35s ease, background 0.25s ease, border-color 0.25s ease;
    }
    #deeper:hover:not(:disabled) {
      background: rgba(16, 48, 70, 0.7);
      border-color: rgba(190, 235, 255, 0.7);
    }
    #deeper:active:not(:disabled) {
      transform: translateX(-50%) scale(0.97);
    }
    #deeper:disabled,
    #deeper.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(8px);
    }
    #deeper .arrow {
      display: inline-block;
      margin-left: 8px;
      font-weight: 400;
      opacity: 0.85;
    }
    #boot {
      position: absolute;
      inset: 0;
      z-index: 10;
      background: #02060c;
      transition: opacity 0.5s ease;
    }
    #boot.gone {
      opacity: 0;
      pointer-events: none;
    }

    /* ----- кислород, КПК, рыбы, ремонт, левиафан, фото ----- */
    #o2 {
      position: absolute; top: 3.4%; right: 3.2%; z-index: 8;
      width: 140px; pointer-events: none;
      text-shadow: 0 1px 8px rgba(0, 10, 20, 0.7);
    }
    #o2 .label { display: block; font-size: 10px; font-weight: 600; letter-spacing: .18em; opacity: .62; margin-bottom: 4px; }
    #o2 .bar { height: 8px; border-radius: 99px; background: rgba(0, 20, 30, .45); border: 1px solid rgba(160, 220, 240, .35); overflow: hidden; }
    #o2 .fill { height: 100%; width: 100%; background: linear-gradient(90deg, #2aa9a0, #8ee8c8); transform-origin: left; transition: width .25s linear, background .3s; }
    #o2.warn .fill { background: linear-gradient(90deg, #c45a2a, #f0c060); }
    #o2 .val { font-size: 11px; margin-top: 3px; letter-spacing: .08em; opacity: .8; }
    .air-bubble {
      position: absolute; z-index: 7;
      appearance: none; -webkit-appearance: none;
      background: transparent; border: none; padding: 0; margin: 0;
      border-radius: 50%; cursor: pointer; pointer-events: auto;
      animation: airUp 8s linear forwards;
    }
    .air-bubble::before {
      content: ""; position: absolute; left: 50%; top: 50%;
      width: var(--bubble-size, 52px); height: var(--bubble-size, 52px);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background:
        radial-gradient(circle at 32% 28%,
          rgba(255,255,255,.95) 0 7%,
          rgba(210,245,255,.58) 18%,
          rgba(130,215,240,.34) 46%,
          rgba(70,170,220,.16) 72%,
          rgba(40,130,190,.06) 100%);
      box-shadow:
        0 0 10px 3px rgba(150,230,255,.55),
        0 0 22px 8px rgba(80,190,230,.28),
        inset 0 -6px 10px rgba(30,100,150,.18),
        inset 0 0 0 2px rgba(210,245,255,.55);
      pointer-events: none;
      animation: airPulse 1.8s ease-in-out infinite;
    }
    .air-bubble::after {
      content: ""; position: absolute; left: 50%; top: 50%;
      width: calc(var(--bubble-size, 52px) * .22);
      height: calc(var(--bubble-size, 52px) * .16);
      transform: translate(-120%, -140%);
      border-radius: 50%;
      background: rgba(255,255,255,.92);
      pointer-events: none;
      filter: blur(.3px);
    }
    @keyframes airPulse {
      0%, 100% { transform: translate(-50%,-50%) scale(1); }
      50% { transform: translate(-50%,-50%) scale(1.08); }
    }
    @keyframes airUp {
      0%   { transform: translate(0, 0); opacity: 1; }
      20%  { transform: translate(var(--wobble, 16px), -24vh); opacity: 1; }
      40%  { transform: translate(calc(var(--wobble, 16px) * -.8), -48vh); opacity: 1; }
      60%  { transform: translate(calc(var(--wobble, 16px) * .6), -72vh); opacity: .95; }
      80%  { transform: translate(calc(var(--wobble, 16px) * -.4), -96vh); opacity: .55; }
      100% { transform: translate(0, -120vh); opacity: 0; }
    }

    .fish {
      position: absolute; z-index: 6; cursor: pointer; pointer-events: auto;
      appearance: none; -webkit-appearance: none;
      background: transparent !important; border: none !important;
      padding: 0; margin: 0; box-shadow: none; outline: none;
      width: 72px; height: auto;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 2px 6px rgba(0,0,0,.45));
    }
    .fish.kind-peeper { width: 72px; }
    .fish.kind-boomerang { width: 58px; }
    .fish.kind-reginald { width: 84px; }
    .fish img { display: block; width: 100%; height: auto; pointer-events: none; background: transparent; border: none; }
    .fish.scanned { opacity: .45; cursor: default; filter: grayscale(.4) drop-shadow(0 2px 4px rgba(0,0,0,.25)); }
    .fish-label {
      position: absolute; left: 50%; top: 110%; transform: translateX(-50%);
      white-space: nowrap; font-size: 11px; color: #e7f7ff; letter-spacing: .04em;
      text-shadow: 0 1px 4px #000; pointer-events: none; opacity: 0; transition: opacity .2s;
    }
    .fish:hover .fish-label, .fish:focus .fish-label { opacity: 1; }

    .pda {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.96);
      z-index: 20; width: min(420px, calc(100vw - 28px));
      background: linear-gradient(180deg, #0c2a36, #071820);
      border: 1px solid rgba(80, 200, 210, .55);
      box-shadow: 0 0 0 1px rgba(255,255,255,.04) inset, 0 16px 40px rgba(0,0,0,.5);
      border-radius: 10px; padding: 18px 18px 16px; color: #d7eef6;
      opacity: 0; pointer-events: none; transition: opacity .3s ease, transform .3s ease;
    }
    .pda.on { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
    .pda-kicker { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: #7ad4c8; margin-bottom: 8px; }
    .pda-title { font-size: 16px; font-weight: 600; margin-bottom: 10px; color: #e7f7ff; }
    .pda-text { font-size: 15px; line-height: 1.5; margin-bottom: 16px; color: #cfe7ee; }
    .pda-btn {
      appearance: none; cursor: pointer; border-radius: 999px; padding: 10px 20px;
      border: 1px solid rgba(160, 220, 240, .42); background: rgba(8, 28, 44, .7);
      color: #e7f7ff; font: 600 14px/1 "Segoe UI", sans-serif; letter-spacing: .08em;
    }
    .pda-btn:hover { border-color: rgba(190, 235, 255, .7); background: rgba(16, 48, 70, .85); }
    .pda.q-pop {
      display: flex; flex-direction: column; gap: 0;
      top: auto; left: 50%; right: auto;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px) + var(--qhud-h, 56px) + 12px);
      width: min(540px, calc(100vw - 32px));
      max-width: calc(100vw - 32px);
      max-height: none;
      height: auto;
      overflow: visible;
      padding: 20px 22px 18px;
      border-radius: 14px;
      transform: translate(-50%, 16px);
      background: linear-gradient(180deg, rgba(16, 52, 64, .78), rgba(6, 20, 30, .86));
      border: 1px solid rgba(120, 220, 230, .55);
      box-shadow:
        0 0 0 1px rgba(255,255,255,.06) inset,
        0 18px 44px rgba(0, 8, 16, .5),
        0 0 28px rgba(40, 180, 190, .14);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      scrollbar-width: none;
    }
    .pda.q-pop::-webkit-scrollbar { display: none; width: 0; height: 0; }
    .pda.q-pop.on { transform: translate(-50%, 0) scale(1); opacity: 1; }
    .pda.q-pop .pda-kicker { margin-bottom: 6px; font-size: 11px; letter-spacing: .22em; color: #7ad4c8; }
    .pda.q-pop .pda-title {
      font-size: 18px; font-weight: 650; margin-bottom: 8px;
      color: #eef9ff; letter-spacing: .02em;
    }
    .pda.q-pop .q-text {
      margin: 0 0 16px; min-height: 0; flex: 0 0 auto;
      overflow: visible;
      font-size: 16px; line-height: 1.45; color: #cfe7ee;
    }
    .ans-block {
      display: flex; flex-direction: row; flex-wrap: nowrap;
      gap: 8px; align-items: stretch; margin: 0; flex: 0 0 auto;
    }
    .ans-inputs { display: flex; flex-direction: column; gap: 8px; margin: 0; flex: 1 1 auto; min-width: 0; }
    .ans-input {
      width: 100%; padding: 12px 14px; border-radius: 10px;
      border: 1px solid rgba(140, 220, 230, .45); background: rgba(4, 20, 30, .55);
      color: #e7f7ff; font: 16px/1.3 "Segoe UI", "Noto Sans", sans-serif; outline: none; user-select: text;
    }
    .ans-input:focus { border-color: rgba(180, 245, 255, .9); box-shadow: 0 0 0 3px rgba(80, 200, 210, .2); }
    .ans-input.ok { border-color: #8ee8c8; }
    .ans-input.bad { animation: qshake .38s ease; }
    @keyframes qshake { 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .pda.q-pop .ans-block .pda-btn {
      width: auto; flex: 0 0 auto; align-self: stretch;
      padding: 12px 20px; white-space: nowrap; border-radius: 10px;
      background: rgba(36, 140, 150, .38);
      border: 1px solid rgba(150, 230, 230, .65);
      letter-spacing: .1em; text-transform: uppercase; font-size: 13px;
    }
    .pda.q-pop .ans-block .pda-btn:hover { background: rgba(48, 170, 180, .5); }
    .ans-msg { min-height: 0; margin: 8px 0 0; font-size: 13px; color: #f0c060; }
    .ans-msg:empty { display: none; margin: 0; }
    .ans-msg.ok { color: #8ee8c8; }
    @media (max-width: 600px) {
      .pda { width: min(420px, calc(100vw - 24px)); padding: 14px 14px 12px; }
      .pda-text { font-size: 15px; line-height: 1.45; }
      .pda.q-pop {
        width: calc(100vw - 24px);
        max-width: calc(100vw - 24px);
        padding: 16px 16px 14px;
        bottom: calc(12px + env(safe-area-inset-bottom, 0px) + var(--qhud-h, 54px) + 10px);
      }
      .pda.q-pop .pda-title { font-size: 17px; }
      .pda.q-pop .q-text { font-size: 15px; line-height: 1.42; margin-bottom: 14px; }
      .ans-block { gap: 6px; }
      .pda.q-pop .ans-block .pda-btn { padding: 12px 14px; }
    }
    @media (min-width: 900px) {
      .pda.q-pop { width: min(560px, calc(100vw - 48px)); }
      .pda.q-pop .pda-title { font-size: 19px; }
      .pda.q-pop .q-text { font-size: 17px; line-height: 1.5; }
    }
    @media (max-height: 700px) {
      .pda.q-pop { padding: 16px 18px 14px; }
      .pda.q-pop .q-text { margin-bottom: 12px; }
    }
    /* Примогемы и подсказка — аккуратно в правом нижнем углу экрана, карточка над ними. */
    .qhud {
      right: calc(16px + env(safe-area-inset-right, 0px));
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    }

    #repair {
      position: absolute; inset: 0; z-index: 16; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(2, 8, 16, .55);
      opacity: 0; pointer-events: none; transition: opacity .35s ease;
    }
    #repair.on { opacity: 1; pointer-events: auto; }
    #repair h2 { font-size: 17px; letter-spacing: .16em; text-transform: uppercase; color: #9eefe4; margin-bottom: 14px; text-shadow: 0 2px 8px #000; background: rgba(0,12,22,.55); padding: 8px 16px; border-radius: 8px; }
    .wires {
      position: relative; width: min(420px, calc(100vw - 32px)); height: 220px;
    }
    .wires svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .term, .sock {
      position: absolute; width: 54px; height: 36px; border-radius: 8px; cursor: pointer;
      border: 2px solid rgba(255,255,255,.35); box-shadow: 0 4px 12px rgba(0,0,0,.35);
    }
    .term { left: 0; } .sock { right: 0; }
    .term.done, .sock.done { cursor: default; opacity: .7; }
    .term.active { box-shadow: 0 0 0 3px rgba(255,255,255,.35), 0 4px 12px rgba(0,0,0,.35); }

    #camBtn {
      position: absolute; right: 3.2%; bottom: 18%; z-index: 8;
      appearance: none; cursor: pointer; width: 56px; height: 56px; border-radius: 50%;
      border: 2px solid rgba(160, 220, 240, .6); background: rgba(8, 28, 44, .62);
      color: #e7f7ff; font-size: 22px; box-shadow: 0 8px 20px rgba(0,0,0,.35);
      display: none;
    }
    #camBtn, #camBtn.show { display: none !important; }
    #flash { position: absolute; inset: 0; z-index: 18; background: #fff; opacity: 0; pointer-events: none; }

    #hideBtn {
      position: absolute; left: 50%; bottom: 18%; transform: translateX(-50%);
      z-index: 12; appearance: none; cursor: pointer; display: none;
      padding: 13px 28px; border-radius: 999px;
      border: 1px solid rgba(230, 120, 80, .7); background: rgba(40, 12, 8, .62);
      color: #ffe8d8; font: 600 16px/1 "Segoe UI", sans-serif; letter-spacing: .1em;
    }
    #hideBtn.show { display: block; }
    #cover {
      position: absolute; inset: 0; z-index: 11; pointer-events: none;
      background: radial-gradient(circle at 50% 80%, transparent 20%, rgba(0, 4, 10, 0) 21%, rgba(0, 4, 10, .92) 100%);
      opacity: 0; transition: opacity .5s ease;
    }
    #cover.on { opacity: 1; }
    .levi {
      position: absolute; z-index: 5; pointer-events: none;
      width: min(100vw, 1320px); height: auto; opacity: 0;
      left: 0; top: 10%;
      will-change: transform, opacity;
      filter: blur(1.15px) brightness(.72) saturate(.88) contrast(1.06)
              drop-shadow(0 22px 28px rgba(0, 16, 40, .55));
    }
    .levi-canvas { display: block; width: 100%; height: auto; background: transparent; }

    #radioPing {
      position: absolute; z-index: 8; cursor: pointer; display: none;
      width: 28px; height: 28px; border-radius: 50%;
      background: radial-gradient(circle, #8ff, #2aa 40%, transparent 70%);
      box-shadow: 0 0 16px 6px rgba(80, 220, 255, .6);
      animation: ping 1.4s ease-out infinite;
    }
    #radioPing.show { display: block; }
    @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(80, 220, 255, .6); } 100% { box-shadow: 0 0 0 18px rgba(80, 220, 255, 0); } }


    /* ----- достижения ----- */
    .sn-ach {
      position: absolute; z-index: 30;
      top: calc(58px + env(safe-area-inset-top, 0px));
      left: 50%; transform: translateX(-50%) translateY(-8px);
      display: flex; align-items: center; gap: 10px;
      width: min(320px, calc(100vw - 24px));
      padding: 10px 14px;
      background: linear-gradient(180deg, rgba(10, 36, 44, .94), rgba(4, 16, 24, .94));
      border: 1px solid rgba(90, 210, 200, .55);
      box-shadow: 0 0 0 1px rgba(255,255,255,.04) inset, 0 10px 28px rgba(0, 8, 16, .5), 0 0 22px rgba(40, 180, 170, .16);
      border-radius: 10px; color: #e7f7ff;
      opacity: 0; pointer-events: none;
      animation: snAchIn .4s ease forwards;
    }
    .sn-ach.off { animation: snAchOut .45s ease forwards; }
    .sn-ach .ico {
      flex: 0 0 40px; width: 40px; height: 40px; border-radius: 8px;
      display: grid; place-items: center; font-size: 22px;
      background: rgba(20, 60, 70, .7); border: 1px solid rgba(120, 220, 210, .35);
    }
    .sn-ach .kicker { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: #7ad4c8; }
    .sn-ach .ttl { font-size: 15px; font-weight: 600; margin-top: 1px; }
    .sn-ach .pts { font-size: 12px; color: #9fe8dc; margin-top: 1px; }
    @keyframes snAchIn { from { opacity: 0; transform: translateX(-50%) translateY(-14px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    @keyframes snAchOut { from { opacity: 1; transform: translateX(-50%) translateY(0); } to { opacity: 0; transform: translateX(-50%) translateY(-12px); } }

    /* ----- радио: настройка частоты ----- */
    #radioTune {
      position: absolute; left: 50%; top: 50%; z-index: 21;
      width: min(420px, calc(100vw - 24px));
      transform: translate(-50%, -50%) scale(.96);
      background: linear-gradient(180deg, #0c2a36, #071820);
      border: 1px solid rgba(80, 200, 210, .55);
      box-shadow: 0 0 0 1px rgba(255,255,255,.04) inset, 0 16px 40px rgba(0,0,0,.5);
      border-radius: 10px; padding: 16px 16px 14px; color: #d7eef6;
      opacity: 0; pointer-events: none; transition: opacity .3s ease, transform .3s ease;
    }
    #radioTune.on { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
    #radioTune .pda-kicker { margin-bottom: 6px; }
    #radioTune .radio-freq {
      font: 500 28px/1.1 ui-monospace, "Cascadia Mono", "Segoe UI", monospace;
      font-variant-numeric: tabular-nums; letter-spacing: .08em;
      color: #8fe8dc; text-align: center; margin: 8px 0 10px;
      text-shadow: 0 0 12px rgba(80, 220, 210, .35);
      transition: color .2s, text-shadow .2s;
    }
    #radioTune.near .radio-freq { color: #c8fff6; text-shadow: 0 0 16px rgba(120, 255, 230, .55); }
    #radioTune .radio-unit { font-size: 13px; letter-spacing: .16em; opacity: .7; margin-left: 6px; }
    #radioWave {
      display: block; width: 100%; height: 72px; border-radius: 6px;
      background: #031018; border: 1px solid rgba(80, 200, 210, .28);
      margin-bottom: 14px;
    }
    .radio-track {
      position: relative; height: 44px; touch-action: none; cursor: pointer;
      margin: 0 2px 8px;
    }
    .radio-track::before {
      content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 8px;
      transform: translateY(-50%); border-radius: 99px;
      background: linear-gradient(90deg, #123 0%, #1a4a52 40%, #2a8a80 50%, #1a4a52 60%, #123 100%);
      border: 1px solid rgba(120, 220, 210, .35);
      box-shadow: inset 0 1px 3px rgba(0,0,0,.5);
    }
    .radio-thumb {
      position: absolute; top: 50%; width: 28px; height: 28px; margin-left: -14px;
      transform: translateY(-50%); border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #e7fffb, #4ad4c4 46%, #1a6a64 100%);
      border: 2px solid #c8fff6;
      box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 0 12px rgba(80, 230, 210, .45);
      pointer-events: none;
    }
    #radioTune.near .radio-thumb { box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 0 18px 4px rgba(100, 255, 230, .55); }
    .radio-status {
      font-size: 13px; line-height: 1.4; color: #9ec8d0; text-align: center;
      min-height: 1.4em; margin: 4px 0 12px;
    }
    #radioTune.near .radio-status { color: #c8fff0; }
    #radioLock:disabled { opacity: .4; pointer-events: none; }

    /* ----- фонарик: поиск входа в пещеру ----- */
    #caveSearch {
      position: absolute; inset: 0; z-index: 18; display: none;
      touch-action: none; cursor: none; overflow: hidden;
    }

  <script>
    const LOCS = [
      { src: "loc1.jpg", depth: 10 },
      { src: "loc2.jpg", depth: 40 },
      { src: "loc3.jpg", depth: 150 },
      { src: "loc4.jpg", depth: 300 },
      { src: "loc5.jpg", depth: 500 },
      { src: "loc6.jpg", depth: 900 },
      { src: "loc7.jpg", depth: 1200 },
    ];
    const PAUSE_MS = 2000;

    const layerCurrent = document.getElementById("layerCurrent");
    const layerNext = document.getElementById("layerNext");
    const washMid = document.getElementById("washMid");
    const canvas = document.getElementById("bubbles");
    const ctx = canvas.getContext("2d", { alpha: true });
    const deeper = document.getElementById("deeper");
    const depthVal = document.getElementById("depthVal");
    const boot = document.getElementById("boot");

    const params = new URLSearchParams(location.search);
    const AUTO = params.get("auto") === "1";
    const FAST = params.get("fast") === "1";
    if (FAST) document.documentElement.classList.add("fast");
    const TRANSITION_MS = FAST ? 500 : 3200;
    const Q_DEBUG = Math.max(0, parseInt(params.get("q") || params.get("question") || "", 10) || 0);
    const START_LOC = (() => {
      const n = parseInt(params.get("loc") || "", 10);
      return Number.isFinite(n) ? Math.max(0, Math.min(6, n)) : 0;
    })();
    const RADIO_DEBUG = params.get("radio") === "1";
    const CAVE_DEBUG = params.get("cave") === "1";
    const GLOW_DEBUG = params.get("glow") === "1";
    const LEVI_DEBUG = params.get("leviathan") === "1" || params.get("levi") === "1";
    const INTRO_DEBUG = params.get("intro") === "1";
    const CURRENT_DEBUG = params.get("current") === "1" || params.get("event") === "current";
    const REUNION_DEBUG = params.get("reunion") === "1" || params.get("meet") === "1";
    const SEAMOTH_DEBUG = params.get("seamoth") === "1" || params.get("moth") === "1";
    const ASSET_V = "20261115s";
    const FISH_SRC = {
      peeper: "fish_peeper.png?v=" + ASSET_V,
      boomerang: "fish_boomerang.png?v=" + ASSET_V,
      reginald: "fish_reginald.png?v=" + ASSET_V
    };
    const FISH_KIND_BY_ID = { fish1: "boomerang", fish2: "peeper", kelp1: "peeper", kelp2: "reginald" };
    const LEVI_SRC = "leviathan.png?v=" + ASSET_V;
    const SUB = (window.QUEST_CONFIG && window.QUEST_CONFIG.SUBNAUTICA) || {};
    const O2CFG = Object.assign({ max: 100, drainPerSec: 1.1, warnAt: 28, bubbleHeal: 26, minFloor: 16 }, SUB.OXYGEN || {});
    const PHOTO_KEY = (SUB.PHOTO && SUB.PHOTO.storageKey) || "nov16_sub_photo";

    let index = 0;
    let busy = false;
    let locReady = true;
    let oxygen = O2CFG.max;
    let o2Last = 0, o2WarnShown = false;
    let scanned = {};
    let pdaAfter = null;
    let repairDone = false, radioDone = false, photoDone = false, leviDone = false, leviQDone = false, heartQDone = false, caveDone = false;
    let airTimer = 0, o2Raf = 0, faunaRaf = 0, leviRaf = 0;
    let faunaState = [];
    let images = [];
    let bubbles = [];
    let vents = [];
    let anim = null;
    let lastTs = 0;
    let cssW = 1, cssH = 1;

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }
    function easeInOutQuart(t) {
      return t < 0.5 ? 8 * t * t * t * t : 1 - Math.pow(-2 * t + 2, 4) / 2;
    }
    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }
    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function rand(a, b) { return a + Math.random() * (b - a); }

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      cssW = window.innerWidth;
      cssH = window.innerHeight;
      canvas.width = Math.round(cssW * dpr);
      canvas.height = Math.round(cssH * dpr);
      canvas.style.width = cssW + "px";
      canvas.style.height = cssH + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      layoutQSheet();
    }
    window.addEventListener("resize", resize);

    function applyLayer(el, yPct, blur, brightness, opacity, scale) {
      el.style.transform = `translate(-50%, calc(-50% + ${yPct}%)) scale(${scale})`;
      el.style.filter = `blur(${blur}px) brightness(${brightness})`;
      el.style.opacity = String(opacity);
    }

    function setDepth(n) {
      depthVal.textContent = String(Math.round(n));
    }

    function makeBubble(opts = {}) {
      const near = opts.near ?? (Math.random() < 0.22);
      const far = !near && (opts.far ?? Math.random() < 0.4);
      let r;
      if (opts.r != null) r = opts.r;
      else if (near) r = rand(14, 36) * (cssW / 1280);
      else if (far) r = rand(2.2, 7) * (cssW / 1280);
      else r = rand(6, 16) * (cssW / 1280);

      const speedMul = near ? rand(0.95, 1.35) : far ? rand(0.35, 0.6) : rand(0.55, 0.95);
      return {
        x: opts.x ?? rand(-20, cssW + 20),
        y: opts.y ?? cssH + rand(8, 80),
        r,
        baseR: r,
        vy: -rand(140, 230) * speedMul * (cssH / 720),
        wobbleAmp: r * (near ? rand(0.7, 1.6) : rand(0.4, 1.1)),
        wobbleFreq: rand(1.1, 2.6),
        wobblePhase: rand(0, Math.PI * 2),
        wobble2Amp: r * rand(0.15, 0.45),
        wobble2Freq: rand(2.2, 4.4),
        wobble2Phase: rand(0, Math.PI * 2),
        alpha: near ? rand(0.55, 0.9) : far ? rand(0.22, 0.45) : rand(0.4, 0.75),
        born: opts.born ?? performance.now(),
        life: rand(2200, 3600),
        pop: false,
        popT: 0,
        near,
      };
    }

    function spawnVentBurst(vent, count, now) {
      for (let i = 0; i < count; i++) {
        bubbles.push(makeBubble({
          x: vent.x + rand(-vent.spread, vent.spread),
          y: cssH + rand(4, 90) + (i % 5) * 10,
          born: now,
        }));
      }
    }

    function startBurst(now) {
      bubbles = [];
      vents = [];
      const nVents = 5;
      for (let i = 0; i < nVents; i++) {
        vents.push({
          x: cssW * (0.1 + (0.8 * (i + 0.5 + rand(-0.15, 0.15)) / nVents)),
          spread: rand(28, 70) * (cssW / 1280),
          rate: rand(9, 16),
          acc: rand(0, 1),
        });
      }
      // Opening volley already in flight at different heights
      const opening = 70;
      for (let i = 0; i < opening; i++) {
        const y = rand(cssH * 0.35, cssH + 60);
        bubbles.push(makeBubble({
          y,
          born: now - rand(0, 400),
        }));
      }
      // A few large hero bubbles
      for (let i = 0; i < 8; i++) {
        bubbles.push(makeBubble({
          x: rand(cssW * 0.08, cssW * 0.92),
          y: cssH + rand(20, 160),
          r: rand(22, 44) * (cssW / 1280),
          near: true,
          born: now,
        }));
      }
    }

    function spawnDuring(dt, p, now) {
      // High rate early, then taper off so the field thins
      const gate = p < 0.55 ? 1 : p < 0.78 ? lerp(1, 0.15, (p - 0.55) / 0.23) : 0;
      if (gate <= 0) return;
      for (const vent of vents) {
        vent.acc += vent.rate * gate * dt;
        while (vent.acc >= 1) {
          vent.acc -= 1;
          const cluster = Math.random() < 0.28 ? (2 + (Math.random() < 0.4 ? 2 : 0)) : 1;
          for (let k = 0; k < cluster; k++) {
            bubbles.push(makeBubble({
              x: vent.x + rand(-vent.spread, vent.spread),
              y: cssH + rand(6, 50) + k * 8,
              born: now,
              r: cluster > 1 ? rand(3, 9) * (cssW / 1280) : undefined,
            }));
          }
        }
      }
      // Scattered extras
      const extra = 18 * gate * dt;
      if (Math.random() < extra) {
        bubbles.push(makeBubble({ y: cssH + rand(0, 40), born: now }));
      }
    }

    function drawBubble(b, x, y, r, a) {
      if (r < 0.6 || a <= 0.01) return;
      ctx.save();
      ctx.globalAlpha = a;

      if (r < 4.5) {
        const g = ctx.createRadialGradient(x - r * 0.25, y - r * 0.3, 0, x, y, r);
        g.addColorStop(0, "rgba(230, 248, 255, 0.7)");
        g.addColorStop(0.55, "rgba(150, 210, 230, 0.18)");
        g.addColorStop(1, "rgba(190, 230, 250, 0.55)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        return;
      }

      const g = ctx.createRadialGradient(
        x - r * 0.32, y - r * 0.38, r * 0.05,
        x, y + r * 0.08, r
      );
      g.addColorStop(0, "rgba(230, 248, 255, 0.42)");
      g.addColorStop(0.28, "rgba(170, 220, 240, 0.10)");
      g.addColorStop(0.72, "rgba(40, 110, 150, 0.06)");
      g.addColorStop(0.92, "rgba(160, 215, 240, 0.22)");
      g.addColorStop(1, "rgba(210, 240, 255, 0.55)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();

      // Glass rim
      ctx.strokeStyle = "rgba(210, 240, 255, 0.55)";
      ctx.lineWidth = Math.max(0.8, r * 0.045);
      ctx.stroke();

      // Lower dark crescent — volume
      ctx.beginPath();
      ctx.strokeStyle = "rgba(20, 50, 80, 0.22)";
      ctx.lineWidth = Math.max(0.6, r * 0.04);
      ctx.arc(x, y, r * 0.92, Math.PI * 0.15, Math.PI * 0.85);
      ctx.stroke();

      // Primary highlight
      ctx.fillStyle = "rgba(255, 255, 255, 0.78)";
      ctx.beginPath();
      ctx.ellipse(
        x - r * 0.28, y - r * 0.34,
        r * 0.22, r * 0.13,
        -0.55, 0, Math.PI * 2
      );
      ctx.fill();

      // Soft highlight bloom
      const hg = ctx.createRadialGradient(
        x - r * 0.28, y - r * 0.34, 0,
        x - r * 0.28, y - r * 0.34, r * 0.38
      );
      hg.addColorStop(0, "rgba(255, 255, 255, 0.28)");
      hg.addColorStop(1, "rgba(255, 255, 255, 0)");
      ctx.fillStyle = hg;
      ctx.beginPath();
      ctx.arc(x - r * 0.22, y - r * 0.28, r * 0.4, 0, Math.PI * 2);
      ctx.fill();

      // Tiny secondary glint
      if (r > 10) {
        ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
        ctx.beginPath();
        ctx.arc(x + r * 0.22, y + r * 0.2, r * 0.07, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function updateBubbles(dt, now, p) {
      spawnDuring(dt, p, now);
      ctx.clearRect(0, 0, cssW, cssH);

      // Draw far bubbles first for simple parallax layering
      bubbles.sort((a, b) => a.r - b.r);

      const next = [];
      for (const b of bubbles) {
        if (!b.pop) {
          b.y += b.vy * dt;
          const wob =
            Math.sin(now * 0.001 * b.wobbleFreq + b.wobblePhase) * b.wobbleAmp +
            Math.sin(now * 0.001 * b.wobble2Freq + b.wobble2Phase) * b.wobble2Amp;
          b._x = b.x + wob;
          // Slight breathe
          b.r = b.baseR * (1 + 0.04 * Math.sin(now * 0.004 + b.wobblePhase));

          const age = now - b.born;
          if (b.y < cssH * 0.06 || age > b.life) {
            b.pop = true;
            b.popT = 0;
          }
        } else {
          b.popT += dt;
          b.r = b.baseR * (1 + b.popT * 1.8);
        }

        const fadeIn = clamp((now - b.born) / 180, 0, 1);
        const topFade = clamp((b.y + 20) / (cssH * 0.18), 0, 1);
        const popFade = b.pop ? clamp(1 - b.popT / 0.22, 0, 1) : 1;
        const a = b.alpha * fadeIn * topFade * popFade;
        const x = b._x ?? b.x;

        if (!b.pop || b.popT < 0.22) {
          if (b.y < cssH + b.r * 2 && b.y > -b.r * 3) {
            drawBubble(b, x, b.y, b.r, a);
          }
        }

        const gone = b.y < -80 || (b.pop && b.popT >= 0.22);
        if (!gone) next.push(b);
      }
      bubbles = next;
    }

    function applyTransitionFrame(p, fromDepth, toDepth) {
      const e = easeInOutCubic(p);
      const eQ = easeInOutQuart(p);

      // Current scene lifts away (camera descending), blurs and darkens
      const curY = lerp(0, -13, e);
      const curBlur = lerp(0, 9, easeOutCubic(p));
      const curBright = lerp(1, 0.42, e);
      const curOp = p < 0.48 ? 1 : lerp(1, 0, (p - 0.48) / 0.52);
      const curScale = lerp(1, 1.06, e);

      // Next scene rises in from below
      const nextY = lerp(16, 0, eQ);
      const nextBlur = lerp(8, 0, easeOutCubic(clamp((p - 0.12) / 0.7, 0, 1)));
      const nextBright = lerp(0.55, 1, easeOutCubic(clamp((p - 0.08) / 0.7, 0, 1)));
      const nextOp = easeInOutCubic(clamp((p - 0.04) / 0.62, 0, 1));
      const nextScale = lerp(1.04, 1, e);

      applyLayer(layerCurrent, curY, curBlur, curBright, curOp, curScale);
      applyLayer(layerNext, nextY, nextBlur, nextBright, nextOp, nextScale);

      // Mid-dive darkening, peaks around 40%
      const wash =
        p < 0.4 ? easeOutCubic(p / 0.4) * 0.55 :
        p < 0.85 ? lerp(0.55, 0.08, (p - 0.4) / 0.45) :
        lerp(0.08, 0, (p - 0.85) / 0.15);

        const raw = (now - t0) / TRANSITION_MS;
        const p = clamp(raw, 0, 1);

        lastTs = now;
        applyTransitionFrame(p, fromDepth, toDepth);
        updateBubbles(dt, now, p);
        if (p < 1) {

        }
      }
      anim = requestAnimationFrame(frame);
      return true;

    /* ----- радио: настройка частоты ----- */
    const radioTune = document.getElementById("radioTune");
    const radioFreqEl = document.getElementById("radioFreq");
    const radioWave = document.getElementById("radioWave");
    const radioTrack = document.getElementById("radioTrack");
    const radioThumb = document.getElementById("radioThumb");
    const radioStatus = document.getElementById("radioStatus");
    const radioLock = document.getElementById("radioLock");
    const radioWaveCtx = radioWave ? radioWave.getContext("2d") : null;
    const RADIO_CFG = SUB.RADIO || {};
    const FREQ_MIN = Number(RADIO_CFG.freqMin) || 100;
    const FREQ_MAX = Number(RADIO_CFG.freqMax) || 200;
    const FREQ_TARGET = Number(RADIO_CFG.target) || 142.6;
    const FREQ_START = Number(RADIO_CFG.start) || 178.4;
    const FREQ_SPAN = Math.max(1, FREQ_MAX - FREQ_MIN);
    const FREQ_LOCK = FREQ_SPAN * 0.05; // ~5 MHz — удобно пальцем
    let radioFreq = FREQ_START;
    let radioDragging = false;
    let radioWaveRaf = 0;
    let radioLockTimer = 0;
    let radioAudio = null;

    function freqToPct(f) { return clamp((f - FREQ_MIN) / FREQ_SPAN, 0, 1); }
    function pctToFreq(p) { return FREQ_MIN + clamp(p, 0, 1) * FREQ_SPAN; }
    function radioCloseness() {
      const d = Math.abs(radioFreq - FREQ_TARGET);
      return clamp(1 - d / (FREQ_SPAN * 0.5), 0, 1);
    }
    function radioInRange() { return Math.abs(radioFreq - FREQ_TARGET) <= FREQ_LOCK; }

    function setRadioFreq(f, fromUser) {
      radioFreq = clamp(f, FREQ_MIN, FREQ_MAX);
      const pct = freqToPct(radioFreq);
      if (radioThumb) radioThumb.style.left = (pct * 100) + "%";
      if (radioFreqEl) radioFreqEl.textContent = radioFreq.toFixed(1);
      if (radioTrack) {
        radioTrack.setAttribute("aria-valuenow", radioFreq.toFixed(1));
        radioTrack.setAttribute("aria-valuemin", String(FREQ_MIN));
        radioTrack.setAttribute("aria-valuemax", String(FREQ_MAX));
      }
      const close = radioCloseness();
      const inR = radioInRange();
      if (radioTune) radioTune.classList.toggle("near", close > 0.88 || inR);
      if (radioLock) radioLock.disabled = !inR;
      if (radioStatus) {
        if (inR) radioStatus.textContent = "Сигнал чистый. Захватить?";
        else if (close > 0.82) radioStatus.textContent = "Почти… ещё чуть-чуть";
        else if (close > 0.5) radioStatus.textContent = "Сквозь шум пробивается его голос…";
        else radioStatus.textContent = RADIO_CFG.tuneStatus || "Шум… ищи его частоту";
      }
      updateRadioAudio(close);
      if (fromUser && inR) {
        if (!radioLockTimer) radioLockTimer = setTimeout(() => lockRadio(), FAST ? 220 : 700);
      } else if (!inR && radioLockTimer) {
        clearTimeout(radioLockTimer); radioLockTimer = 0;
      }
    }

    function drawRadioWave(now) {
      if (!radioWave || !radioWaveCtx) return;
      const w = radioWave.width, h = radioWave.height;
      radioWaveCtx.fillStyle = "#031018";
      radioWaveCtx.fillRect(0, 0, w, h);
      const close = radioCloseness();
      const t = (now || performance.now()) / 1000;
      const mid = h / 2;
      radioWaveCtx.beginPath();
      radioWaveCtx.lineWidth = 2;
      const alpha = 0.35 + close * 0.65;
      radioWaveCtx.strokeStyle = "rgba(120, 230, 215, " + alpha + ")";
      for (let x = 0; x <= w; x += 2) {
        const nx = x / w;
        const signal = Math.sin((nx * 10 + t * (1.4 + close * 2.2)) * Math.PI * 2);
        const noise = (Math.sin(nx * 73.1 + t * 31) * 0.5 + Math.sin(nx * 191 + t * 47) * 0.35 + (Math.random() - 0.5) * 0.55);
        const y = mid + (signal * close + noise * (1 - close)) * (h * 0.38);
        if (x === 0) radioWaveCtx.moveTo(x, y); else radioWaveCtx.lineTo(x, y);
      }
      radioWaveCtx.stroke();
      if (close > 0.7) {
        radioWaveCtx.beginPath();
        radioWaveCtx.strokeStyle = "rgba(200, 255, 245, " + ((close - 0.7) / 0.3 * 0.45) + ")";
        radioWaveCtx.lineWidth = 1;
        for (let x = 0; x <= w; x += 3) {
          const y = mid + Math.sin((x / w * 10 + t * 3.6) * Math.PI * 2) * (h * 0.22) * close;
          if (x === 0) radioWaveCtx.moveTo(x, y); else radioWaveCtx.lineTo(x, y);
        }
        radioWaveCtx.stroke();
      }
    }
    function radioWaveLoop(now) {
      drawRadioWave(now);
      if (radioTune && radioTune.classList.contains("on")) radioWaveRaf = requestAnimationFrame(radioWaveLoop);
      else radioWaveRaf = 0;
    }

    function startRadioAudio() {
      if (radioAudio || params.get("mute") === "1") return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try {
        const ac = new AC();
        const n = ac.sampleRate * 1.2;
        const buf = ac.createBuffer(1, n, ac.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
        const noise = ac.createBufferSource();
        noise.buffer = buf; noise.loop = true;
        const noiseGain = ac.createGain(); noiseGain.gain.value = 0.04;
        const filter = ac.createBiquadFilter();
        filter.type = "bandpass"; filter.frequency.value = 900; filter.Q.value = 1;
        const osc = ac.createOscillator();
        osc.type = "sine"; osc.frequency.value = 392;
        const oscGain = ac.createGain(); oscGain.gain.value = 0;
        noise.connect(filter); filter.connect(noiseGain); noiseGain.connect(ac.destination);
        osc.connect(oscGain); oscGain.connect(ac.destination);
        noise.start(); osc.start();
        radioAudio = { ac, noise, osc, noiseGain, oscGain, filter };
        if (ac.state === "suspended") ac.resume().catch(() => {});
      } catch (e) { radioAudio = null; }
    }
    function updateRadioAudio(close) {
      if (!radioAudio) return;
      const now = radioAudio.ac.currentTime;
      radioAudio.noiseGain.gain.setTargetAtTime(0.045 * (1 - close * 0.92), now, 0.05);
      radioAudio.oscGain.gain.setTargetAtTime(0.012 + close * 0.045, now, 0.05);
      radioAudio.filter.Q.setTargetAtTime(1 + close * 10, now, 0.08);
    }
    function stopRadioAudio() {
      if (!radioAudio) return;
      try {
        radioAudio.noise.stop(); radioAudio.osc.stop();
        if (radioAudio.ac.state !== "closed") radioAudio.ac.close();
      } catch (e) {}
      radioAudio = null;
    }

    function freqFromEvent(e) {
      const ev = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e;
      const r = radioTrack.getBoundingClientRect();
      return pctToFreq((ev.clientX - r.left) / Math.max(1, r.width));
    }
    function onRadioPointer(e) {
      if (!radioTune || !radioTune.classList.contains("on") || radioDone) return;

    }
    if (radioTrack) {
      radioTrack.addEventListener("pointerdown", (e) => { radioTrack.setPointerCapture(e.pointerId); onRadioPointer(e); });
      radioTrack.addEventListener("pointermove", (e) => { if (radioDragging) { e.preventDefault(); setRadioFreq(freqFromEvent(e), true); } });
      const up = () => { radioDragging = false; };
      radioTrack.addEventListener("pointerup", up);
      radioTrack.addEventListener("pointercancel", up);
      radioTrack.addEventListener("keydown", (e) => {
        const step = (e.shiftKey ? 0.2 : 1.0);

        if (e.key === "ArrowRight" || e.key === "ArrowUp") { e.preventDefault(); setRadioFreq(radioFreq + step, true); }

    }
    if (radioLock) radioLock.addEventListener("click", (e) => { e.stopPropagation(); lockRadio(); });

    function closeRadioTune() {
      if (radioLockTimer) { clearTimeout(radioLockTimer); radioLockTimer = 0; }
      if (radioWaveRaf) { cancelAnimationFrame(radioWaveRaf); radioWaveRaf = 0; }

    function openRadioTune() {

    }

    function lockRadio() {
      if (radioDone) return;

    /* ----- фонарик: вход в пещеру ----- */
    const caveSearch = document.getElementById("caveSearch");
    const caveEntrance = document.getElementById("caveEntrance");
    const caveHudLine = document.getElementById("caveHudLine");
    const CAVE_CFG = SUB.CAVE || {};
    let caveX = 50, caveY = 45, caveHintTimer = 0, caveDwell = 0, caveRaf = 0, caveSearching = false;

    function cavePos() {
      return { x: Number(CAVE_CFG.x) || 72, y: Number(CAVE_CFG.y) || 68 };
    }
    function setCaveBeam(px, py) {
      if (!caveSearch) return;
      const r = caveSearch.getBoundingClientRect();
      caveX = clamp(((px - r.left) / Math.max(1, r.width)) * 100, 0, 100);
      caveY = clamp(((py - r.top) / Math.max(1, r.height)) * 100, 0, 100);

      caveSearch.style.setProperty("--ly", caveY + "%");

    function caveHitRadius() {
      const base = Number(CAVE_CFG.radius) || 8;
      return base;
    }
    function caveDistance() {
      const p = cavePos();
      const dx = caveX - p.x, dy = caveY - p.y;
      return Math.sqrt(dx * dx + dy * dy);
    }
    function updateCaveLit() {
      if (!caveEntrance || !caveSearching) return;
      const near = caveDistance() <= caveHitRadius();
      caveEntrance.classList.toggle("lit", near);

      const hintMs = (params.get("cavehint") === "1") ? 800 : (FAST ? Math.min(Number(CAVE_CFG.hintAfterMs) || 20000, 2500) : (Number(CAVE_CFG.hintAfterMs) || 20000));
      caveHintTimer = setTimeout(showCaveHint, hintMs);

    function findCave() {

    /* ----- левиафан ----- */
    function buildLeviathan() {
      levi.innerHTML = "";
      const canvas = document.createElement("canvas");
      canvas.className = "levi-canvas";
      levi.appendChild(canvas);
      const img = new Image();
      img.src = LEVI_SRC;
      levi._canvas = canvas;
      levi._img = img;
    }
    function drawLeviathan(now) {
      const canvas = levi._canvas;
      const img = levi._img;
      if (!canvas || !img || !img.naturalWidth) return;
      const w = levi.clientWidth || Math.min(cssW || window.innerWidth, 1320);
      const h = w * (img.naturalHeight / img.naturalWidth);
      const pad = h * 0.18;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const cw = Math.max(1, Math.round(w * dpr));
      const ch = Math.max(1, Math.round((h + pad * 2) * dpr));
      if (canvas.width !== cw || canvas.height !== ch) {
        canvas.width = cw;
        canvas.height = ch;
        canvas.style.width = w + "px";
        canvas.style.height = (h + pad * 2) + "px";
      }
      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h + pad * 2);
      const slices = Math.max(90, Math.floor(w / 3));
      const sw = img.naturalWidth / slices;
      const dw = w / slices;
      const amp = h * 0.045;
      const overlap = 1.25;
      for (let i = 0; i < slices; i++) {
        const y = pad + Math.sin(now / 480 + i * 0.07) * amp;
        const sx = Math.max(0, i * sw - overlap);
        const sww = Math.min(img.naturalWidth - sx, sw + overlap * 2);
        const dx = i * dw - overlap * (dw / sw);
        ctx.drawImage(img, sx, 0, sww, img.naturalHeight, dx, y, sww * (dw / sw), h);
      }
      ctx.save();
      ctx.globalCompositeOperation = "source-atop";
      const haze = ctx.createLinearGradient(0, 0, 0, h + pad * 2);
      haze.addColorStop(0, "rgba(18, 60, 110, 0.32)");
      haze.addColorStop(1, "rgba(8, 28, 70, 0.42)");
      ctx.fillStyle = haze;
      ctx.fillRect(0, 0, w, h + pad * 2);
      ctx.restore();
    }
    function startLeviathan() {
      if (leviDone) { afterGate(); return; }
      startLeviGame();
    }

    let leviPlaying = false, leviHidden = false, leviDrag = false;
    let leviDx = 50, leviDy = 46, leviT0 = 0, leviDur = 16000;
    let leviAudio = null;

    function leviCfg() { return SUB.LEVIATHAN || {}; }
    function leviStartPos() {
      const s = leviCfg().start || {};
      return { x: s.x != null ? s.x : 50, y: s.y != null ? s.y : 46 };
    }
    function leviHideList() {
      return (leviCfg().hides && leviCfg().hides.length) ? leviCfg().hides : [
        { x: 14, y: 66, type: "crevice" },
        { x: 50, y: 82, type: "kelp" },
        { x: 86, y: 62, type: "crevice" }
      ];

    function setDiverPos(x, y) {

        leviDiver.style.left = leviDx + "%";

      }
    }
    function hideRadius() {
      const r = leviCfg().hideRadius;
      return r != null ? Number(r) : 16;
    }
    function nearestHide() {
      let best = null, bestD = 1e9;
      leviHideList().forEach((h, i) => {
        const d = Math.hypot(leviDx - h.x, leviDy - h.y);
        if (d < bestD) { bestD = d; best = { i, h, d }; }
      });
      return best;
    }
    function updateHideHighlight() {
      if (!leviHides) return;
      const n = nearestHide();
      const r = hideRadius();
      [...leviHides.children].forEach((el, i) => {
        el.classList.toggle("near", !!(n && n.i === i && n.d <= r && !leviHidden));

    function startLeviAudio() {

      try {
        const ac = new AC();
        const osc = ac.createOscillator();
        osc.type = "sawtooth"; osc.frequency.value = 55;
        const g = ac.createGain(); g.gain.value = 0.0001;
        const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 180;
        osc.connect(f); f.connect(g); g.connect(ac.destination);
        osc.start();
        const now = ac.currentTime;
        g.gain.exponentialRampToValueAtTime(0.06, now + 0.15);
        g.gain.exponentialRampToValueAtTime(0.018, now + 1.6);
        leviAudio = { ac, osc, g };
        if (ac.state === "suspended") ac.resume().catch(() => {});
      } catch (e) { leviAudio = null; }
    }

    function leviProgress(now) {

    function tickLeviGame(now) {
      if (!leviPlaying || leviDone) { leviRaf = 0; return; }
      const p = leviProgress(now);
      const left = Math.max(0, Math.ceil((leviDur - (now - leviT0)) / 1000));
      if (leviTimerEl) {
        leviTimerEl.textContent = "0:" + String(left).padStart(2, "0");
        leviTimerEl.classList.toggle("low", left <= 5);
      }
      const vw = cssW || window.innerWidth;
      const lw = levi.offsetWidth || Math.min(vw * 1.4, 1600);
      // Enters quickly, sweeps across most of the timer
      const enter = clamp((p - 0.06) / 0.88, 0, 1);
      const x = -lw * 0.95 + enter * (vw + lw * 1.1);
      const bob = Math.sin(now / 900) * 10;
      levi.style.transform = "translate(" + x + "px, " + bob + "px)";
      const vis = clamp((p - 0.04) / 0.08, 0, 1);
      levi.style.opacity = p > 0.92 ? String(1 - (p - 0.92) / 0.08) : String(0.92 * vis);
      drawLeviathan(now);
      const mid = enter > 0.12 && enter < 0.88;
      if (leviShake) leviShake.classList.toggle("shaking", mid);
      if (diverInLeviSweep(x, lw, vw) && !leviHidden) {
        failLeviGame();
        return;

      if (p >= 1) {
        if (leviHidden) succeedLeviGame();

    function diverInLeviSweep(leviX, lw, vw) {
      if (!leviDiver || !levi) return false;
      const dr = leviDiver.getBoundingClientRect();
      const lr = levi.getBoundingClientRect();
      if (lr.width < 8 || dr.width < 4) return false;
      // body hitbox: shrink the sprite, mid band
      const hit = {
        left: lr.left + lr.width * 0.12,
        right: lr.left + lr.width * 0.88,
        top: lr.top + lr.height * 0.22,
        bottom: lr.top + lr.height * 0.78
      };
      const cx = dr.left + dr.width / 2, cy = dr.top + dr.height / 2;
      return cx > hit.left && cx < hit.right && cy > hit.top && cy < hit.bottom;
    }
    function failLeviGame() {

    function diverFromEvent(e) {

        index = 0;
      } else if (RADIO_DEBUG) {
        index = (SUB.RADIO && SUB.RADIO.loc != null) ? SUB.RADIO.loc : 2;
      } else if (LEVI_DEBUG) {
        index = (SUB.LEVIATHAN && SUB.LEVIATHAN.loc != null) ? SUB.LEVIATHAN.loc : 5;
        subQuestions().forEach((q) => { if (q.loc != null && q.loc < index) markQDone(q); });
        syncQFlags();
      } else if (CAVE_DEBUG) {
        index = caveLoc();
        subQuestions().forEach((q) => { if (q.loc != null && q.loc <= index) markQDone(q); });
        syncQFlags();
      } else if (GLOW_DEBUG) {
        index = heartLoc();
        subQuestions().forEach(markQDone);
        syncQFlags();
        glowPending = true;
      } else if (Q_DEBUG >= 1 && !(parseInt(params.get("loc") || "", 10) >= 0)) {
        const list = subQuestions();
        const qi = Math.min(Q_DEBUG, list.length) - 1;
        const qJump = list[qi];
        if (qJump && qJump.loc != null) index = qJump.loc;
        list.slice(0, Math.max(0, qi)).forEach(markQDone);
        syncQFlags();
      } else if (START_LOC > 0) {
        index = START_LOC;
      }
      const jump = index > 0 || Q_DEBUG || RADIO_DEBUG || CAVE_DEBUG || LEVI_DEBUG || GLOW_DEBUG || CURRENT_DEBUG || REUNION_DEBUG || SEAMOTH_DEBUG;
      if (jump || INTRO_DEBUG) {
        if (SUB.REPAIR && (index > SUB.REPAIR.loc || Q_DEBUG || RADIO_DEBUG || CAVE_DEBUG || LEVI_DEBUG || GLOW_DEBUG || CURRENT_DEBUG || REUNION_DEBUG || SEAMOTH_DEBUG)) repairDone = true;
        if (SUB.RADIO && (index > SUB.RADIO.loc || (Q_DEBUG && index === SUB.RADIO.loc) || ((CAVE_DEBUG || LEVI_DEBUG || GLOW_DEBUG || REUNION_DEBUG) && index >= SUB.RADIO.loc))) radioDone = true;
        if (SUB.PHOTO && index > SUB.PHOTO.loc) photoDone = true;
        if (SUB.LEVIATHAN && index > SUB.LEVIATHAN.loc) { leviDone = true; leviQDone = true; }
        if ((Q_DEBUG || CAVE_DEBUG || REUNION_DEBUG) && SUB.LEVIATHAN && index === SUB.LEVIATHAN.loc) leviDone = true;
        if (LEVI_DEBUG) { leviDone = false; caveDone = false; }
        if (index > heartLoc() || (Q_DEBUG && index === heartLoc()) || GLOW_DEBUG || REUNION_DEBUG) caveDone = true;
        if (index > heartLoc()) heartQDone = true;
        if (CAVE_DEBUG) { leviDone = true; leviQDone = true; caveDone = false; }
        if (!INTRO_DEBUG && (index > 0 || Q_DEBUG || RADIO_DEBUG || CAVE_DEBUG || LEVI_DEBUG || GLOW_DEBUG || CURRENT_DEBUG || REUNION_DEBUG || SEAMOTH_DEBUG)) introDone = true;
        if (!CURRENT_DEBUG && (index > currentLoc() || RADIO_DEBUG || CAVE_DEBUG || LEVI_DEBUG || GLOW_DEBUG || REUNION_DEBUG || SEAMOTH_DEBUG || (Q_DEBUG && index > currentLoc()) || (Q_DEBUG && index === currentLoc() && Q_DEBUG > 1))) currentDone = true;
        if (GLOW_DEBUG || index > heartLoc()) reunionDone = true;
        if (!SEAMOTH_DEBUG && locDepth(index) >= seamothDepth() && index > seamothEntryLoc()) seamothDone = true;
        if (SEAMOTH_DEBUG) seamothDone = false;
        syncQFlags();
        syncDivePair();
      }
      layerCurrent.src = images[index].src;
      applyLayer(layerCurrent, 0, 0, 1, 1, 1);
      applyLayer(layerNext, 16, 0, 1, 0, 1);
      setDepth(LOCS[index].depth);
      boot.classList.add("gone");
      if (window.QuestHUD) QuestHUD.setStep("loc" + (index + 1));
      setTimeout(() => boot.remove(), 600);
      document.documentElement.dataset.ready = "1";
      document.documentElement.dataset.index = String(index);
      document.documentElement.dataset.busy = "0";
      window.__ready = true;
      window.__goNext = goNext;
      window.__subnautica = {
        get state() { return { index, locReady, oxygen, repairDone, radioDone, photoDone, leviDone, leviQDone, heartQDone, caveDone, introDone, currentDone, reunionDone, seamothDone, inSeamoth: inSeamoth(), inCave: inCaveSpace(), together: !currentDone || reunionDone, radioFreq, leviPlaying, leviHidden, scanned: Object.assign({}, scanned) }; },
        story: { playIntro, playCurrent: playCurrentEvent, playReunion, showCard: showEventCard },
        completeGate: forceComplete,
        spawnBubble: spawnAirBubble,
        radio: { target: FREQ_TARGET, min: FREQ_MIN, max: FREQ_MAX, closeness: radioCloseness, inRange: radioInRange, setFreq: setRadioFreq },
        cave: { pos: cavePos, find: findCave, hint: showCaveHint, setBeam: setCaveBeam },
        levi: {
          hides: leviHideList,
          fail: failLeviGame,
          retry: retryLeviGame,
          succeed: succeedLeviGame,
          setDiver: setDiverPos,
          tryHide: tryHide,
          get pos() { return { x: leviDx, y: leviDy, hidden: leviHidden, playing: leviPlaying }; }
        },
        get beam() { return { x: caveX, y: caveY, dist: caveDistance() }; },
        startGlow: startHeartTeleport,
        glowDone: false
      };
      const titleReady = (window.WorldTitle && WorldTitle.whenReady()) || Promise.resolve();
      await titleReady;
      await onArrive(index);
      startOxygen();
      if (GLOW_DEBUG) {
        setTimeout(() => startHeartTeleport(), FAST ? 200 : 700);
      }

      if (AUTO) {
        const run = async () => {
          while (index < LOCS.length - 1) {
            forceComplete();
            await new Promise((r) => setTimeout(r, FAST ? 200 : PAUSE_MS));
            if (!goNext()) break;
            await new Promise((r) => {
              const iv = setInterval(() => {
                if (!busy) { clearInterval(iv); r(); }
              }, 40);
            });
          }
          document.documentElement.dataset.autoDone = "1";
        };
        run();
      }
    }

    main().catch((err) => {
      console.error(err);
      boot.style.background = "#02060c";
    });
  </script>
</body>
