<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='8' width='12' height='4' fill='%23a8804b'/%3E%3Crect y='12' width='16' height='4' fill='%233f76e4'/%3E%3C/svg%3E">
<link rel="preload" as="image" href="bg_sea.jpg"><link rel="preload" as="image" href="pair_a.png"><link rel="preload" as="image" href="pair_b.png">
<style>
  /* Переход Майнкрафт → Сабнавтика (15.11, v2): Вика и Женя плывут на лодке (Женя гребёт), в конце — спасательная капсула.
     Картинки в стиле мира Майна (как bg_stage*.jpg): bg_sea.jpg (бесшовный по горизонтали), pair_a/pair_b.png (два кадра гребка),
     pod.png, island1-3.png. Слои с параллаксом; вода, блики, брызги и след — в canvas. Старая пиксельная версия: index_pixel_old.html.
     Длительность и музыка — QUEST_CONFIG.BOAT (как SKY). Отладка: boat/index.html?fast=1 — ×4 быстрее, без музыки. */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #7fb3ec; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  #scene { position: fixed; inset: 0; overflow: hidden; }
  .tile { position: absolute; top: 0; height: 100%; will-change: transform; }
  .island { position: absolute; left: 0; top: 0; will-change: transform; filter: saturate(.85) brightness(1.04) drop-shadow(0 2px 2px rgba(0, 40, 90, .15)); }
  #water { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .clip { position: absolute; left: 0; top: 0; will-change: transform; }
  .clip img { position: absolute; left: 0; top: 0; width: 100%; height: auto; display: block; transition: none; }
  #boat { clip-path: polygon(0 0, 100% 0, 100% 86.5%, 66% 92.5%, 15% 84%, 0 83.5%); }
  #pod { clip-path: inset(0 0 12% 0); }
  #fxTop { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #warm { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(255, 170, 110, .35), rgba(255, 200, 140, .12) 55%, rgba(255, 150, 90, .1)); opacity: 0; mix-blend-mode: soft-light; }
  .veil { position: fixed; inset: 0; z-index: 8; pointer-events: none; background: #0b1020; opacity: 1; transition: opacity 1.4s ease; }
  .veil.off { opacity: 0; }
  .veil.half { opacity: .45; }
  .caption { position: fixed; left: 50%; top: calc(18px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 7; pointer-events: none; text-align: center;
    font: 700 clamp(16px, 2.2vw, 24px)/1.25 "Courier New", "DejaVu Sans Mono", monospace; color: #fff; text-shadow: 2px 2px 0 #3f3f3f; opacity: 0; transition: opacity 1.2s ease; width: min(92vw, 640px); }
  .caption.on { opacity: 1; }
  .tap-start { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 9; display: none; padding: 14px 24px; cursor: pointer;
    font: 700 19px/1.2 "Courier New", "DejaVu Sans Mono", monospace; color: #fff; text-shadow: 2px 2px 0 #3f3f3f; background: #8b8b8b; border: 3px solid #1b1b1b; box-shadow: inset 3px 3px 0 #c6c6c6, inset -3px -3px 0 #555; }
  .tap-start.show { display: block; animation: tapPulse 1.6s ease-in-out infinite; }
  @keyframes tapPulse { 50% { transform: translate(-50%, -50%) scale(1.05); } }
  .skip { position: fixed; z-index: 9; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(66px + env(safe-area-inset-bottom, 0px));
    padding: 7px 14px; border: 2px solid rgba(20, 20, 20, .6); background: rgba(139, 139, 139, .55); color: #fff; font: 700 14px/1.2 "Courier New", "DejaVu Sans Mono", monospace;
    text-shadow: 1px 1px 0 #333; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity .8s ease; touch-action: manipulation; }
  .skip.show { opacity: .8; pointer-events: auto; }
  .skip.show:hover { opacity: 1; }
  @media (max-width: 600px) { .skip { right: calc(10px + env(safe-area-inset-right, 0px)); bottom: calc(58px + env(safe-area-inset-bottom, 0px)); font-size: 13px; padding: 6px 11px; } }
  .mute { position: fixed; z-index: 9; left: calc(12px + env(safe-area-inset-left, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); width: 38px; height: 38px; display: none;
    align-items: center; justify-content: center; padding: 0; border: 2px solid rgba(20, 20, 20, .6); background: rgba(139, 139, 139, .55); cursor: pointer; touch-action: manipulation; }
  .mute.show { display: flex; }
  .mute svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: square; }
  .mute .off { display: none; } .mute.muted .on { display: none; } .mute.muted .off { display: inline; }
  /* окно подтверждения — в стиле КПК Сабнавтики (следующий мир) */
  .confirm { position: fixed; inset: 0; z-index: 12; display: flex; align-items: flex-end; justify-content: center; padding: 20px 20px calc(78px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(180deg, transparent 45%, rgba(2, 12, 24, .45));
    opacity: 0; pointer-events: none; transition: opacity .6s ease; }
  .confirm.show { opacity: 1; pointer-events: auto; }
  .pda { width: min(420px, 100%); padding: 22px 22px 20px; text-align: center; color: #dff9ff; border: 1.5px solid rgba(90, 230, 255, .8); border-radius: 14px;
    background: linear-gradient(180deg, rgba(8, 38, 58, .92), rgba(4, 20, 36, .94)); box-shadow: 0 0 30px rgba(60, 200, 255, .45), inset 0 0 22px rgba(60, 200, 255, .18);
    font-family: "Segoe UI", "Noto Sans", system-ui, sans-serif; transform: translateY(14px) scale(.96); transition: transform .6s cubic-bezier(.2, 1.4, .4, 1); }
  .confirm.show .pda { transform: none; }
  .pda .tag { font-size: 12px; letter-spacing: .28em; color: #5ae6ff; margin-bottom: 10px; }
  .pda h2 { margin: 0 0 6px; font-size: 24px; font-weight: 600; }
  .pda p { margin: 0 0 18px; font-size: 14px; color: #a9dbe8; }
  .pda button { appearance: none; cursor: pointer; min-width: 170px; padding: 12px 26px; font: 600 16px/1 "Segoe UI", system-ui, sans-serif; letter-spacing: .08em; color: #04202e;
    background: linear-gradient(180deg, #8ff1ff, #3cc8ef); border: 0; border-radius: 999px; box-shadow: 0 0 18px rgba(90, 230, 255, .7); }
  .pda button:hover { filter: brightness(1.08); }
</style>

</head>
<body>
<div id="scene">
  <img class="tile" id="t0" src="bg_sea.jpg" alt=""><img class="tile" id="t1" src="bg_sea.jpg" alt=""><img class="tile" id="t2" src="bg_sea.jpg" alt="">
  <img class="island" id="i0" src="island1.png" alt=""><img class="island" id="i1" src="island2.png" alt=""><img class="island" id="i2" src="island3.png" alt="">
  <canvas id="water"></canvas>
  <div class="clip" id="pod"><img src="pod.png" alt="Капсула"></div>
  <div class="clip" id="boat"><img id="fa" src="pair_a.png" alt="Вика и Женя в лодке"><img id="fb" src="pair_b.png" alt="" style="opacity:0"></div>
  <canvas id="fxTop"></canvas>
  <div id="warm"></div>
</div>
<div class="caption" id="caption">К новому миру — вместе</div>
<div class="veil" id="veil"></div>
<button type="button" class="skip" id="skipBtn">Пропустить ›</button>
<button type="button" class="mute" id="muteBtn" aria-label="Звук"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#fff" stroke="none"/><path class="on" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="off" d="M17 9l5 6M22 9l-5 6"/></svg></button>
<div class="tap-start" id="tapStart">Коснись, чтобы поплыть ⛵</div>
<div class="confirm" id="confirm"><div class="pda">
  <div class="tag">СПАСАТЕЛЬНАЯ КАПСУЛА</div>
  <h2>Заходим в капсулу?</h2>
  <p>Впереди — подводный мир.</p>
  <button type="button" id="enterBtn">Заходим</button>
</div></div>
<script>
(function () {
  "use strict";
  const CFG = (window.QUEST_CONFIG && window.QUEST_CONFIG.BOAT) || {};
  const FAST = /[?&]fast=1/.test(location.search);
  const SPEED = FAST ? 4 : 1;
  const ENTER = CFG.ENTER_MS || 1800, ARRIVE = CFG.ARRIVE_MS || 4500;
  let FADE = CFG.FADE_MS || 3000, SAIL = CFG.SAIL_MS || 22000, skipped = false;
  const T = {};
  function setTimeline() { if (skipped) return; T.enter = ENTER; T.arrive = ENTER + SAIL; T.end = T.arrive + ARRIVE; }
  setTimeline();

  const $ = (id) => document.getElementById(id);
  const tiles = [$("t0"), $("t1"), $("t2")], isl = [$("i0"), $("i1"), $("i2")];
  const water = $("water"), wctx = water.getContext("2d"), fx = $("fxTop"), fctx = fx.getContext("2d");
  const boat = $("boat"), fa = $("fa"), fb = $("fb"), pod = $("pod"), warm = $("warm");
  const BG_AR = 1060 / 720, PAIR_AR = 620 / 747, POD_AR = 557 / 335, ISL = [[396, 225], [401, 197], [400, 189]];

  let W, H, dpr, portrait, HOR, WL, tileW, L = {};
  function resize() {
    W = innerWidth; H = innerHeight; portrait = H > W * 1.1; dpr = Math.min(2, devicePixelRatio || 1);
    [water, fx].forEach((c) => { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); });
    wctx.setTransform(dpr, 0, 0, dpr, 0, 0); fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    /* фон: по высоте (горизонт картинки на 50%); на очень широких — по ширине */
    let th = H; tileW = th * BG_AR; if (tileW * 2 < W) { tileW = W / 2; th = tileW / BG_AR; }
    tiles.forEach((t) => { t.style.height = th + "px"; t.style.width = tileW + "px"; });
    HOR = th * 0.5;
    WL = portrait ? H * 0.6 : H * 0.74;                                       /* ватерлиния лодки */
    L.bw = portrait ? Math.min(W * 0.74, H * 0.36 / PAIR_AR) : Math.min(W * 0.36, H * 0.6 / PAIR_AR);
    L.bh = L.bw * PAIR_AR;
    L.ph = L.bh * (portrait ? 0.9 : 0.95); L.pw = L.ph / POD_AR;
    L.podWL = WL - H * 0.035;                                                 /* капсула чуть дальше — выше и меньше */
    L.sailX = portrait ? W * 0.5 : W * 0.4;                                    /* центр лодки в пути */
    L.endX = portrait ? W * 0.36 : W * 0.4;                                    /* центр лодки в конце */
    L.podEnd = Math.min(W - L.pw * 0.5 - 6, L.endX + L.bw * 0.43 + L.pw * 0.42);
    boat.style.width = L.bw + "px"; boat.style.height = L.bh + "px";
    pod.style.width = L.pw + "px"; pod.style.height = L.ph + "px";
    L.ih = (portrait ? H * 0.075 : H * 0.12);
    isl.forEach((im, i) => { im.style.height = L.ih * (i === 1 ? 0.9 : 1) + "px"; im.style.width = L.ih * (i === 1 ? 0.9 : 1) * ISL[i][0] / ISL[i][1] + "px"; });
  }

  /* ---------- состояние ---------- */
  let scroll = 0, clock = 0, last = null, doneShown = false, started = false;
  const streaks = [], splash = [], wake = [], glints = [];
  const islX = [0.15, 0.62, 1.2];
  for (let i = 0; i < 70; i++) streaks.push({ x: Math.random(), y: Math.random(), l: 0.4 + Math.random() * 0.6, a: 0.3 + Math.random() * 0.5 });
  const smooth = (x) => x * x * (3 - 2 * x), clamp = (v) => Math.max(0, Math.min(1, v));

  function frame(now) {
    if (last == null) last = now;
    const rdt = Math.min(50, now - last), dt = rdt * SPEED; last = now;
    if (audio && !skipped && !audio.paused && !audio.ended && audio.currentTime !== lastAT) { lastAT = audio.currentTime; clock = lastAT * 1000; } else clock += dt;
    const t = clock;
    if (audio && !audio.paused) { const left = T.end - t; audio.volume = Math.max(0, Math.min(1, left / FADE)); if (left <= 0) audio.pause(); }
    skipBtn.classList.toggle("show", !skipped && t > T.enter + 400 && t < T.arrive);
    const arr = clamp((t - T.arrive) / (T.end - T.arrive)), ea = 1 - Math.pow(1 - arr, 3);
    const v = (1 - smooth(arr)) * clamp(t / 1200 + 0.3);                     /* скорость (0…1): старт → плывём → тормозим у капсулы */
    scroll += v * dt * H * 0.00016;

    /* фон (бесшовные плитки) — медленно */
    const bgOff = -((scroll * 0.25) % tileW);
    tiles.forEach((tl, i) => { tl.style.transform = "translateX(" + (bgOff + i * tileW - 1 * i) + "px)"; });
    /* острова — средний план */
    isl.forEach((im, i) => {
      const w = parseFloat(im.style.width), span = W + w + W * 0.6;
      const x = (((islX[i] * span - scroll * 0.55) % span) + span) % span - w;
      im.style.transform = "translate(" + x + "px," + (HOR - parseFloat(im.style.height) * 0.93) + "px)";
    });
    warm.style.opacity = (Math.min(1, t / T.end) * 0.9).toFixed(3);

    /* лодка: покачивание, гребок = резкая смена двух кадров (без кроссфейда:
       иначе весло и голова Жени видны в двух позах сразу и оставляют шлейф) */
    const rowing = t > 300 && arr < 0.8;
    const ph = rowing ? t / 1700 * Math.PI * 2 : 0;
    const useB = rowing && Math.sin(ph) > 0;
    fa.style.opacity = useB ? "0" : "1";
    fb.style.opacity = useB ? "1" : "0";
    const surge = rowing ? Math.sin(ph - 0.6) * W * 0.004 : 0;
    const bob = Math.sin(t / 900) * H * 0.006, rot = Math.sin(t / 1300) * 0.9;
    const cx = L.sailX + (L.endX - L.sailX) * ea + surge;
    const bx = cx - L.bw / 2, by = WL - L.bh * 0.87 + bob;
    boat.style.transform = "translate(" + bx + "px," + by + "px) rotate(" + rot + "deg)";
    /* капсула приплывает справа */
    let podX = null;
    if (t > T.arrive - 400) {
      podX = W + L.pw * 0.7 + (L.podEnd - W - L.pw * 0.7) * ea;
      const pb = Math.sin(t / 1100 + 1.3) * H * 0.005;
      pod.style.transform = "translate(" + (podX - L.pw / 2) + "px," + (L.podWL - L.ph * 0.88 + pb) + "px)";
      pod.style.opacity = "1";
    } else pod.style.opacity = "0";

    /* ---------- вода: бегущие волны, блики ---------- */
    wctx.clearRect(0, 0, W, H);
    const hz = HOR + 2;
    for (const s of streaks) {
      const d = s.y, y = hz + (H - hz) * (d * d * 0.95 + 0.02);
      const sp = 0.25 + d * 1.8, len = (8 + d * 60) * s.l;
      s.x -= (v * sp * 0.00006 + 0.000006) * dt * (1 + d);
      if (s.x < -0.1) { s.x = 1.1; s.y = Math.random(); }
      const x = s.x * W, a = s.a * (0.25 + d * 0.5) * (0.6 + 0.4 * Math.sin(t / 700 + s.y * 20));
      wctx.strokeStyle = "rgba(235,246,255," + a.toFixed(3) + ")"; wctx.lineWidth = 1 + d * 2.2; wctx.lineCap = "round";
      wctx.beginPath(); wctx.moveTo(x, y); wctx.quadraticCurveTo(x + len / 2, y - 1 - d * 2, x + len, y); wctx.stroke();
    }
    /* солнечные искорки слева (там солнце на фоне) */
    if (Math.random() < 0.5) glints.push({ x: W * (0.02 + Math.random() * 0.22), y: hz + (H - hz) * Math.random() * 0.8, a: 1, r: 1 + Math.random() * 2 });
    for (let i = glints.length - 1; i >= 0; i--) { const g = glints[i]; g.a -= 0.0016 * dt; g.x -= v * dt * 0.02; if (g.a <= 0) { glints.splice(i, 1); continue; }
      wctx.fillStyle = "rgba(255,252,230," + (g.a * 0.9).toFixed(3) + ")"; wctx.beginPath(); wctx.arc(g.x, g.y, g.r * (0.5 + g.a), 0, 6.283); wctx.fill(); }
    /* тень/отражение под лодкой и капсулой */
    const shadow = (x, y, w, a) => { const gr = wctx.createRadialGradient(x, y, 1, x, y, w / 2); gr.addColorStop(0, "rgba(20,50,110," + a + ")"); gr.addColorStop(1, "rgba(20,50,110,0)"); wctx.fillStyle = gr; wctx.save(); wctx.translate(x, y); wctx.scale(1, 0.18); wctx.translate(-x, -y); wctx.beginPath(); wctx.arc(x, y, w / 2, 0, 6.283); wctx.fill(); wctx.restore(); };
    shadow(cx + L.bw * 0.08, WL + L.bh * 0.03 + bob, L.bw * 1.05, 0.35);
    if (podX != null) shadow(podX, L.podWL + L.ph * 0.01, L.pw * 1.4, 0.3);

    /* ---------- поверх: пена у корпуса, след, брызги весла ---------- */
    fctx.clearRect(0, 0, W, H);
    const P = (fx_, fy_) => ({ x: bx + L.bw * fx_, y: by + L.bh * fy_ });
    const foam = (pts, a) => { fctx.save(); fctx.filter = "blur(" + Math.max(1.5, L.bh * 0.006).toFixed(1) + "px)"; fctx.strokeStyle = "rgba(240,250,255," + a + ")"; fctx.lineWidth = Math.max(3, L.bh * 0.022); fctx.lineCap = "round"; fctx.lineJoin = "round"; fctx.beginPath();
      pts.forEach((p, i) => { const q = P(p[0], p[1] + Math.sin(t / 260 + i * 1.7) * 0.004); i ? fctx.lineTo(q.x, q.y) : fctx.moveTo(q.x, q.y); }); fctx.stroke(); fctx.restore(); };
    foam([[0.16, 0.842], [0.4, 0.885], [0.66, 0.927], [0.8, 0.902], [0.99, 0.866]], (0.18 + v * 0.22).toFixed(2));
    if (v > 0.15 && Math.random() < 0.7) { const s = P(0.13 + Math.random() * 0.05, 0.84 + Math.random() * 0.02); wake.push({ x: s.x, y: s.y, a: 0.8, r: 2 + Math.random() * 3 }); }
    for (let i = wake.length - 1; i >= 0; i--) { const w = wake[i]; w.x -= v * dt * H * 0.00018 + dt * 0.01; w.a -= 0.0009 * dt; w.r += 0.004 * dt; if (w.a <= 0) { wake.splice(i, 1); continue; }
      fctx.fillStyle = "rgba(240,250,255," + (w.a * 0.5).toFixed(3) + ")"; fctx.beginPath(); fctx.ellipse(w.x, w.y, w.r * 1.8, w.r * 0.5, 0, 0, 6.283); fctx.fill(); }
    /* брызги: весло входит в воду (кадр A — слева, кадр B — под серединой) */
    if (rowing) {
      const s0 = Math.sin(ph - dt / 1700 * 6.283), s1 = Math.sin(ph);
      if (s0 > -0.25 && s1 <= -0.25) burst(P(0.09, 0.83));
      if (s0 < 0.25 && s1 >= 0.25) burst(P(0.52, 0.9));
    }
    for (let i = splash.length - 1; i >= 0; i--) { const s = splash[i]; s.vy += 0.0009 * dt * (H / 800); s.x += s.vx * dt; s.y += s.vy * dt; s.a -= 0.0016 * dt; if (s.a <= 0) { splash.splice(i, 1); continue; }
      fctx.fillStyle = "rgba(245,252,255," + s.a.toFixed(3) + ")"; fctx.beginPath(); fctx.arc(s.x, s.y, s.r, 0, 6.283); fctx.fill(); }
    if (podX != null) { /* лёгкая пена вокруг поплавка капсулы */
      fctx.strokeStyle = "rgba(240,250,255,.5)"; fctx.lineWidth = Math.max(2, L.ph * 0.01); fctx.beginPath();
      fctx.ellipse(podX, L.podWL + Math.sin(t / 1100 + 1.3) * H * 0.005, L.pw * 0.5, L.ph * 0.02, 0, 0, Math.PI); fctx.stroke(); }

    if (t > T.end - 1500) caption.classList.add("on");
    if (t >= T.end && !doneShown) { doneShown = true; window.__boat.done = true; confirmEl.classList.add("show"); if (window.QuestHUD) QuestHUD.setStep("confirm"); }
    Object.assign(window.__boat, { t, scroll, podX, arr, frame: useB ? "b" : "a", boatX: cx });
    requestAnimationFrame(frame);
  }
  function burst(p) { const k = H / 900; for (let i = 0; i < 12; i++) splash.push({ x: p.x + (Math.random() - 0.5) * 10 * k, y: p.y, vx: (Math.random() - 0.5) * 0.08 * k, vy: -(0.15 + Math.random() * 0.25) * k, a: 0.95, r: (1.5 + Math.random() * 2.5) * k }); }
  /* ---------- музыка (как в sky) ---------- */
  let audio = null, audioFailed = false, lastAT = -1;
  if (CFG.MUSIC && !FAST) {
    audio = new Audio(); audio.preload = "auto"; audio.setAttribute("playsinline", ""); audio.src = CFG.MUSIC + (/[?]/.test(CFG.MUSIC) ? "&" : "?") + "v=20261115p34";
    audio.addEventListener("error", () => { audioFailed = true; });
    audio.addEventListener("loadedmetadata", () => { if (isFinite(audio.duration) && audio.duration > 0) { SAIL = Math.max(8000, audio.duration * 1000 - ENTER - ARRIVE); setTimeline(); } });
  }
  const veil = document.getElementById("veil"), tapStart = document.getElementById("tapStart"), caption = document.getElementById("caption");
  const confirmEl = document.getElementById("confirm"), skipBtn = document.getElementById("skipBtn"), muteBtn = document.getElementById("muteBtn");
  window.__boat = { t: 0, done: false, T, speed: SPEED, music: !!audio, audio, skipped: false };

  function skip() {
    const t = clock;
    if (skipped || t < T.enter || t >= T.arrive) return;
    skipped = true; window.__boat.skipped = true; skipBtn.classList.remove("show");
    T.arrive = t; T.end = t + 3500; FADE = 3500;
  }
  skipBtn.addEventListener("pointerdown", (e) => e.stopPropagation());
  skipBtn.addEventListener("click", (e) => { e.stopPropagation(); skip(); });

  const MKEY = "nov16_boat_muted";
  function setMuted(m) { if (!audio) return; audio.muted = m; muteBtn.classList.toggle("muted", m); try { localStorage.setItem(MKEY, m ? "1" : "0"); } catch (e) {} }
  if (audio) { muteBtn.classList.add("show"); setMuted((() => { try { return localStorage.getItem(MKEY) === "1"; } catch (e) { return false; } })()); }
  muteBtn.addEventListener("pointerdown", (e) => e.stopPropagation());
  muteBtn.addEventListener("click", (e) => { e.stopPropagation(); if (audio.paused && started && !doneShown) audio.play().catch(() => {}); setMuted(!audio.muted); });

  document.getElementById("enterBtn").addEventListener("click", () => { window.__boat.entered = true; if (audio) audio.pause(); if (window.QuestHUD) QuestHUD.next(); });

  const start = () => { if (started) return; started = true; tapStart.classList.remove("show"); veil.classList.remove("half"); veil.classList.add("off"); requestAnimationFrame(frame); };
  function askTap() {
    if (started) return;
    tapStart.classList.add("show"); veil.classList.add("half");
    const go = () => {
      if (started) return;
      ["click", "touchend", "keydown"].forEach((ev) => removeEventListener(ev, go, true));
      if (audioFailed) { start(); return; }
      const pr = audio.play(); start();
      if (pr && pr.catch) pr.catch(() => { window.__boat.audioBlocked = true; });
    };
    ["click", "touchend", "keydown"].forEach((ev) => addEventListener(ev, go, true));
  }
  function begin() {
    if (!audio || audioFailed) { start(); return; }
    let settled = false;
    const timer = setTimeout(() => { if (!settled) askTap(); }, 1500);
    let pr; try { pr = audio.play(); } catch (e) { pr = Promise.reject(e); }
    Promise.resolve(pr).then(() => { settled = true; clearTimeout(timer); start(); }, () => { settled = true; clearTimeout(timer); if (audioFailed) start(); else askTap(); });
  }
  resize(); addEventListener("resize", resize);
  if (window.QuestHUD) QuestHUD.setStep("sail");
  /* ждём картинки, потом старт */
  Promise.all(["bg_sea.jpg", "pair_a.png", "pair_b.png", "pod.png", "island1.png"].map((src) => new Promise((r) => { const i = new Image(); i.onload = i.onerror = r; i.src = src; }))).then(() => setTimeout(begin, 150));
})();
</script>
