<html lang="ru">
<head>

<style>
  /* Переход R.E.P.O.: вид сбоку, три явные дорожки, Вика за рулём, Женя сзади.
     Фон мира статичен и раз в 20–25 с плавно сменяется. Колёса статичные (уже в car.png).
     Музыка и длительность — TRANSITIONS.REPO_FLIGHT. Отладка: ?fast=1 (30 с), ?world=N (1–8, держит мир). */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07080e; user-select: none; -webkit-user-select: none; touch-action: none; }
  #bgRoot { position: fixed; inset: 0; overflow: hidden; background: #07080e; }
  .world-stack { position: absolute; inset: 0; opacity: 0; transition: opacity 2.5s ease; will-change: opacity; pointer-events: none; }
  .world-stack.on { opacity: 1; }
  html.fast .world-stack { transition-duration: 1.4s; }
  .world-bg {
    position: absolute; inset: 0;
    background: center / cover no-repeat;
  }
  .world-bg.pixel { image-rendering: pixelated; image-rendering: crisp-edges; }
  #vignette {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(ellipse at 50% 40%, transparent 50%, rgba(0,0,0,.42) 100%);
  }
  #road {
    position: fixed; left: 0; right: 0; bottom: 0; height: 38%;
    z-index: 3; pointer-events: none;
    background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(8,6,10,.04) 18%, rgba(8,6,10,.16) 100%);
  }
  #road canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
  #roadFx { position: absolute; inset: 0; width: 100%; height: 100%; }
  #speedFx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 8; pointer-events: none; }
  #pickups { position: fixed; inset: 0; z-index: 9; pointer-events: none; }
  .heart {
    position: absolute; left: 0; top: 0; width: 48px; height: 48px; margin: -24px 0 0 -24px;
    will-change: transform; pointer-events: none;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.45));
  }
  .heart svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .heart.gone { animation: heartPop .28s ease forwards; }
  @keyframes heartPop { to { opacity: 0; } }
  .floater {
    position: absolute; z-index: 16; pointer-events: none;
    font: 700 16px/1 "Segoe UI", system-ui, sans-serif; color: #ffe7a8;
    text-shadow: 0 0 8px rgba(255, 200, 80, .8); animation: floaterUp .9s ease-out forwards;
  }
  @keyframes floaterUp { to { transform: translateY(-40px); opacity: 0; } }
  #carWrap {
    position: fixed; z-index: 12; left: 0; top: 0;
    pointer-events: none; will-change: transform;
    transform-origin: 45% 90%;
    opacity: 0;
  }
  #car {
    position: relative; width: 100%; height: 100%;
    transform-origin: 50% 88%;
    will-change: transform;
  }
  #car .body { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none;
    filter: drop-shadow(0 10px 12px rgba(0,0,0,.45)); }
  #portal {
    position: fixed; z-index: 7; left: 78%; top: 58%;
    width: min(54vw, 420px); height: min(54vw, 420px);
    transform: translate(-50%, -50%) scale(.2); opacity: 0;
    pointer-events: none; will-change: transform, opacity;
  }
  #portal.on { opacity: 1; }
  .portal-core {
    position: absolute; inset: 18%; border-radius: 50%;
    background: radial-gradient(circle, #fffef6 0%, #ffe38a 28%, #ffb14a 52%, rgba(255, 160, 60, 0) 72%);
    filter: blur(2px); animation: portalPulse 1.6s ease-in-out infinite;
  }
  .portal-ring {
    position: absolute; inset: 8%; border-radius: 50%;
    border: 3px solid rgba(255, 236, 180, .75);
    box-shadow: 0 0 40px 12px rgba(255, 200, 90, .45), inset 0 0 50px rgba(255, 240, 200, .5);
    animation: portalSpin 8s linear infinite;
  }
  .portal-ring:after {
    content: ""; position: absolute; inset: 10%; border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, .5);
  }
  @keyframes portalPulse { 50% { transform: scale(1.06); opacity: .9; } }
  @keyframes portalSpin { to { transform: rotate(360deg); } }
  #titleCard {
    position: fixed; z-index: 18; left: 50%; top: 42%;
    transform: translate(-50%, -50%); text-align: center; pointer-events: none;
    opacity: 0; transition: opacity 1.2s ease, transform 1.2s ease;
    width: min(90vw, 640px);
  }
  #titleCard.on { opacity: 1; transform: translate(-50%, -58%); }
  #titleCard .kicker {
    font: 600 13px/1.2 "Segoe UI", "Noto Sans", system-ui, sans-serif;
    letter-spacing: .28em; text-transform: uppercase; color: #fff6d0;
    text-shadow: 0 0 16px rgba(255, 200, 90, .8), 0 1px 6px rgba(40, 20, 0, .9);
    margin-bottom: 10px;
  }
  #titleCard h1 {
    margin: 0; font: 600 clamp(48px, 14vw, 92px)/1.05 "Palatino Linotype", Palatino, "Iowan Old Style", "Times New Roman", serif;
    color: #fff6d8; letter-spacing: .08em;
    text-shadow: 0 0 18px rgba(255, 200, 90, .85), 0 0 48px rgba(255, 160, 40, .55), 0 4px 12px rgba(80, 40, 0, .45);
  }
  #worldName {
    position: fixed; z-index: 10; left: calc(16px + env(safe-area-inset-left, 0px));
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    font: 500 13px/1.2 "Segoe UI", "Noto Sans", system-ui, sans-serif;
    letter-spacing: .18em; text-transform: uppercase; color: rgba(255,255,255,.72);
    text-shadow: 0 1px 8px rgba(0,0,0,.6); pointer-events: none;
    opacity: 0; transition: opacity 1s ease;
  }
  #worldName.on { opacity: 1; }
  #worldName.off { opacity: 0; transition: none; }
  #collectHud {
    position: fixed; z-index: 16; top: calc(14px + env(safe-area-inset-top, 0px));
    left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px;
    padding: 6px 14px; border-radius: 999px;
    background: rgba(8, 10, 18, .42); color: #fff;
    border: 1px solid rgba(255,255,255,.28);
    font: 600 15px/1 "Segoe UI", "Noto Sans", system-ui, sans-serif;
    letter-spacing: .04em; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    opacity: 0; transition: opacity .6s ease; pointer-events: none;
  }
  #collectHud.on { opacity: 1; }
  #collectHud .ico { color: #ff6ea8; }
  #laneControls {
    position: fixed; z-index: 17;
    right: calc(14px + env(safe-area-inset-right, 0px));
    top: 50%; transform: translateY(-58%);
    display: flex; flex-direction: column; gap: 10px;
  }
  #laneControls button {
    width: 52px; height: 52px; border-radius: 16px;
    border: 1px solid rgba(255,255,255,.45);
    background: rgba(16, 14, 24, .5); color: #fff;
    font-size: 22px; line-height: 1; cursor: pointer;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    touch-action: manipulation;
  }
  #laneControls button:active { background: rgba(255,255,255,.22); }
  #laneControls button:disabled { opacity: .35; }
  .veil { position: fixed; inset: 0; z-index: 20; pointer-events: none; background: #0a0c14; opacity: 1; transition: opacity 1.2s ease; }
  .veil.off { opacity: 0; }
  .veil.flash { background: #fff8e6; transition: opacity .35s ease; }
  /* «Пропустить» — над кнопкой подсказки HUD (правый низ), как в полёте по небу. */
  .skip { position: fixed; z-index: 21; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(66px + env(safe-area-inset-bottom, 0px));
    padding: 7px 14px; border: 1px solid rgba(255, 255, 255, .55); border-radius: 999px; background: rgba(255, 250, 244, .28); color: rgba(255, 255, 255, .92);
    font: 500 14px/1.2 "Segoe UI", "Noto Sans", system-ui, sans-serif; letter-spacing: .03em; text-shadow: 0 1px 3px rgba(0, 0, 0, .55);
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); cursor: pointer; opacity: 0; pointer-events: none; transition: opacity .8s ease, background .2s; touch-action: manipulation; display: block; }
  .skip.show { opacity: .75; pointer-events: auto; }
  .skip.show:hover { opacity: 1; background: rgba(255, 250, 244, .42); }
  .mute { position: fixed; z-index: 21; left: calc(12px + env(safe-area-inset-left, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); width: 38px; height: 38px; display: none;
    align-items: center; justify-content: center; padding: 0; border: 1px solid rgba(255,255,255,.55); border-radius: 50%; background: rgba(20, 18, 30, .4);
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); cursor: pointer; opacity: .8; touch-action: manipulation; }
  .mute.show { display: flex; }
  .mute svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .mute .off { display: none; } .mute.muted .on { display: none; } .mute.muted .off { display: inline; }
  .tap-start { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 22; display: none; padding: 14px 26px; border-radius: 999px;
    font: 600 20px/1.2 "Segoe UI", system-ui, sans-serif; color: #3a2a18; background: rgba(255, 246, 220, .88); box-shadow: 0 0 30px rgba(255, 200, 120, .7); cursor: pointer; }
  .tap-start.show { display: block; animation: tapPulse 1.8s ease-in-out infinite; }
  @keyframes tapPulse { 50% { box-shadow: 0 0 50px rgba(255, 190, 100, 1); } }
  .rf-ach {
    position: fixed; z-index: 24; left: 50%; top: calc(64px + env(safe-area-inset-top, 0px));
    transform: translateX(-50%); min-width: 220px; max-width: min(86vw, 360px);
    padding: 12px 16px 12px 14px; border-radius: 14px;
    background: rgba(16, 14, 24, .82); color: #fff; border: 1px solid rgba(255, 220, 150, .45);
    box-shadow: 0 10px 30px rgba(0,0,0,.35); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    font: 500 14px/1.35 "Segoe UI", "Noto Sans", system-ui, sans-serif;
    animation: rfAchIn .45s ease;
  }
  .rf-ach.off { animation: rfAchOut .4s ease forwards; }
  .rf-ach .kicker { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: #ffd58a; }
  .rf-ach .ttl { font-size: 15px; font-weight: 600; margin-top: 2px; }
  .rf-ach .pts { font-size: 12px; color: #ffe9b8; margin-top: 2px; }
  @keyframes rfAchIn { from { opacity: 0; transform: translate(-50%, -12px); } }
  @keyframes rfAchOut { to { opacity: 0; transform: translate(-50%, -12px); } }
  @media (max-width: 600px) {
    #laneControls { top: auto; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); transform: none; }
    #laneControls button { width: 56px; height: 56px; }
    .skip { right: calc(10px + env(safe-area-inset-right, 0px)); top: auto; bottom: calc(58px + env(safe-area-inset-bottom, 0px)); font-size: 13px; padding: 6px 12px; }
    #worldName { left: calc(12px + env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); font-size: 11px; }
    .heart { width: 56px; height: 56px; margin: -28px 0 0 -28px; }
  }
</style>

</div>

<div id="carWrap">
  <div id="car">
    <img class="body" src="repo/car.png" alt="Вика за рулём, Женя сзади">
  </div>
</div>

<div class="tap-start" id="tapStart">Коснись, чтобы поехать 🚗</div>
<script>
(function () {
  "use strict";
  const ROOT = (window.QUEST_CONFIG && window.QUEST_CONFIG.TRANSITIONS) || {};
  const CFG = ROOT.REPO_FLIGHT || {};
  const FAST = /[?&]fast=1/.test(location.search);
  const DEBUG = FAST || /[?&](debug|skip)=1/.test(location.search);
  if (FAST) document.documentElement.classList.add("fast");

  const ASSET = "20261115p39";
  const WORLDS = (CFG.WORLDS || [
    { src: "repo/worlds/01_space_hq.webp",  roadSrc: "repo/worlds/01_space_road.webp",  name: "Космос",            road: ["#16102a", "#2a1a48"], dash: "rgba(210,200,255,.75)", dust: "180,160,255", pixel: false },
    { src: "repo/worlds/02_pixel_hq.webp",  roadSrc: "repo/worlds/02_pixel_road.webp",  name: "Пиксели",           road: ["#2a6a22", "#1f4a18"], dash: "rgba(255,255,255,.8)",  dust: "180,255,140", pixel: true },
    { src: "repo/worlds/03_cyber_hq.webp",  roadSrc: "repo/worlds/03_cyber_road.webp",  name: "Неон",              road: ["#12081c", "#1c0a30"], dash: "rgba(255,80,220,.75)",  dust: "200,120,255" },
    { src: "repo/worlds/04_clouds_hq.webp", roadSrc: "repo/worlds/04_clouds_road.webp", name: "Небесные острова",  road: ["#c8b898", "#a89070"], dash: "rgba(255,255,255,.85)", dust: "255,236,200" },
    { src: "repo/worlds/05_lava_hq.webp",   roadSrc: "repo/worlds/05_lava_road.webp",   name: "Лава",              road: ["#2a1010", "#4a1810"], dash: "rgba(255,180,90,.8)",   dust: "255,140,60" },
    { src: "repo/worlds/06_forest_hq.webp", roadSrc: "repo/worlds/06_forest_road.webp", name: "Лес",               road: ["#243418", "#1a2810"], dash: "rgba(220,230,160,.8)",  dust: "170,255,140" },
    { src: "repo/worlds/07_ocean_hq.webp",  roadSrc: "repo/worlds/07_ocean_road.webp",  name: "Океан",             road: ["#0e3a48", "#0a5a68"], dash: "rgba(220,250,255,.85)", dust: "140,220,255" },
    { src: "repo/worlds/08_teyvat_hq.webp", roadSrc: "repo/worlds/08_teyvat_road.webp", name: "Тейват",            road: ["#b89450", "#d4b06a"], dash: "rgba(255,248,210,.9)",  dust: "255,220,140" }
  ]).map((w) => Object.assign({}, w, {
    src: w.src + (w.src.indexOf("?") >= 0 ? "&" : "?") + "v=" + ASSET,
    roadSrc: (w.roadSrc || w.src.replace(/_hq\.webp.*$/, "_road.webp")) + ((w.roadSrc || "").indexOf("?") >= 0 ? "&" : "?") + "v=" + ASSET
  }));
  const FORCE_WORLD = Math.max(0, parseInt(new URLSearchParams(location.search).get("world") || "0", 10));
  const roadImgs = WORLDS.map((w) => { const im = new Image(); im.decoding = "async"; im.src = w.roadSrc; return im; });
  let roadFadeFrom = 0, roadFadeStart = 0;
  const HEART_PRIMOS = CFG.HEART_PRIMOS != null ? CFG.HEART_PRIMOS : 2;
  const HEART_CAP = CFG.HEART_CAP != null ? CFG.HEART_CAP : 0; /* 0 — без потолка */
  const HEART_KEY = "nov16_repo_hearts";
  const HEART_EVERY = FAST ? 750 : (CFG.HEART_EVERY_MS || 1350);
  const HEART_JITTER = FAST ? 80 : (CFG.HEART_JITTER_MS != null ? CFG.HEART_JITTER_MS : 180);
  const LANE_MS = CFG.LANE_MS || 250;
  const HEART_MIN_GAP = LANE_MS * 2 + 200;
  const FADE = CFG.FADE_MS || 3000;
  const WORLD_MS = FAST ? 2800 : (CFG.WORLD_MS || 22500);
  const WORLD_FADE = FAST ? 1400 : 2500;
  const TEYVAT_LEAD = FAST ? 3000 : (CFG.TEYVAT_LEAD_MS || 9000);
  const CAR_ASPECT = 1010 / 576;
  const CAR_CX = W => W * (W < 600 ? 0.27 : 0.19);

  const ENTER = FAST ? 700 : 2000;
  const END = FAST ? 7000 : 14000;
  let skipped = false, started = false, doneShown = false;
  let DURATION = FAST ? 30000 : (CFG.DURATION_MS || 180000);
  const T = {};
  function setTimeline() {
    if (skipped) return;
    T.enter = ENTER;
    T.portalAt = Math.max(ENTER + 2000, DURATION - END);
    T.flyIn = T.portalAt + END * 0.38;
    T.flash = T.portalAt + END * 0.58;
    T.titleAt = T.portalAt + END * 0.68;
    T.done = DURATION;
    /* Тейват полностью на экране за TEYVAT_LEAD до начала всасывания в портал */
    T.teyvatFull = Math.max(T.enter + WORLD_FADE + 500, T.portalAt - TEYVAT_LEAD);
    T.teyvatAt = Math.max(T.enter, T.teyvatFull - WORLD_FADE);
    planHearts();
  }

  const stackA = document.getElementById("stackA");
  const stackB = document.getElementById("stackB");
  let frontStack = stackA, backStack = stackB, curWorld = 0, lastWorldShown = -1, worldFadeTimer = 0;
  const carWrap = document.getElementById("carWrap");
  const carEl = document.getElementById("car");
  const portal = document.getElementById("portal");
  const titleCard = document.getElementById("titleCard");
  const veil = document.getElementById("veil");
  const worldName = document.getElementById("worldName");
  const collectHud = document.getElementById("collectHud");
  const heartCountEl = document.getElementById("heartCount");
  const lootEl = document.getElementById("pickups");
  const skipBtn = document.getElementById("skipBtn");
  const muteBtn = document.getElementById("muteBtn");
  const tapStart = document.getElementById("tapStart");
  const laneUp = document.getElementById("laneUp");
  const laneDown = document.getElementById("laneDown");
  const roadCanvas = document.getElementById("roadFx");
  const speedCanvas = document.getElementById("speedFx");
  const roadCtx = roadCanvas.getContext("2d");
  const speedCtx = speedCanvas.getContext("2d");

  let jumpingLane = false, muted = false;
  let clock = 0, lastTs = 0;
  let collected = 0, awardedThisRun = 0;
  let pickups = [];
  let heartPlan = [];
  let nextPlanI = 0;
  let W = innerWidth, H = innerHeight;
  let scrollRoad = 0, dust = [], dustAcc = 0;
  let lane = 1, laneFrom = 1, laneTo = 1, laneT0 = -1, laneVisual = 1;
  let audio = null, audioFailed = false, lastAT = -1;
  let swipeY0 = null, swipeT0 = 0, paused = false;
  let lines = [];

  
  function planHearts() {
    const start = T.enter + (FAST ? 400 : 900);
    const end = T.portalAt - (FAST ? 800 : 1600);
    const plan = [];
    let t = start, i = 0;
    const span = HEART_JITTER * 2 + 1;
    const gap = Math.max(HEART_MIN_GAP, 1);
    while (t <= end) {
      const lane = (i * 2 + 1) % 3;
      plan.push({ t: t, lane: lane });
      const j = HEART_JITTER ? ((i * 17 + 11) % span) - HEART_JITTER : 0;
      t += Math.max(gap, HEART_EVERY + j);
      i++;
    }
    heartPlan = plan;
    nextPlanI = 0;
  }
  function heartGain() {
    if (!HEART_CAP) return HEART_PRIMOS;
    const remain = Math.max(0, HEART_CAP - alreadyAwarded());
    return Math.min(HEART_PRIMOS, remain);
  }
  function grantSkipMax() {
    const n = heartPlan.length;
    collected = n;
    if (heartCountEl) heartCountEl.textContent = String(n);
    const target = n * HEART_PRIMOS;
    const missing = Math.max(0, target - awardedThisRun);
    if (missing) {
      try {
        if (window.QuestHUD) QuestHUD.addPrimos(missing);
      } catch (e) {}
      setAwarded(alreadyAwarded() + missing);
      awardedThisRun += missing;
    }
  }
  function setWorldInstant(i) {
    lastWorldShown = i; curWorld = i;
    roadFadeFrom = i; roadFadeStart = 0;
    setStackWorld(frontStack, i);
    frontStack.classList.add("on");
    backStack.classList.remove("on");
    worldName.textContent = (WORLDS[i] && WORLDS[i].name) || "";
    worldName.classList.remove("off");
    worldName.classList.add("on");
  }

  setTimeline();

function alreadyAwarded() {
    try { return Math.max(0, parseInt(localStorage.getItem(HEART_KEY) || "0", 10) || 0); } catch (e) { return 0; }
  }
  function setAwarded(n) {
    try { localStorage.setItem(HEART_KEY, String(n)); } catch (e) {}
  }
  function ruHeart(n) {
    const m = n % 100, m1 = n % 10;
    if (m > 10 && m < 20) return n + " сердец";
    if (m1 === 1) return n + " сердце";
    if (m1 >= 2 && m1 <= 4) return n + " сердца";
    return n + " сердец";
  }
  function ruPrimo(n) {
    const m = n % 100, m1 = n % 10;
    if (m > 10 && m < 20) return n + " примогемов";
    if (m1 === 1) return n + " примоген";
    if (m1 >= 2 && m1 <= 4) return n + " примогена";
    return n + " примогемов";
  }
  function showToast(title, pts) {
    document.querySelectorAll(".rf-ach").forEach((n) => n.remove());
    const el = document.createElement("div");
    el.className = "rf-ach";
    el.innerHTML = '<div class="kicker">Достижение</div><div class="ttl"></div>' + (pts ? '<div class="pts"></div>' : "");
    el.querySelector(".ttl").textContent = title;
    if (pts) el.querySelector(".pts").textContent = pts;
    document.body.appendChild(el);
    setTimeout(() => { el.classList.add("off"); setTimeout(() => el.remove(), 450); }, 3200);
  }
  function easeInOut(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function mixHex(a, b, t) {
    const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    const r = Math.round(lerp((pa >> 16) & 255, (pb >> 16) & 255, t));
    const g = Math.round(lerp((pa >> 8) & 255, (pb >> 8) & 255, t));
    const bl = Math.round(lerp(pa & 255, pb & 255, t));
    return "rgb(" + r + "," + g + "," + bl + ")";
  }

  function resize() {
    W = innerWidth; H = innerHeight;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    [roadCanvas, speedCanvas].forEach((c) => {
      const frac = (c === roadCanvas ? 0.38 : 1);
      c.width = Math.round(W * dpr); c.height = Math.round(H * frac * dpr);
      c.style.width = W + "px";
      c.style.height = (H * frac) + "px";
      c.getContext("2d").setTransform(dpr, 0, 0, dpr, 0, 0);
    });
    seedLines();
  }
  addEventListener("resize", resize);

  function setStackWorld(stack, i) {
    const w = WORLDS[i];
    const bg = stack.querySelector(".world-bg");
    if (bg) {
      bg.style.backgroundImage = "url(" + w.src + ")";
      bg.classList.toggle("pixel", !!w.pixel);
    }
  }
  function worldIndexAt(t) {
    const last = WORLDS.length - 1;
    if (FORCE_WORLD) return Math.min(last, Math.max(0, FORCE_WORLD - 1));
    if (t < T.enter) return 0;
    if (t >= T.teyvatAt) return last;
    const pre = Math.max(1, T.teyvatAt - T.enter);
    const step = Math.min(WORLD_MS, pre / Math.max(1, last));
    const i = Math.floor((t - T.enter) / step);
    return Math.min(last - 1, Math.max(0, i));
  }
  function setWorld(i) {
    if (i === lastWorldShown) return;
    const prev = lastWorldShown;
    lastWorldShown = i; curWorld = i;
    worldName.textContent = WORLDS[i].name || "";
    worldName.classList.remove("off");
    worldName.classList.add("on");
    if (i !== WORLDS.length - 1) {
      clearTimeout(setWorld._hide);
      setWorld._hide = setTimeout(() => worldName.classList.remove("on"), FAST ? 1100 : 4000);
    }
    if (prev < 0) { setStackWorld(frontStack, i); frontStack.classList.add("on"); roadFadeFrom = i; roadFadeStart = 0; return; }
    roadFadeFrom = prev;
    roadFadeStart = performance.now();
    setStackWorld(backStack, i);
    backStack.classList.add("on");
    frontStack.classList.remove("on");
    const oldFront = frontStack;
    frontStack = backStack;
    backStack = oldFront;
    clearTimeout(worldFadeTimer);
    worldFadeTimer = setTimeout(() => { /* keep hidden stack ready */ }, FAST ? 1500 : 2700);
  }

  function lanes() {
    const top = H * (W < 600 ? 0.64 : 0.65);
    const bot = H * (W < 600 ? 0.97 : 0.98);
    const h = Math.max(80, bot - top);
    return [0, 1, 2].map((i) => ({
      y: top + h * ((i + 0.5) / 3),
      scale: 0.84 + i * 0.08,
      z: 10 + i * 3,
      bandTop: top + h * (i / 3),
      bandBot: top + h * ((i + 1) / 3)
    }));
  }
  function laneState() {
    let v = laneTo, tilt = 0;
    if (laneT0 >= 0) {
      const u = Math.min(1, (clock - laneT0) / LANE_MS);
      const e = easeInOut(u);
      v = lerp(laneFrom, laneTo, e);
      tilt = Math.sin(u * Math.PI) * 7 * Math.sign(laneTo - laneFrom);
      if (u >= 1) { laneT0 = -1; lane = laneTo; v = laneTo; tilt = 0; jumpingLane = false; }
    }
    laneVisual = v;
    const L = lanes();
    const i0 = Math.max(0, Math.min(2, Math.floor(v)));
    const i1 = Math.max(0, Math.min(2, Math.ceil(v)));
    const f = v - i0;
    return {
      y: lerp(L[i0].y, L[i1].y, f),
      scale: lerp(L[i0].scale, L[i1].scale, f),
      z: Math.round(lerp(L[i0].z, L[i1].z, f)),
      tilt: tilt,
      v: v
    };
  }
  function setLane(next) {
    if (!started || doneShown || clock >= T.portalAt) return;
    next = Math.max(0, Math.min(2, next | 0));
    if (next === laneTo && laneT0 < 0) return;
    const st = laneState();
    laneFrom = st.v;
    laneTo = next;
    laneT0 = clock;
    jumpingLane = true;
    updateLaneButtons();
  }
  function updateLaneButtons() {
    laneUp.disabled = laneTo <= 0;
    laneDown.disabled = laneTo >= 2;
  }

  function carSize() {
    const L = lanes();
    const laneH = Math.max(40, L[0].bandBot - L[0].bandTop);
    /* mid-lane visual height ≈ 1.42 × полосы — заметная, но сидит в своей полосе */
    const ch = Math.min(laneH * 1.42 / 0.92, H * 0.24, W * 0.70 / CAR_ASPECT);
    return { cw: ch * CAR_ASPECT, ch };
  }
  function placeCar(t) {
    const { cw, ch } = carSize();
    carWrap.style.width = cw + "px";
    carWrap.style.height = ch + "px";
    const st = laneState();
    let cx = CAR_CX(W);
    let cy = st.y, sc = st.scale, op = 1, rot = st.tilt;
    if (t < T.enter) {
      const k = Math.max(0, t / T.enter);
      const e = 1 - Math.pow(1 - k, 3);
      cx = W * (-0.35 + (W < 600 ? 0.62 : 0.54) * e);
      op = Math.min(1, k * 1.8);
      sc *= 0.85 + 0.15 * e;
    } else if (t >= T.portalAt && t < T.flash) {
      const k = (t - T.portalAt) / Math.max(1, T.flash - T.portalAt);
      const e = k * k;
      cx = lerp(cx, W * 0.72, e);
      cy = lerp(cy, H * 0.58, e);
      sc = lerp(sc, 1.15, e);
      op = 1 - Math.max(0, (k - 0.72) * 3.5);
      rot = 0;
    } else if (t >= T.flash) {
      op = 0; cx = W * 0.72; cy = H * 0.58;
    }
    const bounce = (t > T.enter && t < T.portalAt) ? Math.sin(t / 90) * 3 : 0;
    carWrap.style.opacity = String(op);
    carWrap.style.zIndex = String(st.z + 1);
    carWrap.style.transform = "translate3d(" + (cx - cw * 0.45) + "px," + (cy - ch * 0.90 + bounce) + "px,0) scale(" + sc + ") rotate(" + rot + "deg)";
    return {
      cx: cx + cw * 0.28 * sc, cy: cy + bounce,
      cw, ch, scale: sc, lane: st.v,
      rearX: cx - 0.45 * sc * cw,
      rearY: cy + bounce
    };
  }

  function placePortal(t) {
    if (t < T.portalAt - 900) { portal.classList.remove("on"); portal.style.opacity = "0"; return; }
    portal.classList.add("on");
    let k = Math.max(0, Math.min(1, (t - (T.portalAt - 900)) / 1400));
    if (t > T.flash) k = 1;
    const pulse = 1 + Math.sin(t / 180) * 0.03;
    portal.style.opacity = String(Math.min(1, k * 1.2));
    portal.style.transform = "translate(-50%, -50%) scale(" + (0.25 + 1.05 * k) * pulse + ")";
  }

  function spawnHeart(laneIdx, x) {
    if (pickups.length > 14) return null;
    const el = document.createElement("div");
    el.className = "heart";
    el.innerHTML = '<svg viewBox="0 0 32 29" aria-hidden="true"><path fill="#ff3b6b" stroke="#fff" stroke-width="2.2" stroke-linejoin="round" d="M16 27.5S2.5 18.2 2.5 10.2C2.5 5.6 6.1 2.5 10.3 2.5c2.4 0 4.5 1.2 5.7 3.1 1.2-1.9 3.3-3.1 5.7-3.1 4.2 0 7.8 3.1 7.8 7.7 0 8-13.5 17.3-13.5 17.3z"/></svg>';
    const L = lanes();
    const ln = Math.max(0, Math.min(2, laneIdx == null ? (Math.random() * 3 | 0) : laneIdx));
    const item = { el, kind: "heart", lane: ln, x: x != null ? x : W + 50, taken: false };
    el.dataset.lane = String(ln);
    el.style.zIndex = String(Math.max(18, L[ln].z + 8));
    el.style.transform = "translate3d(" + item.x + "px," + L[ln].y + "px,0) scale(" + L[ln].scale + ")";
    item.y = L[ln].y;
    lootEl.appendChild(el);
    pickups.push(item);
    return item;
  }
  function collectItem(item, car) {
    if (!item || item.taken) return;
    item.taken = true;
    item.el.classList.add("gone");
    setTimeout(() => item.el.remove(), 300);
    collected += 1;
    heartCountEl.textContent = String(collected);
    const gain = heartGain();
    if (gain && window.QuestHUD) {
      QuestHUD.addPrimos(gain);
      setAwarded(alreadyAwarded() + gain);
      awardedThisRun += gain;
    }
    const fl = document.createElement("div");
    fl.className = "floater";
    fl.textContent = gain ? "+" + gain : "♥";
    const L = lanes();
    fl.style.left = item.x + "px";
    fl.style.top = (L[item.lane].y - 30) + "px";
    document.body.appendChild(fl);
    setTimeout(() => fl.remove(), 900);
  }
  function updateLoot(dt, car, roadSpd) {
    if (!skipped && started && clock < T.portalAt) {
      while (nextPlanI < heartPlan.length && clock >= heartPlan[nextPlanI].t) {
        spawnHeart(heartPlan[nextPlanI].lane);
        nextPlanI++;
      }
    }
    const L = lanes();
    for (let i = pickups.length - 1; i >= 0; i--) {
      const p = pickups[i];
      if (p.taken) { pickups.splice(i, 1); continue; }
      p.x -= roadSpd * dt;
      const y = L[p.lane].y;
      const sc = L[p.lane].scale;
      p.el.style.transform = "translate3d(" + p.x + "px," + y + "px,0) scale(" + sc + ")";
      p.y = y;
      if (!p.taken && car && Math.abs(car.lane - p.lane) < 0.4 && Math.abs(p.x - car.cx) < Math.max(44, car.cw * 0.22)) {
        collectItem(p, car);
        continue;
      }
      if (p.x < -80) { p.el.remove(); pickups.splice(i, 1); }
    }
  }

  function seedLines() {
    lines = [];
    const maxY = Math.max(40, lanes()[0].bandTop - 16);
    for (let i = 0; i < 16; i++) {
      lines.push({ x: Math.random() * W, y: 8 + Math.random() * maxY, l: 24 + Math.random() * 70, v: 1.1 + Math.random() * 2, a: 0.08 + Math.random() * 0.16 });
    }
  }

  function roadTexReady(img) {
    return !!(img && img.complete && img.naturalWidth);
  }
  function roadFadeK() {
    if (!roadFadeStart) return 1;
    const k = Math.min(1, (performance.now() - roadFadeStart) / WORLD_FADE);
    return easeInOut(k);
  }
  function drawRoadTex(ctx, img, alpha, yTop, yBot, pixel) {
    if (!roadTexReady(img) || alpha <= 0.004) return false;
    const band = yBot - yTop;
    const edge = Math.round(band * 0.14);
    const destY = yTop - edge;
    const destH = Math.max(2, band + edge * 2);
    const tw = img.naturalWidth, th = img.naturalHeight;
    const dw = Math.max(2, Math.round(destH * (tw / th)));
    const off = ((scrollRoad % dw) + dw) % dw;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.imageSmoothingEnabled = !pixel;
    if (!pixel) ctx.imageSmoothingQuality = "high";
    let x = Math.round(-off);
    while (x < W + 2) {
      ctx.drawImage(img, 0, 0, tw, th, x, destY, dw, destH);
      x += dw;
    }
    ctx.restore();
    return true;
  }
  function drawRoadFallback(ctx, world, yTop, yBot, L, origin, alpha) {
    if (alpha <= 0.004) return;
    ctx.save();
    for (let i = 0; i < 3; i++) {
      const a = L[i].bandTop - origin, b = L[i].bandBot - origin;
      const grd = ctx.createLinearGradient(0, a, 0, b);
      grd.addColorStop(0, world.road[0]);
      grd.addColorStop(1, world.road[1]);
      ctx.globalAlpha = 0.92 * alpha;
      ctx.fillStyle = grd;
      ctx.fillRect(0, a, W, Math.max(2, b - a));
    }
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = world.dash;
    for (let i = 1; i < 3; i++) {
      const y = L[i].bandTop - origin;
      ctx.lineWidth = 4;
      ctx.setLineDash([28, 22]);
      ctx.lineDashOffset = -scrollRoad * (0.85 + i * 0.08);
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.restore();
  }
  function drawRoad(dt, roadSpd) {
    const ctx = roadCtx;
    const rh = H * 0.38;
    const origin = H - rh;
    ctx.clearRect(0, 0, W, rh);
    const L = lanes();
    const yTop = L[0].bandTop - origin;
    const yBot = L[2].bandBot - origin;
    const to = curWorld;
    const from = roadFadeFrom;
    const k = (from === to) ? 1 : roadFadeK();
    if (k < 1 && from !== to) {
      const aImg = roadImgs[from], bImg = roadImgs[to];
      const aOk = drawRoadTex(ctx, aImg, 1, yTop, yBot, !!(WORLDS[from] && WORLDS[from].pixel));
      if (!aOk) drawRoadFallback(ctx, WORLDS[from], yTop, yBot, L, origin, 1);
      const bOk = drawRoadTex(ctx, bImg, k, yTop, yBot, !!(WORLDS[to] && WORLDS[to].pixel));
      if (!bOk) drawRoadFallback(ctx, WORLDS[to], yTop, yBot, L, origin, k);
    } else {
      const ok = drawRoadTex(ctx, roadImgs[to], 1, yTop, yBot, !!(WORLDS[to] && WORLDS[to].pixel));
      if (!ok) drawRoadFallback(ctx, WORLDS[to], yTop, yBot, L, origin, 1);
    }
  }

  function drawSpeed(dt, roadSpd, inFlight, car) {
    const ctx = speedCtx;
    ctx.clearRect(0, 0, W, H);
    if (!inFlight) { dust = []; dustAcc = 0; return; }
    const rgb = WORLDS[curWorld].dust;
    ctx.strokeStyle = "rgba(255,255,255,0.18)";
    const roadTop = lanes()[0].bandTop;
    for (let i = 0; i < lines.length; i++) {
      const ln = lines[i];
      ln.x -= ln.v * roadSpd * 0.55 * dt;
      if (ln.x < -ln.l) { ln.x = W + ln.l; ln.y = 12 + Math.random() * Math.max(40, roadTop - 24); }
      ctx.globalAlpha = ln.a;
      ctx.beginPath();
      ctx.moveTo(ln.x, ln.y);
      ctx.lineTo(ln.x + ln.l, ln.y);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    /* пыль привязана к корме и едет вместе с машинкой по полосам */
    if (car && clock > T.enter && clock < T.portalAt) {
      dustAcc += dt;
      while (dustAcc >= 18) {
        dustAcc -= 18;
        dust.push({
          ox: 2 + Math.random() * 8,
          oy: -8 + Math.random() * 12,
          vx: -0.28 - Math.random() * 0.14,
          vy: (Math.random() - 0.5) * 0.03,
          r: 1.6 + Math.random() * 2.2,
          life: 1
        });
      }
      if (dust.length > 36) dust.splice(0, dust.length - 36);
      for (let i = dust.length - 1; i >= 0; i--) {
        const d = dust[i];
        d.ox += d.vx * roadSpd * dt;
        d.oy += d.vy * dt;
        d.life -= dt * 0.0048;
        if (d.life <= 0 || -d.ox > 64) { dust.splice(i, 1); continue; }
        d.x = car.rearX + d.ox;
        d.y = car.rearY + d.oy;
        ctx.globalAlpha = 0.5 * Math.max(0, d.life);
        ctx.fillStyle = "rgba(" + rgb + ",1)";
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r * (0.7 + 0.3 * d.life), 0, Math.PI * 2);
        ctx.fill();
      }
    } else {
      dust = []; dustAcc = 0;
    }
    ctx.globalAlpha = 1;
  }

  function finish() {
    if (doneShown) return;
    doneShown = true;
    titleCard.classList.add("on");
    worldName.classList.remove("on");
    worldName.classList.add("off");
    collectHud.classList.remove("on");
    skipBtn.classList.remove("show");
    laneUp.disabled = true;
    laneDown.disabled = true;
    if (awardedThisRun > 0 || collected > 0) {
      const title = CFG.TOAST || "Сердца собраны";
      showToast(title + " — " + ruHeart(collected), awardedThisRun ? ("+" + ruPrimo(awardedThisRun)) : "");
    }
    if (window.QuestHUD) {
      QuestHUD.setStep("done");
      QuestHUD.showNext("Дальше");
    }
    fadeAudio(800);
  }

  function fadeAudio(ms) {
    if (!audio) return;
    const startAt = performance.now();
    const from = audio.volume;
    function tick(now) {
      const k = Math.min(1, (now - startAt) / ms);
      audio.volume = Math.max(0, from * (1 - k));
      if (k < 1) requestAnimationFrame(tick);
      else { try { audio.pause(); } catch (e) {} }
    }
    requestAnimationFrame(tick);
  }

  function frame(ts) {
    if (!lastTs) lastTs = ts;
    let dt = Math.min(48, ts - lastTs);
    lastTs = ts;
    if (paused) dt = 0;
    if (!paused) {
      if (audio && !skipped && !audio.paused && !audio.ended && audio.currentTime !== lastAT) {
        lastAT = audio.currentTime;
        clock = lastAT * 1000;
      } else {
        clock += dt;
      }
    }
    if (clock > T.done) clock = T.done;
    const t = clock;
    const roadSpd = (FAST ? 0.44 : 0.27) * Math.max(0.85, W / 390);
    if (t > 80 && t < T.flash) {
      scrollRoad += roadSpd * dt;
    }
    setWorld(worldIndexAt(t));
    const car = placeCar(t);
    placePortal(t);
    updateLoot(dt, car, roadSpd);
    const inFlight = started && t > 200 && t < T.flash;
    drawRoad(dt, roadSpd);
    drawSpeed(dt, roadSpd, inFlight, car);
    if (t >= T.flash && !veil.classList.contains("flash")) {
      veil.classList.add("flash");
      veil.classList.remove("off");
      veil.style.opacity = "1";
      requestAnimationFrame(() => { setTimeout(() => { veil.style.opacity = "0"; }, 80); });
    }
    if (t >= T.titleAt) titleCard.classList.add("on");
    if (!skipped && started && t < T.portalAt) skipBtn.classList.add("show");
    else skipBtn.classList.remove("show");
    if (audio && !audio.paused) {
      const left = T.done - t;
      if (left < FADE) audio.volume = Math.max(0, Math.min(1, left / FADE));
    }
    if (t >= T.done) finish();
    if (started && !doneShown) requestAnimationFrame(frame);
    else if (doneShown) { placeCar(T.done); placePortal(T.done); }
  }

  const musicSrc = (CFG.MUSIC && String(CFG.MUSIC).trim() && String(CFG.MUSIC).trim() !== "null") ? String(CFG.MUSIC).trim() : "";
  const MKEY = "nov16_repo_muted";
  function getMutedPref() { try { return localStorage.getItem(MKEY) === "1"; } catch (e) { return false; } }
  function setMuted(m) {
    muted = !!m;
    muteBtn.classList.toggle("muted", muted);
    try { localStorage.setItem(MKEY, muted ? "1" : "0"); } catch (e) {}
    if (audio) audio.muted = muted;
  }

  if (musicSrc && !FAST) {
    audio = new Audio();
    audio.preload = "auto";
    audio.setAttribute("playsinline", "");
    audio.src = musicSrc + (/[?]/.test(musicSrc) ? "&" : "?") + "v=20261115p34";
    audio.addEventListener("error", () => { audioFailed = true; });
    audio.addEventListener("loadedmetadata", () => {
      if (!FAST && isFinite(audio.duration) && audio.duration > 0) {
        DURATION = Math.max(20000, audio.duration * 1000);
        setTimeline();
      }
    });
  }

  function startAudio() {
    if (!audio || audioFailed || muted) return;
    const pr = audio.play();
    if (pr && pr.catch) pr.catch(() => {});
  }

  function start() {
    if (started) return;
    started = true;
    tapStart.classList.remove("show");
    veil.classList.add("off");
    collectHud.classList.add("on");
    nextPlanI = 0;
    if (window.QuestHUD) QuestHUD.setStep("drive");
    startAudio();
    requestAnimationFrame(frame);
  }

  function skip() {
    if (skipped || !started || doneShown) return;
    skipped = true;
    skipBtn.classList.remove("show");
    clock = T.portalAt;
    lastTs = 0;
    pickups.forEach((p) => p.el.remove());
    pickups = [];
    grantSkipMax();
    setWorldInstant(WORLDS.length - 1);
    if (audio) { try { audio.currentTime = Math.max(0, (T.portalAt) / 1000); } catch (e) {} }
  }

  skipBtn.classList.add("allowed");
  skipBtn.addEventListener("pointerdown", (e) => e.stopPropagation());
  skipBtn.addEventListener("click", (e) => { e.stopPropagation(); skip(); });

  if (musicSrc && !FAST) muteBtn.classList.add("show");
  setMuted(getMutedPref());
  muteBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    const next = !muted;
    setMuted(next);
    if (!next && started) startAudio();
  });

  laneUp.addEventListener("click", (e) => { e.stopPropagation(); if (!started) return; setLane(laneTo - 1); });
  laneDown.addEventListener("click", (e) => { e.stopPropagation(); if (!started) return; setLane(laneTo + 1); });
  updateLaneButtons();

  addEventListener("keydown", (e) => {
    if (!started || doneShown) return;
    if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") { e.preventDefault(); setLane(laneTo - 1); }
    if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") { e.preventDefault(); setLane(laneTo + 1); }
  });

  addEventListener("pointerdown", (e) => {
    if (e.target && e.target.closest && e.target.closest("#laneControls, .skip, .mute, .tap-start, .qhud, .qhud-next, .qhud-hint, .qhud-panel")) return;
    swipeY0 = e.clientY; swipeT0 = performance.now();
  }, { passive: true });
  addEventListener("pointerup", (e) => {
    if (swipeY0 == null) return;
    const dy = e.clientY - swipeY0;
    const dt = performance.now() - swipeT0;
    swipeY0 = null;
    if (!started || doneShown) return;
    if (dt < 600 && Math.abs(dy) > 36) setLane(laneTo + (dy < 0 ? -1 : 1));
  }, { passive: true });

  window.__repoFlight = {
    get t() { return clock; },
    duration: function () { return DURATION; }, T,
    get world() { return curWorld; },
    get scrollRoad() { return scrollRoad; },
    get lane() { return laneTo; },
    get laneVisual() { return laneVisual; },
    get collected() { return collected; },
    get awarded() { return awardedThisRun; },
    get started() { return started; },
    get done() { return doneShown; },
    get skipped() { return skipped; },
    debug: DEBUG, fast: FAST, forceWorld: FORCE_WORLD,
    worlds: WORLDS, fadeMs: WORLD_FADE,
    roadReady: function () { return roadImgs.every((im) => roadTexReady(im)); },
    roadFadeK: roadFadeK,
    setWorld: setWorld, setWorldInstant: setWorldInstant,
    skip: skip, start: start, setLane: setLane,
    spawnHeart: function (ln, x) { return spawnHeart(ln, x); },
    clearHearts: function () { pickups.forEach((p) => p.el.remove()); pickups = []; lootEl.innerHTML = ""; },
    lanes: lanes, worldMs: WORLD_MS, carSize: carSize,
    get planned() { return heartPlan.length; },
    get plan() { return heartPlan.slice(); },
    minGap: HEART_MIN_GAP,
    primos: HEART_PRIMOS, cap: HEART_CAP, everyMs: HEART_EVERY,
    teyvatAt: function () { return T.teyvatAt; },
    teyvatFull: function () { return T.teyvatFull; },
    teyvatLead: TEYVAT_LEAD,
    worldIndexAt: worldIndexAt,
    lastCar: function () { return placeCar(clock); },
    dust: function () { return dust.map((d) => ({ x: d.x, y: d.y, life: d.life })); },
    pause: function (v) { paused = v !== false; if (!paused) lastTs = 0; },
    music: !!musicSrc
  };

  function begin() {
    resize();
    setStackWorld(frontStack, worldIndexAt(0));
    if (musicSrc && !FAST && !audioFailed) {
      tapStart.classList.add("show");
      const go = () => { tapStart.removeEventListener("click", go); start(); };
      tapStart.addEventListener("click", go);
      return;
    }
    start();
  }

  const preload = WORLDS.map((w) => w.src).concat(WORLDS.map((w) => w.roadSrc)).concat(["repo/car.png"]);
  Promise.all(preload.map((src) => new Promise((r) => { const i = new Image(); i.onload = i.onerror = r; i.src = src; }))).then(() => setTimeout(begin, 80));
})();
</script>
</body>
</html>
