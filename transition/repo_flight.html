<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Полёт в Тейват</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%237ad0ff'/%3E%3C/svg%3E">
<link rel="preload" as="image" href="repo/vika.png">
<link rel="preload" as="image" href="repo/zhenya.png">
<style>
  /* Переход R.E.P.O.: после Subnautica, перед Тейватом.
     Два робота (Вика — розовый, Женя — синий) летят сквозь игровые миры ~3 мин.
     Музыка и длительность — QUEST_CONFIG.TRANSITIONS.REPO_FLIGHT.
     Отладка: ?fast=1 (30 с) и «Пропустить» только в отладке. */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05060c; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  #worlds { position: fixed; inset: 0; overflow: hidden; background: #05060c; }
  .world {
    position: absolute; inset: -12% -16%;
    background: center / cover no-repeat;
    opacity: 0; pointer-events: none;
    will-change: transform, opacity;
    transition: opacity 1.8s ease;
  }
  .world.on { opacity: 1; }
  html.fast .world { transition-duration: .55s; }
  #vignette {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0,0,0,.38) 100%);
  }
  #fx, #fxFront { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #fx { z-index: 3; }
  #fxFront { z-index: 8; }
  #pair {
    position: fixed; z-index: 6; left: 0; top: 0;
    width: min(56vw, 420px); height: min(62vh, 520px);
    pointer-events: none; will-change: transform;
    opacity: 0;
  }
  .bot {
    position: absolute; bottom: 0; width: 48%;
    transform-origin: 50% 80%;
    filter: drop-shadow(0 14px 16px rgba(0,0,0,.35));
  }
  #botVika { left: 0; z-index: 2; }
  #botZhenya { right: 0; z-index: 1; }
  .bot-bob { transform-origin: 50% 70%; animation: bob 0.7s ease-in-out infinite; }
  #botZhenya .bot-bob { animation-delay: -0.32s; }
  .bot img { display: block; width: 100%; height: auto; pointer-events: none; }
  #botVika img { filter: drop-shadow(0 0 16px rgba(255, 90, 170, .45)); }
  #botZhenya img { filter: drop-shadow(0 0 16px rgba(70, 140, 255, .5)); }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-7deg) scaleY(1); }
    40% { transform: translateY(-9px) rotate(-5deg) scaleY(1.03); }
    70% { transform: translateY(-3px) rotate(-8deg) scaleY(0.97); }
  }
  #pair.jump .bot { animation: hop 0.52s cubic-bezier(.2, .8, .25, 1); }
  #botZhenya.delay-hop { animation-delay: .05s; }
  @keyframes hop {
    0% { transform: translateY(0); }
    42% { transform: translateY(-34%); }
    100% { transform: translateY(0); }
  }
  #loot { position: fixed; inset: 0; z-index: 7; pointer-events: none; }
  .pickup {
    position: absolute; left: 0; top: 0; width: 52px; height: 52px;
    margin: -26px 0 0 -26px; border: 0; padding: 0; background: none;
    pointer-events: auto; cursor: pointer; touch-action: manipulation;
    will-change: transform; font-size: 32px; line-height: 52px; text-align: center;
    filter: drop-shadow(0 0 8px rgba(255, 180, 220, .8));
    animation: pickupSpin 2.8s linear infinite;
  }
  .pickup.star { font-size: 28px; filter: drop-shadow(0 0 8px rgba(255, 230, 140, .9)); }
  .pickup.gone { animation: pickupPop .32s ease forwards; pointer-events: none; }
  @keyframes pickupSpin { 50% { transform: rotate(12deg) scale(1.08); } }
  @keyframes pickupPop { to { transform: scale(1.7); opacity: 0; } }
  .floater {
    position: absolute; z-index: 9; pointer-events: none;
    font: 700 16px/1 "Segoe UI", system-ui, sans-serif; color: #ffe7a8;
    text-shadow: 0 0 8px rgba(255, 200, 80, .8); animation: floaterUp .9s ease-out forwards;
  }
  @keyframes floaterUp { to { transform: translateY(-40px); opacity: 0; } }
  #collectHud {
    position: fixed; z-index: 10; top: calc(14px + env(safe-area-inset-top, 0px));
    left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px;
    padding: 6px 14px; border-radius: 999px;
    background: rgba(8, 10, 18, .42); color: #fff;
    border: 1px solid rgba(255,255,255,.28);
    font: 600 15px/1 "Segoe UI", "Noto Sans", system-ui, sans-serif;
    letter-spacing: .04em; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    opacity: 0; transition: opacity .6s ease; pointer-events: none;
  }
  #collectHud.on { opacity: 1; }
  #collectHud .ico { color: #ff6ea8; font-size: 16px; }
  #portal {
    position: fixed; z-index: 5; left: 50%; top: 46%;
    width: min(70vw, 520px); height: min(70vw, 520px);
    transform: translate(-50%, -50%) scale(.2); opacity: 0;
    pointer-events: none; will-change: transform, opacity;
  }
  #portal.on { opacity: 1; }
  .portal-core {
    position: absolute; inset: 18%; border-radius: 50%;
    background: radial-gradient(circle, #fffef6 0%, #ffe38a 28%, #ffb14a 52%, rgba(255, 160, 60, 0) 72%);
    filter: blur(2px); animation: portalPulse 1.6s ease-in-out infinite;
  }
  .portal-ring {
    position: absolute; inset: 8%; border-radius: 50%;
    border: 3px solid rgba(255, 236, 180, .75);
    box-shadow: 0 0 40px 12px rgba(255, 200, 90, .45), inset 0 0 50px rgba(255, 240, 200, .5);
    animation: portalSpin 8s linear infinite;
  }
  .portal-ring:after {
    content: ""; position: absolute; inset: 10%; border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, .5);
  }
  @keyframes portalPulse { 50% { transform: scale(1.06); opacity: .9; } }
  @keyframes portalSpin { to { transform: rotate(360deg); } }
  #titleCard {
    position: fixed; z-index: 11; left: 50%; top: 42%;
    transform: translate(-50%, -50%); text-align: center; pointer-events: none;
    opacity: 0; transition: opacity 1.2s ease, transform 1.2s ease;
    width: min(90vw, 640px);
  }
  #titleCard.on { opacity: 1; transform: translate(-50%, -58%); }
  #titleCard .kicker {
    font: 600 13px/1.2 "Segoe UI", "Noto Sans", system-ui, sans-serif;
    letter-spacing: .28em; text-transform: uppercase; color: #fff6d0;
    text-shadow: 0 0 16px rgba(255, 200, 90, .8), 0 1px 6px rgba(40, 20, 0, .9), 0 0 2px #3a2200;
    margin-bottom: 10px;
  }
  #titleCard h1 {
    margin: 0; font: 600 clamp(48px, 14vw, 92px)/1.05 "Palatino Linotype", Palatino, "Iowan Old Style", "Times New Roman", serif;
    color: #fff6d8; letter-spacing: .08em;
    text-shadow: 0 0 18px rgba(255, 200, 90, .85), 0 0 48px rgba(255, 160, 40, .55), 0 4px 12px rgba(80, 40, 0, .45);
  }
  #worldName {
    position: fixed; z-index: 7; left: calc(16px + env(safe-area-inset-left, 0px));
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    font: 500 13px/1.2 "Segoe UI", "Noto Sans", system-ui, sans-serif;
    letter-spacing: .18em; text-transform: uppercase; color: rgba(255,255,255,.72);
    text-shadow: 0 1px 8px rgba(0,0,0,.6); pointer-events: none;
    opacity: 0; transition: opacity 1s ease;
  }
  #worldName.on { opacity: 1; }
  #worldName.off { opacity: 0; transition: none; }
  .veil { position: fixed; inset: 0; z-index: 12; pointer-events: none; background: #0a0c14; opacity: 1; transition: opacity 1.4s ease; }
  .veil.off { opacity: 0; }
  .veil.flash { background: #fff8e6; transition: opacity .35s ease; }
  .skip { position: fixed; z-index: 13; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(66px + env(safe-area-inset-bottom, 0px));
    padding: 7px 14px; border: 1px solid rgba(255,255,255,.55); border-radius: 999px; background: rgba(20, 18, 30, .4); color: rgba(255,255,255,.92);
    font: 500 14px/1.2 "Segoe UI", "Noto Sans", system-ui, sans-serif; letter-spacing: .03em;
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); cursor: pointer; opacity: 0; pointer-events: none; transition: opacity .8s ease; touch-action: manipulation; display: none; }
  .skip.allowed { display: block; }
  .skip.show { opacity: .8; pointer-events: auto; }
  .mute { position: fixed; z-index: 13; left: calc(12px + env(safe-area-inset-left, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); width: 38px; height: 38px; display: none;
    align-items: center; justify-content: center; padding: 0; border: 1px solid rgba(255,255,255,.55); border-radius: 50%; background: rgba(20, 18, 30, .4);
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); cursor: pointer; opacity: .8; touch-action: manipulation; }
  .mute.show { display: flex; }
  .mute svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .mute .off { display: none; } .mute.muted .on { display: none; } .mute.muted .off { display: inline; }
  .tap-start { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 13; display: none; padding: 14px 26px; border-radius: 999px;
    font: 600 20px/1.2 "Segoe UI", system-ui, sans-serif; color: #3a2a18; background: rgba(255, 246, 220, .88); box-shadow: 0 0 30px rgba(255, 200, 120, .7); cursor: pointer; }
  .tap-start.show { display: block; animation: tapPulse 1.8s ease-in-out infinite; }
  @keyframes tapPulse { 50% { box-shadow: 0 0 50px rgba(255, 190, 100, 1); } }
  .rf-ach {
    position: fixed; z-index: 20; left: 50%; top: calc(64px + env(safe-area-inset-top, 0px));
    transform: translateX(-50%); min-width: 220px; max-width: min(86vw, 360px);
    padding: 12px 16px 12px 14px; border-radius: 14px;
    background: rgba(16, 14, 24, .82); color: #fff; border: 1px solid rgba(255, 220, 150, .45);
    box-shadow: 0 10px 30px rgba(0,0,0,.35); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    font: 500 14px/1.35 "Segoe UI", "Noto Sans", system-ui, sans-serif;
    animation: rfAchIn .45s ease;
  }
  .rf-ach.off { animation: rfAchOut .4s ease forwards; }
  .rf-ach .kicker { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: #ffd58a; }
  .rf-ach .ttl { font-size: 15px; font-weight: 600; margin-top: 2px; }
  .rf-ach .pts { font-size: 12px; color: #ffe9b8; margin-top: 2px; }
  @keyframes rfAchIn { from { opacity: 0; transform: translate(-50%, -12px); } }
  @keyframes rfAchOut { to { opacity: 0; transform: translate(-50%, -12px); } }
  @media (max-width: 600px) {
    #pair { width: min(66vw, 300px); height: min(52vh, 400px); }
    .pickup { width: 58px; height: 58px; margin: -29px 0 0 -29px; font-size: 34px; }
    .skip { right: calc(10px + env(safe-area-inset-right, 0px)); bottom: calc(58px + env(safe-area-inset-bottom, 0px)); font-size: 13px; padding: 6px 12px; }
    #worldName { left: calc(12px + env(safe-area-inset-left, 0px)); bottom: calc(62px + env(safe-area-inset-bottom, 0px)); font-size: 11px; }
    #titleCard h1 { letter-spacing: .06em; }
  }
</style>

<body>
<div id="worlds"></div>
<div id="vignette"></div>
<canvas id="fx"></canvas>
<div id="portal" aria-hidden="true"><div class="portal-ring"></div><div class="portal-core"></div></div>
<div id="pair">
  <div class="bot" id="botVika"><div class="bot-bob"><img src="repo/vika.png" alt="Вика"></div></div>
  <div class="bot" id="botZhenya"><div class="bot-bob"><img src="repo/zhenya.png" alt="Женя"></div></div>
</div>
<canvas id="fxFront"></canvas>
<div id="loot"></div>
<div id="collectHud"><span class="ico">♥</span><span id="heartCount">0</span></div>
<div id="worldName"></div>
<div id="titleCard"><div class="kicker">Добро пожаловать</div><h1>Тейват</h1></div>
<div class="veil" id="veil"></div>
<button type="button" class="skip" id="skipBtn">Пропустить ›</button>
<button type="button" class="mute" id="muteBtn" aria-label="Звук"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#fff"/><path class="on" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="off" d="M17 9l5 6M22 9l-5 6"/></svg></button>
<div class="tap-start" id="tapStart">Коснись, чтобы полететь ✨</div>
<script>
(function () {
  "use strict";
  const ROOT = (window.QUEST_CONFIG && window.QUEST_CONFIG.TRANSITIONS) || {};
  const CFG = ROOT.REPO_FLIGHT || {};
  const FAST = /[?&]fast=1/.test(location.search);
  const DEBUG = FAST || /[?&](debug|skip)=1/.test(location.search);
  if (FAST) document.documentElement.classList.add("fast");

  const WORLDS = CFG.WORLDS || [
    { src: "repo/worlds/01_space.jpg",  name: "Космос" },
    { src: "repo/worlds/02_pixel.jpg",  name: "Пиксели" },
    { src: "repo/worlds/03_cyber.jpg",  name: "Неон" },
    { src: "repo/worlds/04_clouds.jpg", name: "Небесные острова" },
    { src: "repo/worlds/05_lava.jpg",   name: "Лава" },
    { src: "repo/worlds/06_forest.jpg", name: "Лес" },
    { src: "repo/worlds/07_ocean.jpg",  name: "Океан" },
    { src: "repo/worlds/08_teyvat.jpg", name: "Тейват" }
  ];
  const HEART_PRIMOS = CFG.HEART_PRIMOS != null ? CFG.HEART_PRIMOS : 2;
  const HEART_CAP = CFG.HEART_CAP != null ? CFG.HEART_CAP : 50;
  const HEART_KEY = "nov16_repo_hearts";

  const ENTER = FAST ? 800 : 2000;
  const END = FAST ? 7000 : 14000;
  let DURATION = FAST ? 30000 : (CFG.DURATION_MS || 180000);
  let skipped = false, started = false, doneShown = false;
  const T = {};
  function setTimeline() {
    if (skipped) return;
    T.enter = ENTER;
    T.portalAt = Math.max(ENTER + 2000, DURATION - END);
    T.flyIn = T.portalAt + END * 0.38;
    T.flash = T.portalAt + END * 0.58;
    T.titleAt = T.portalAt + END * 0.68;
    T.done = DURATION;
  }
  setTimeline();

  const worldsEl = document.getElementById("worlds");
  const worldEls = WORLDS.map((w, i) => {
    const d = document.createElement("div");
    d.className = "world" + (i === 0 ? " on" : "");
    d.style.backgroundImage = "url(" + w.src + ")";
    worldsEl.appendChild(d);
    return d;
  });
  const pair = document.getElementById("pair");
  const portal = document.getElementById("portal");
  const titleCard = document.getElementById("titleCard");
  const veil = document.getElementById("veil");
  const worldName = document.getElementById("worldName");
  const collectHud = document.getElementById("collectHud");
  const heartCountEl = document.getElementById("heartCount");
  const lootEl = document.getElementById("loot");
  const skipBtn = document.getElementById("skipBtn");
  const muteBtn = document.getElementById("muteBtn");
  const tapStart = document.getElementById("tapStart");
  const canvas = document.getElementById("fx");
  const canvasF = document.getElementById("fxFront");
  const ctx = canvas.getContext("2d");
  const ctxF = canvasF.getContext("2d");

  let jumping = false, muted = false;
  let clock = 0, lastTs = 0, curWorld = 0, lastWorldShown = -1;
  let collected = 0, awardedThisRun = 0, jumpedTimes = 0;
  let nextSpawn = 0, pickups = [];
  let W = innerWidth, H = innerHeight;
  let particles = [], lines = [];
  let audio = null, audioFailed = false, ambient = null, lastAT = -1;

  function alreadyAwarded() {
    try { return Math.max(0, parseInt(localStorage.getItem(HEART_KEY) || "0", 10) || 0); } catch (e) { return 0; }
  }
  function setAwarded(n) {
    try { localStorage.setItem(HEART_KEY, String(n)); } catch (e) {}
  }

  function ruHeart(n) {
    const m = n % 100, m1 = n % 10;
    if (m > 10 && m < 20) return n + " сердец";
    if (m1 === 1) return n + " сердце";
    if (m1 >= 2 && m1 <= 4) return n + " сердца";
    return n + " сердец";
  }
  function ruPrimo(n) {
    const m = n % 100, m1 = n % 10;
    if (m > 10 && m < 20) return n + " примогемов";
    if (m1 === 1) return n + " примоген";
    if (m1 >= 2 && m1 <= 4) return n + " примогена";
    return n + " примогемов";
  }

  function showToast(title, pts) {
    document.querySelectorAll(".rf-ach").forEach((n) => n.remove());
    const el = document.createElement("div");
    el.className = "rf-ach";
    el.innerHTML = '<div class="kicker">Достижение</div><div class="ttl"></div>' + (pts ? '<div class="pts"></div>' : "");
    el.querySelector(".ttl").textContent = title;
    if (pts) el.querySelector(".pts").textContent = pts;
    document.body.appendChild(el);
    setTimeout(() => { el.classList.add("off"); setTimeout(() => el.remove(), 450); }, 3200);
  }

  function resize() {
    W = innerWidth; H = innerHeight;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    [canvas, canvasF].forEach((c) => {
      c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
      c.style.width = W + "px"; c.style.height = H + "px";
      c.getContext("2d").setTransform(dpr, 0, 0, dpr, 0, 0);
    });
  }
  addEventListener("resize", resize); resize();

  function worldIndexAt(t) {
    const span = Math.max(1, T.portalAt - T.enter);
    const u = Math.max(0, Math.min(0.999, (t - T.enter) / span));
    return Math.min(WORLDS.length - 1, Math.floor(u * WORLDS.length));
  }
  function setWorld(i) {
    if (i === lastWorldShown) return;
    lastWorldShown = i; curWorld = i;
    worldEls.forEach((el, k) => el.classList.toggle("on", k === i));
    worldName.textContent = WORLDS[i].name || "";
    worldName.classList.add("on");
    if (i === WORLDS.length - 1) return;
    clearTimeout(setWorld._hide);
    setWorld._hide = setTimeout(() => worldName.classList.remove("on"), FAST ? 1200 : 4200);
  }

  function pairSize() {
    const pw = Math.min(W * (W < 600 ? 0.66 : 0.42), W < 600 ? 300 : 420);
    const ph = pw * (847 / 375) * 0.52;
    return { pw, ph };
  }
  function placePair(t) {
    const { pw, ph } = pairSize();
    pair.style.width = pw + "px";
    pair.style.height = ph + "px";
    const midX = W < 600 ? 0.48 : 0.36;
    let cx = W * midX, cy = H * 0.58, sc = 1, op = 1, rot = 0;
    if (t < T.enter) {
      const k = t / T.enter;
      const e = 1 - Math.pow(1 - k, 3);
      cx = W * (-0.2 + (midX + 0.2) * e);
      cy = H * (0.85 - 0.27 * e);
      sc = 0.7 + 0.3 * e;
      op = Math.min(1, k * 1.6);
    } else if (t < T.portalAt) {
      const fly = t - T.enter;
      cx = W * midX + Math.sin(fly / 900) * W * 0.03;
      cy = H * 0.58 + Math.sin(fly / 640) * H * 0.025;
      sc = 1;
      op = 1;
    } else if (t < T.flash) {
      const k = (t - T.portalAt) / Math.max(1, T.flash - T.portalAt);
      const e = k * k;
      cx = W * (midX + (0.50 - midX) * e);
      cy = H * (0.58 - 0.12 * e);
      sc = 1 + 0.7 * e;
      op = 1 - Math.max(0, (k - 0.75) * 4);
    } else {
      op = 0; sc = 1.8; cx = W * 0.5; cy = H * 0.46;
    }
    pair.style.opacity = String(op);
    pair.style.transform = "translate(" + (cx - pw / 2) + "px," + (cy - ph / 2) + "px) scale(" + sc + ") rotate(" + rot + "deg)";
  }

  function placePortal(t) {
    if (t < T.portalAt - 800) { portal.classList.remove("on"); portal.style.opacity = "0"; return; }
    portal.classList.add("on");
    let k = Math.max(0, Math.min(1, (t - (T.portalAt - 800)) / 1400));
    if (t > T.flash) k = 1;
    const pulse = 1 + Math.sin(t / 180) * 0.03;
    portal.style.opacity = String(Math.min(1, k * 1.2));
    portal.style.transform = "translate(-50%, -50%) scale(" + (0.25 + 0.95 * k) * pulse + ")";
  }

  function spawnLoot(kind, x, y) {
    if (pickups.length > 8) return;
    const el = document.createElement("button");
    el.type = "button";
    el.className = "pickup " + (kind === "star" ? "star" : "heart");
    el.textContent = kind === "star" ? "✦" : "♥";
    el.setAttribute("aria-label", kind === "star" ? "Звезда" : "Сердце");
    const item = {
      el, kind,
      x: x != null ? x : W + 40,
      y: y != null ? y : (0.18 + Math.random() * 0.52) * H,
      vx: -(0.06 + Math.random() * 0.05) * (FAST ? 1.8 : 1),
      amp: 10 + Math.random() * 18,
      freq: 0.0015 + Math.random() * 0.0015,
      phase: Math.random() * Math.PI * 2,
      born: clock,
      taken: false
    };
    el.style.left = item.x + "px";
    el.style.top = item.y + "px";
    el.addEventListener("pointerdown", (e) => { e.stopPropagation(); e.preventDefault(); collectItem(item, e.clientX, e.clientY); });
    lootEl.appendChild(el);
    pickups.push(item);
    return item;
  }
  function collectItem(item, cx, cy) {
    if (!item || item.taken) return;
    item.taken = true;
    item.el.classList.add("gone");
    setTimeout(() => item.el.remove(), 320);
    if (item.kind === "heart") {
      collected += 1;
      heartCountEl.textContent = String(collected);
      const already = alreadyAwarded();
      const remain = Math.max(0, HEART_CAP - already);
      const gain = Math.min(HEART_PRIMOS, remain);
      if (gain && window.QuestHUD) {
        QuestHUD.addPrimos(gain);
        setAwarded(already + gain);
        awardedThisRun += gain;
      }
      const fl = document.createElement("div");
      fl.className = "floater";
      fl.textContent = gain ? "+" + gain : "♥";
      fl.style.left = (cx || item.x) + "px";
      fl.style.top = (cy || item.y) + "px";
      document.body.appendChild(fl);
      setTimeout(() => fl.remove(), 900);
    }
  }
  function updateLoot(dt) {
    const inWindow = started && clock > T.enter + 600 && clock < T.portalAt - 400;
    if (inWindow && clock >= nextSpawn) {
      const kind = Math.random() < 0.72 ? "heart" : "star";
      spawnLoot(kind);
      const remain = Math.max(4000, T.portalAt - clock);
      const want = FAST ? 9 : 22;
      nextSpawn = clock + Math.max(FAST ? 700 : 1800, remain / want);
    }
    for (let i = pickups.length - 1; i >= 0; i--) {
      const p = pickups[i];
      if (p.taken) { pickups.splice(i, 1); continue; }
      p.x += p.vx * dt;
      const y = p.y + Math.sin((clock + p.phase * 400) * p.freq) * p.amp;
      p.el.style.left = p.x + "px"; p.el.style.top = y + "px";
      if (p.x < -60) { p.el.remove(); pickups.splice(i, 1); }
    }
  }

  function jump() {
    if (!started || doneShown || clock >= T.portalAt) return;
    if (jumping) return;
    jumping = true; jumpedTimes += 1;
    pair.classList.remove("jump");
    void pair.offsetWidth;
    pair.classList.add("jump");
    setTimeout(() => { pair.classList.remove("jump"); jumping = false; }, 540);
  }

  function seedParticles() {
    particles = [];
    for (let i = 0; i < 70; i++) {
      particles.push({
        x: Math.random() * W, y: Math.random() * H,
        z: 0.3 + Math.random() * 1.2,
        s: 0.6 + Math.random() * 1.8,
        a: 0.25 + Math.random() * 0.55
      });
    }
    lines = [];
    for (let i = 0; i < 18; i++) {
      lines.push({
        x: Math.random() * W, y: Math.random() * H,
        l: 30 + Math.random() * 80, v: 1.2 + Math.random() * 2.4, a: 0.08 + Math.random() * 0.18
      });
    }
  }
  seedParticles();

  function particleColor(i) {
    switch (i) {
      case 0: return "255,255,255";
      case 1: return "180,255,160";
      case 2: return "180,120,255";
      case 3: return "255,236,200";
      case 4: return "255,140,60";
      case 5: return "170,255,140";
      case 6: return "140,220,255";
      default: return "255,220,140";
    }
  }
  function drawFx(t, dt) {
    ctx.clearRect(0, 0, W, H);
    ctxF.clearRect(0, 0, W, H);
    const inFlight = started && t > 200 && t < T.flash;
    const spd = (FAST ? 2.1 : 1) * (t >= T.portalAt ? 2.2 : 1);
    const rgb = particleColor(curWorld);
    if (inFlight) {
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.x -= p.z * 0.28 * spd * dt;
        if (p.x < -8) { p.x = W + 8; p.y = Math.random() * H; }
        ctx.fillStyle = "rgba(" + rgb + "," + p.a + ")";
        if (curWorld === 1) ctx.fillRect(p.x, p.y, p.s * 2, p.s * 2);
        else { ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2); ctx.fill(); }
      }
      ctxF.strokeStyle = "rgba(255,255,255,0.18)";
      for (let i = 0; i < lines.length; i++) {
        const ln = lines[i];
        ln.x -= ln.v * 0.55 * spd * dt;
        if (ln.x < -ln.l) { ln.x = W + ln.l; ln.y = Math.random() * H; }
        ctxF.globalAlpha = ln.a;
        ctxF.beginPath();
        ctxF.moveTo(ln.x, ln.y);
        ctxF.lineTo(ln.x + ln.l, ln.y);
        ctxF.stroke();
      }
      ctxF.globalAlpha = 1;
    }
    worldEls.forEach((el, i) => {
      if (!el.classList.contains("on") && Math.abs(i - curWorld) > 1) return;
      const local = t / 1000;
      const drift = -((local * 6) % 16);
      el.style.transform = "translate3d(" + drift + "%, 0, 0) scale(1.14)";
    });
  }

  function finish() {
    if (doneShown) return;
    doneShown = true;
    window.__repoFlight.done = true;
    titleCard.classList.add("on");
    worldName.classList.remove("on");
    worldName.classList.add("off");
    collectHud.classList.remove("on");
    skipBtn.classList.remove("show");
    if (awardedThisRun > 0 || collected > 0) {
      const title = CFG.TOAST || "Сердца собраны";
      showToast(title + " — " + ruHeart(collected), awardedThisRun ? ("+" + ruPrimo(awardedThisRun)) : "");
    }
    if (window.QuestHUD) {
      QuestHUD.setStep("done");
      QuestHUD.showNext("Дальше");
    }
    fadeAudio(800);
  }

  function fadeAudio(ms) {
    const start = performance.now();
    const fromFile = audio && !audio.paused ? audio.volume : 0;
    const fromAmb = ambient && ambient.gain ? ambient.gain.gain.value : 0;
    function tick(now) {
      const k = Math.min(1, (now - start) / ms);
      if (audio) audio.volume = Math.max(0, fromFile * (1 - k));
      if (ambient && ambient.gain) ambient.gain.gain.value = Math.max(0, fromAmb * (1 - k));
      if (k < 1) requestAnimationFrame(tick);
      else {
        try { if (audio) audio.pause(); } catch (e) {}
        try { if (ambient && ambient.stop) ambient.stop(); } catch (e) {}
      }
    }
    requestAnimationFrame(tick);
  }

  function frame(ts) {
    if (!lastTs) lastTs = ts;
    const dt = Math.min(64, ts - lastTs);
    lastTs = ts;
    if (audio && !skipped && !audio.paused && !audio.ended && audio.currentTime !== lastAT) {
      lastAT = audio.currentTime;
      clock = lastAT * 1000;
    } else {
      clock += dt;
    }
    if (clock > T.done) clock = T.done;
    const t = clock;
    if (t >= T.enter) setWorld(worldIndexAt(t));
    else setWorld(0);
    placePair(t);
    placePortal(t);
    updateLoot(dt);
    drawFx(t, dt);
    if (t >= T.flash && !veil.classList.contains("flash")) {
      veil.classList.add("flash");
      veil.classList.remove("off");
      veil.style.opacity = "1";
      requestAnimationFrame(() => { setTimeout(() => { veil.style.opacity = "0"; }, 80); });
    }
    if (t >= T.titleAt) titleCard.classList.add("on");
    if (DEBUG && !skipped && t > T.enter + 400 && t < T.portalAt) skipBtn.classList.add("show");
    else skipBtn.classList.remove("show");
    if (t >= T.done) finish();
    if (started && !doneShown) requestAnimationFrame(frame);
    else if (doneShown) { placePair(T.done); placePortal(T.done); }
    window.__repoFlight.t = t;
    window.__repoFlight.world = curWorld;
    window.__repoFlight.collected = collected;
    window.__repoFlight.awarded = awardedThisRun;
  }

  /* ----- audio ----- */
  const musicSrc = (CFG.MUSIC && String(CFG.MUSIC).trim() && String(CFG.MUSIC).trim() !== "null") ? String(CFG.MUSIC).trim() : "";
  const MKEY = "nov16_repo_muted";
  function getMutedPref() { try { return localStorage.getItem(MKEY) === "1"; } catch (e) { return false; } }
  function setMuted(m) {
    muted = !!m;
    muteBtn.classList.toggle("muted", muted);
    try { localStorage.setItem(MKEY, muted ? "1" : "0"); } catch (e) {}
    if (audio) audio.muted = muted;
    if (ambient && ambient.gain) ambient.gain.gain.value = muted ? 0 : (ambient.base || 0.07);
  }

  function makeAmbient(actx) {
    const master = actx.createGain();
    master.gain.value = 0.07;
    master.connect(actx.destination);
    const freqs = [174.6, 220, 261.6, 329.6];
    const oscs = freqs.map((f, i) => {
      const o = actx.createOscillator();
      o.type = "sine";
      o.frequency.value = f;
      const g = actx.createGain();
      g.gain.value = 0.12 - i * 0.02;
      const fil = actx.createBiquadFilter();
      fil.type = "lowpass";
      fil.frequency.value = 520;
      o.connect(g); g.connect(fil); fil.connect(master);
      o.start();
      return o;
    });
    const lfo = actx.createOscillator();
    lfo.frequency.value = 0.07;
    const lfoG = actx.createGain();
    lfoG.gain.value = 0.03;
    lfo.connect(lfoG); lfoG.connect(master.gain);
    lfo.start();
    return {
      gain: master, base: 0.07,
      stop: function () { try { oscs.forEach((o) => o.stop()); lfo.stop(); } catch (e) {} }
    };
  }

  if (musicSrc && !FAST) {
    audio = new Audio();
    audio.preload = "auto";
    audio.setAttribute("playsinline", "");
    audio.src = musicSrc + (/[?]/.test(musicSrc) ? "&" : "?") + "v=20261115p19";
    audio.addEventListener("error", () => { audioFailed = true; });
    audio.addEventListener("loadedmetadata", () => {
      if (!FAST && isFinite(audio.duration) && audio.duration > 0) {
        DURATION = Math.max(20000, audio.duration * 1000);
        setTimeline();
      }
    });
  }

  function startAudio() {
    if (muted) return;
    if (audio && !audioFailed) {
      const pr = audio.play();
      if (pr && pr.catch) pr.catch(() => {});
      return;
    }
    if (!ambient) {
      try {
        const actx = new (window.AudioContext || window.webkitAudioContext)();
        if (actx.state === "suspended") actx.resume().catch(() => {});
        ambient = makeAmbient(actx);
        if (muted) ambient.gain.gain.value = 0;
      } catch (e) {}
    }
  }

  function start() {
    if (started) return;
    started = true;
    window.__repoFlight.started = true;
    tapStart.classList.remove("show");
    veil.classList.add("off");
    collectHud.classList.add("on");
    nextSpawn = ENTER + (FAST ? 500 : 1600);
    if (window.QuestHUD) QuestHUD.setStep("fly");
    startAudio();
    requestAnimationFrame(frame);
  }

  function skip() {
    if (!DEBUG || skipped || !started || doneShown) return;
    skipped = true; window.__repoFlight.skipped = true;
    skipBtn.classList.remove("show");
    clock = T.portalAt;
    lastTs = 0;
    pickups.forEach((p) => p.el.remove());
    pickups = [];
  }

  if (DEBUG) skipBtn.classList.add("allowed");
  skipBtn.addEventListener("pointerdown", (e) => e.stopPropagation());
  skipBtn.addEventListener("click", (e) => { e.stopPropagation(); skip(); });

  muteBtn.classList.add("show");
  setMuted(getMutedPref());
  muteBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    const next = !muted;
    setMuted(next);
    if (!next && started) startAudio();
  });

  addEventListener("pointerdown", (e) => {
    if (!e.target || !e.target.closest) return;
    if (e.target.closest(".qhud-next, .qhud-btn, .qhud, .qhud-hint, .qhud-panel, .skip, .mute, .pickup, .tap-start")) return;
    if (!started) return;
    jump();
  }, { passive: true });

  window.__repoFlight = {
    t: 0, duration: function () { return DURATION; }, T, world: 0,
    collected: 0, awarded: 0, jumped: function () { return jumpedTimes; },
    started: false, done: false, skipped: false, debug: DEBUG, fast: FAST,
    skip, jump, start,
    spawnLoot: function (kind, x, y) { return spawnLoot(kind || "heart", x, y); },
    collectAll: function () {
      pickups.slice().forEach((p) => collectItem(p, p.x, p.y));
    }
  };

  function begin() {
    if (musicSrc && !FAST && !audioFailed) {
      tapStart.classList.add("show");
      const go = () => { tapStart.removeEventListener("click", go); start(); };
      tapStart.addEventListener("click", go);
      return;
    }
    start();
  }

  const preload = WORLDS.map((w) => w.src).concat(["repo/vika.png", "repo/zhenya.png"]);
  Promise.all(preload.map((src) => new Promise((r) => { const i = new Image(); i.onload = i.onerror = r; i.src = src; }))).then(() => setTimeout(begin, 120));
})();
</script>
</body>
